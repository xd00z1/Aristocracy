    facts:
      - "First performed at the Dresden Court Opera on 9 December 1905, in one act; Strauss set Hedwig Lachmann's German translation of Oscar Wilde's play, which Wilde had written in French in 1891, cutting the text himself."
      - "Salome, Herod's stepdaughter, dances the Dance of the Seven Veils for the head of Jochanaan, John the Baptist, and kisses it when it comes; Herod has the soldiers crush her under their shields."
      - "Vienna's censor refused it for the Court Opera despite Mahler; the Austrian premiere was in Graz on 16 May 1906 under Strauss, with Mahler, Puccini, Schoenberg and Berg in the house, and the Vienna Court Opera did not stage it until 1918."
      - "The Metropolitan Opera gave it once, on 22 January 1907, and withdrew it under pressure from its board; the first Salome, Marie Wittich, declined to do the dance herself and a dancer stood in."
    remark: "The censor kept it off the Court Opera stage until 1918, so the Austrian premiere was Graz in May 1906 with Strauss conducting and Mahler, Puccini, Schoenberg and Berg in the audience; that is the performance to mention."
    gaffe: "Expecting waltzes or an interval. It is one act of about a hundred minutes, the dance is the Seven Veils and the first Salome would not dance it herself; the waltzes are Rosenkavalier, six years later."
