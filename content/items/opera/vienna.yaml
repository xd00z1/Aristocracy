  - id: opera.lehar
    discipline: opera
    kind: creator
    title: "Franz Lehár"
    city: vienna
    difficulty: 1
    era: Viennese operetta
    year: 1870
    year_end: 1948
    pronunciation: "LAY-har"
    facts:
      - "Born at Komárom in Hungary on 30 April 1870, the son of a military bandmaster; trained as a violinist at the Prague Conservatory and was himself an army bandmaster, lastly in Vienna, until 1902."
      - "Die lustige Witwe (1905) made him; the operettas of the 1920s, Paganini (1925), Der Zarewitsch (1927), Friederike (1928) and Das Land des Lächelns (1929), were written around the tenor Richard Tauber, whose song in the last is 'Dein ist mein ganzes Herz'."
      - "Giuditta, his last stage work, opened at the Vienna State Opera on 20 January 1934 with Tauber and Jarmila Novotná; he died at Bad Ischl on 24 October 1948, where his villa on the Traun is a museum."
      - "Hitler's favourite operetta was The Merry Widow. Lehár stayed in Vienna after the Anschluss, his Jewish wife Sophie protected by a special status, while his librettist Fritz Löhner-Beda, who had written Das Land des Lächelns, was murdered at Auschwitz in December 1942."
    remark: "Every Lehár of the 1920s has a tenor part built for Richard Tauber, and 'Dein ist mein ganzes Herz' from Das Land des Lächelns is the one Tauber sang in every language he had; the composer was a Hungarian bandmaster's son who stayed in Vienna through the Nazi years."
    gaffe: "Counting him among the Strausses, or the Widow as Golden Age. He was born in Hungary in 1870, trained in Prague, and is the Silver Age of operetta, the generation after Die Fledermaus."
    distractors:
