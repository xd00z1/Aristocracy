# Vienna, opera. Mozart's Vienna operas, Gluck's reform, Beethoven's one opera,
# operetta from the Theater an der Wien, Strauss's Rosenkavalier, the Staatsoper.
# Themes are transcribed from public-domain LilyPond sources (Mutopia and
# published arrangements checked against each other); see the note on each.
items:
  # ---------------------------------------------------------------------------
  # Mozart
  # ---------------------------------------------------------------------------

  - id: opera.mozart.le-nozze-di-figaro
    discipline: opera
    kind: work
    title: "Le nozze di Figaro (The Marriage of Figaro)"
    creator: Wolfgang Amadeus Mozart
    city: vienna
    difficulty: 1
    era: Classical
    year: 1786
    language: Italian
    pronunciation: "leh NOT-seh dee FEE-ga-ro"
    facts:
      - "First performed at the Burgtheater, Vienna, on 1 May 1786, with a libretto by Lorenzo Da Ponte after Beaumarchais's play La Folle Journée, ou Le Mariage de Figaro (1784)."
      - "Joseph II had forbidden the play on the Vienna stage; Da Ponte's libretto dropped its political speeches, and the emperor let the opera through."
      - "One 'mad day' at Count Almaviva's castle near Seville: Figaro and Susanna are to marry, the Count wants Susanna, and the Countess and Susanna conspire to catch him out."
      - "Cherubino, the page, is a trouser role for a mezzo-soprano; Figaro's 'Non più andrai' closes Act I and Cherubino's 'Voi che sapete' comes in Act II."
    remark: "The play was banned in Vienna and the opera was not; Da Ponte cut Figaro's politics, kept the bedroom doors, and Joseph II let it through in 1786."
    gaffe: "Running it together with Rossini. The Barber of Seville is the earlier play and the later opera (1816); Mozart's Figaro is the sequel, with Figaro now the Count's valet and about to be married."
    theme:
      notes: "Bb4/4 F4/8 F4/8 | C5/4 F4/8 F4/8 | D5/4 Bb4/16. C5/32 D5/16. Eb5/32 | C5/4 R/4 | D5/4 Eb5/8 E5/8 | F5/8. D5/16 Bb4/8 R/8 | C5/4 C#5/8 D5/8 | Eb5/4 R/4"
      tempo: 66
      key: B-flat major
      note: "'Voi che sapete', Cherubino's arietta in Act II; the opening vocal phrase in the original key."
    distractors:
      creator: [Antonio Salieri, Giovanni Paisiello, Joseph Haydn]
      title: ["Don Giovanni", "Così fan tutte", "Il barbiere di Siviglia"]
      era: [Baroque, Romantic, Verismo]
    links: [opera.mozart.don-giovanni, opera.mozart.cosi-fan-tutte, opera.da-ponte, opera.term.voice-types]
    tags: [opera, mozart, da-ponte, vienna, burgtheater, 1780s]
    sources:
      - "Grove Music Online, 'Nozze di Figaro, Le'"
      - "Tim Carter, W. A. Mozart: Le nozze di Figaro (Cambridge Opera Handbooks, 1987)"
    reviewed_by: null

  - id: opera.mozart.don-giovanni
    discipline: opera
    kind: work
    title: "Don Giovanni"
    creator: Wolfgang Amadeus Mozart
    city: vienna
    difficulty: 1
    era: Classical
    year: 1787
    language: Italian
    pronunciation: "don jo-VAHN-nee"
    facts:
      - "First performed in Prague at the Nostitz (now Estates) Theatre on 29 October 1787; Vienna heard it at the Burgtheater on 7 May 1788 with numbers Mozart added for the Viennese cast."
      - "For Vienna Mozart wrote 'Dalla sua pace' for the tenor Francesco Morella, who found 'Il mio tesoro' too hard, and 'Mi tradì quell'alma ingrata' for Caterina Cavalieri as Donna Elvira."
      - "Da Ponte called it a dramma giocoso; the Commendatore, killed in the first scene, returns as a stone statue and drags the unrepentant Don down to hell."
      - "Leporello's catalogue aria counts the Don's conquests by country: 640 in Italy, 231 in Germany, 100 in France, 91 in Turkey, and in Spain already 1,003."
    remark: "Prague had it first, in October 1787; Vienna got it seven months later with 'Dalla sua pace' added because the Viennese tenor could not manage 'Il mio tesoro'."
    gaffe: "Giving the catalogue aria to the Don. 'Madamina, il catalogo è questo' is Leporello's, the servant reading the list to Donna Elvira, and the Spanish total is 1,003."
    theme:
      notes: "A4/8 A4/16 B4/16 C#5/8 A4/8 | F#4/8 B4/4. | G#4/8 G#4/16 G#4/16 A4/8 B4/8 | E4/4 R/4 | A4/8 A4/16 B4/16 C#5/8 A4/8 | F#4/8 B4/4 A4/8 | A4/16 G#4/16 F#4/16 E4/16 E4/8 F#4/16 G#4/16 | A4/4 R/4"
      tempo: 66
      key: A major
      note: "'Là ci darem la mano', the Act I duet; Don Giovanni's opening phrase, which he sings an octave below this and Zerlina answers at this pitch."
    distractors:
      creator: [Antonio Salieri, Domenico Cimarosa, Giovanni Paisiello]
      title: ["Le nozze di Figaro", "Così fan tutte", "Die Entführung aus dem Serail"]
      era: [Baroque, Romantic, Bel canto]
    links: [opera.mozart.le-nozze-di-figaro, opera.mozart.cosi-fan-tutte, opera.da-ponte, opera.venue.staatsoper]
    tags: [opera, mozart, da-ponte, prague, vienna, 1780s]
    sources:
      - "Grove Music Online, 'Don Giovanni'"
      - "Julian Rushton, W. A. Mozart: Don Giovanni (Cambridge Opera Handbooks, 1981)"
    reviewed_by: null

  - id: opera.mozart.cosi-fan-tutte
    discipline: opera
    kind: work
    title: "Così fan tutte"
    creator: Wolfgang Amadeus Mozart
    city: vienna
    difficulty: 2
    era: Classical
    year: 1790
    language: Italian
    pronunciation: "ko-ZEE fahn TOOT-teh"
    facts:
      - "First performed at the Burgtheater on 26 January 1790; the third and last Mozart and Da Ponte opera, subtitled La scuola degli amanti, the school for lovers."
      - "Joseph II died on 20 February 1790 and the court theatres closed in mourning after a handful of performances; the run resumed that summer."
      - "Two officers, Ferrando and Guglielmo, bet the cynic Don Alfonso that their fiancées Fiordiligi and Dorabella will stay faithful, then woo each other's fiancée in disguise; the maid Despina is in on it."
      - "Nineteenth-century audiences thought the plot immoral and it was rewritten or left alone; its standing in the repertory dates from the twentieth century."
    remark: "It is the men who make the wager: Don Alfonso bets two officers that their fiancées will stray within a day, and the title, 'they all do it', is his verdict when they do."
    gaffe: "Pronouncing it 'cosy fan tootie'. It is ko-ZEE fahn TOOT-teh, and tutte is feminine: 'so do all women', which is the whole of Don Alfonso's argument."
    distractors:
      creator: [Antonio Salieri, Domenico Cimarosa, Vicente Martín y Soler]
      title: ["Le nozze di Figaro", "Don Giovanni", "La clemenza di Tito"]
      era: [Baroque, Romantic, Verismo]
    links: [opera.mozart.le-nozze-di-figaro, opera.mozart.don-giovanni, opera.da-ponte]
    tags: [opera, mozart, da-ponte, vienna, burgtheater, 1790s]
    sources:
      - "Grove Music Online, 'Così fan tutte'"
      - "Bruce Alan Brown, W. A. Mozart: Così fan tutte (Cambridge Opera Handbooks, 1995)"
    reviewed_by: null

  - id: opera.mozart.die-zauberfloete
    discipline: opera
    kind: work
    title: "Die Zauberflöte (The Magic Flute)"
    creator: Wolfgang Amadeus Mozart
    city: vienna
    difficulty: 1
    era: Classical
    year: 1791
    language: German
    pronunciation: "dee TSOW-ber-flur-teh"
    facts:
      - "First performed on 30 September 1791 at the Theater auf der Wieden, Emanuel Schikaneder's suburban theatre; Schikaneder wrote the words and played Papageno, and Mozart died on 5 December."
      - "A Singspiel: sung numbers with spoken dialogue in German, not recitative."
      - "The Queen of the Night's second aria, 'Der Hölle Rache kocht in meinem Herzen', climbs to F above high C; the role was created by Mozart's sister-in-law Josepha Hofer."
      - "Papageno the bird-catcher has panpipes and a set of magic bells, Tamino the flute; Sarastro, the bass, sings 'O Isis und Osiris'. Mozart and Schikaneder were Freemasons, and the three chords and the trials are usually read as Masonic."
    remark: "It opened in a suburb, not at court: Schikaneder's Theater auf der Wieden, where the impresario wrote the words and played Papageno himself, some nine weeks before Mozart died."
    gaffe: "Taking the Queen of the Night for the heroine because she has the famous aria. By Act II she is the villain, and Sarastro, whom she wants murdered, is the good one."
    theme:
      notes: "R/8 A4/8 A4/8 A4/8 | D5/4. A4/8 F5/8 F5/8 E5/8 E5/8 | D5/4 A4/4 R/2 | G5/2 R/4 E5/8 C#5/8 | A5/4 D5/4 R/2"
      tempo: 132
      key: D minor
      note: "'Der Hölle Rache', the Queen of the Night's Act II aria; the vocal entry after one bar of orchestra."
    distractors:
      creator: [Joseph Haydn, Antonio Salieri, Carl Maria von Weber]
      title: ["Die Entführung aus dem Serail", "Der Freischütz", "Fidelio"]
      era: [Baroque, Romantic, Verismo]
    links: [opera.term.singspiel, opera.mozart.le-nozze-di-figaro, opera.beethoven.fidelio, opera.da-ponte]
    tags: [opera, singspiel, mozart, schikaneder, vienna, 1790s]
    sources:
      - "Grove Music Online, 'Zauberflöte, Die'"
      - "Peter Branscombe, W. A. Mozart: Die Zauberflöte (Cambridge Opera Handbooks, 1991)"
    reviewed_by: null

