  - id: opera.da-ponte
    discipline: opera
    kind: creator
    title: "Lorenzo Da Ponte"
    city: vienna
    difficulty: 3
    era: Classical
    year: 1749
    year_end: 1838
    facts:
      - "Born Emanuele Conegliano in the Jewish community of Ceneda in the Veneto on 10 March 1749; the family converted when he was fourteen and took the name of the local bishop, and he was ordained a priest in 1773."
      - "Banished from Venice in 1779 for adultery and for living in a brothel; came to Vienna in 1781 and in 1783 became poet to Joseph II's Italian opera company at the court theatre."
      - "Wrote the librettos of Le nozze di Figaro (1786), Don Giovanni (1787) and Così fan tutte (1790) for Mozart, and Una cosa rara for Martín y Soler, which outsold them all at the time."
      - "Left Vienna after Joseph II's death, spent years in London, and emigrated to America in 1805, where he kept a grocery in Pennsylvania and in 1825 became the first professor of Italian at Columbia College; he died in New York in 1838."
    remark: "A Venetian priest banished for adultery who wrote Figaro, Don Giovanni and Così, then ended as a grocer in Pennsylvania and the first professor of Italian at Columbia; the life outdid the librettos."
    gaffe: "Assuming he wrote The Magic Flute. That is Schikaneder's; Da Ponte's Mozart operas are the three Italian ones."
    distractors:
      person: [Emanuel Schikaneder, Pietro Metastasio, Ranieri de' Calzabigi]
      era: [Baroque, Romantic, Verismo]
    links: [opera.mozart.le-nozze-di-figaro, opera.mozart.don-giovanni, opera.mozart.cosi-fan-tutte, opera.mozart.die-zauberfloete]
    tags: [librettist, venice, vienna, mozart, new-york, 1700s]
    sources:
      - "Grove Music Online, 'Da Ponte, Lorenzo'"
      - "Sheila Hodges, Lorenzo Da Ponte: The Life and Times of Mozart's Librettist (1985)"
    reviewed_by: null

  - id: opera.r-strauss
    discipline: opera
    kind: creator
    title: "Richard Strauss"
    city: vienna
    difficulty: 2
    era: Late Romantic
    year: 1864
    year_end: 1949
    facts:
      - "Born in Munich on 11 June 1864, the son of Franz Strauss, principal horn of the Munich court orchestra; died at Garmisch-Partenkirchen on 8 September 1949."
      - "Salome (Dresden, 1905), after Oscar Wilde's play, was kept off the Vienna Court Opera stage by the censor when Mahler wanted to give it; Vienna's opera did not stage it until 1918."
      - "Elektra (1909) and Der Rosenkavalier (1911), both with Hugo von Hofmannsthal, followed at Dresden; the two worked together until the poet's death in 1929."
      - "Co-director of the Vienna State Opera with Franz Schalk from 1919 to 1924; he liked to say that Salome's royalties had built his villa at Garmisch."
    remark: "No relation to the waltz Strausses: a Bavarian, son of Munich's principal horn, whose Salome the Vienna censor kept off the Court Opera stage from 1905 until 1918."
    gaffe: "Filing him with Johann Strauss as a Viennese. Richard was a Munich man, born in 1864, and Salome, Elektra and Der Rosenkavalier all opened in Dresden."
    distractors:
      person: [Gustav Mahler, Alexander von Zemlinsky, Hans Pfitzner]
      era: [Classical, Baroque, Bel canto]
    links: [opera.r-strauss.der-rosenkavalier, opera.strauss-ii.die-fledermaus, opera.venue.staatsoper]
    tags: [composer, munich, dresden, vienna, staatsoper, 1900s]
    sources:
      - "Grove Music Online, 'Strauss, Richard'"
      - "Michael Kennedy, Richard Strauss: Man, Musician, Enigma (1999)"
    reviewed_by: null

