  - id: opera.venue.theater-an-der-wien
    discipline: opera
    kind: venue
    title: "Theater an der Wien"
    location: "Vienna, Linke Wienzeile"
    city: vienna
    difficulty: 1
    era: Classical
    year: 1801
    pronunciation: "teh-AH-ter ahn dair VEEN"
    facts:
      - "Opened on 13 June 1801 by Emanuel Schikaneder, the librettist and first Papageno of Die Zauberflöte, to replace his Theater auf der Wieden; the Wien in the name is the river it stands on, and the Papagenotor on Millöckergasse, with Schikaneder as Papageno, survives from the original building."
      - "Beethoven lodged in the building and used it: Fidelio opened there on 20 November 1805, the Eroica had its first public performance there on 7 April 1805, and the concert of 22 December 1808 introduced the Fifth and Sixth Symphonies."
      - "The operetta house of the Golden and Silver Ages: Die Fledermaus (1874), Der Zigeunerbaron (1885) and Die lustige Witwe (1905) all opened here."
      - "Closed after the Staatsoper company left in 1955, reopened in 1962, and from the 1980s a musicals house, where Cats ran for seven years from 1983; since 2006, the Mozart year, it has been an opera house again on the stagione system, one production at a time."
    remark: "The Wien in the name is the river, not the city: Schikaneder built it on the Wien in 1801, Beethoven lodged in it and gave Fidelio there, Fledermaus and The Merry Widow opened on its stage, and it spent the 1980s running Cats before going back to opera in 2006."
    gaffe: "Calling it a musicals house. It was one from the 1980s to 2006; since then it has been Vienna's third opera house, one production at a time, and it is the room where Fidelio, the Eroica and Die Fledermaus were first heard."
    distractors:
