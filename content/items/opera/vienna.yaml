  - id: opera.gluck.orfeo-ed-euridice
    discipline: opera
    kind: work
    title: "Orfeo ed Euridice"
    creator: Christoph Willibald Gluck
    city: vienna
    difficulty: 2
    era: Classical
    year: 1762
    language: Italian
    pronunciation: "or-FEH-o ed eh-oo-REE-dee-cheh"
    facts:
      - "First performed at the Burgtheater, Vienna, on 5 October 1762, with a libretto by Ranieri de' Calzabigi."
      - "Orfeo was written for the alto castrato Gaetano Guadagni; for Paris in 1774 Gluck rewrote the role for a high tenor and the work became Orphée et Eurydice."
      - "Gluck and Calzabigi set out to rid opera of vocal display and da capo ornament, the programme Gluck spelled out in the preface to Alceste, published in 1769."
      - "Orfeo loses Euridice a second time by looking back, sings 'Che farò senza Euridice', and is about to kill himself when Amore restores her; the ending is happy."
    remark: "The great lament is in C major and the ending is happy: Amore relents and hands Euridice back, because the Vienna of 1762 had no appetite for Ovid's version."
    gaffe: "Announcing that Orfeo is a tenor. In Vienna he was the castrato Guadagni, today he is a mezzo or a countertenor, and the tenor version is the Paris one of 1774."
    theme:
      notes: "E4/8 F4/8 | G4/4. G4/8 G4/4. C5/8 | C5/8 B4/8 B4/4 R/4 C5/8 G4/8 | A4/4. A4/8 G4/4 F4/4 | F4/4 E4/8 R/8"
      tempo: 80
      key: C major
      note: "'Che farò senza Euridice', Act III; the vocal line from its first entry, in the Vienna key of C major."
    distractors:
      creator: [Joseph Haydn, Johann Adolf Hasse, Niccolò Jommelli]
      title: ["Alceste", "Iphigénie en Tauride", "Paride ed Elena"]
      era: [Baroque, Romantic, Bel canto]
    links: [opera.mozart.le-nozze-di-figaro, opera.term.castrato]
    tags: [opera, gluck, reform, castrato, vienna, burgtheater, 1760s]
    sources:
      - "Grove Music Online, 'Orfeo ed Euridice'"
      - "Patricia Howard (ed.), C. W. von Gluck: Orfeo (Cambridge Opera Handbooks, 1981)"
    reviewed_by: null

  - id: opera.beethoven.fidelio
    discipline: opera
    kind: work
    title: "Fidelio"
    creator: Ludwig van Beethoven
    city: vienna
    difficulty: 1
    era: Classical / early Romantic
    year: 1805
    language: German
    pronunciation: "fee-DAY-lee-o"
    facts:
      - "First performed at the Theater an der Wien on 20 November 1805, a week after Napoleon's troops had occupied Vienna; the audience was largely French officers and it closed after three nights."
      - "Beethoven revised it in 1806 and again, thoroughly, in 1814; the 1814 version is the one performed, and the earlier title was Leonore."
      - "Beethoven's only opera. It has four overtures, Leonore Nos. 1, 2 and 3 and the Fidelio overture of 1814; Mahler started the custom of playing Leonore No. 3 before the final scene."
      - "Leonore disguises herself as the youth Fidelio to free her husband Florestan from Pizarro's prison; the libretto descends from Bouilly's Léonore, ou L'amour conjugal (1798)."
    remark: "Its first audience in November 1805 was mostly French officers, because Napoleon's army had marched into Vienna the week before; it ran for three nights."
    gaffe: "Asking which of Beethoven's operas it is. There is only one, though it has four overtures, and the Leonore No. 3 often played before the finale was Mahler's habit, not Beethoven's."
    theme:
      notes: "E5/4. B4/8 B4/4 R/4 | G#5/4. E5/8 E5/4 R/4 | B5/4. G#5/8 G#5/4 E6/4 | D#6/4 R/4 R/2"
      tempo: 240
      key: E major
      note: "Fidelio overture (1814), the opening fanfare, top line; alla breve, the fermata approximated by rests."
    distractors:
      creator: [Carl Maria von Weber, Luigi Cherubini, Franz Schubert]
      title: ["Der Freischütz", "Die Zauberflöte", "Euryanthe"]
      era: [Baroque, Verismo, Bel canto]
    links: [music.beethoven.symphony-5.i, opera.mozart.die-zauberfloete, opera.term.singspiel, opera.venue.staatsoper]
    tags: [opera, beethoven, rescue-opera, theater-an-der-wien, vienna, 1800s]
    sources:
      - "Grove Music Online, 'Fidelio'"
      - "Paul Robinson (ed.), Ludwig van Beethoven: Fidelio (Cambridge Opera Handbooks, 1996)"
    reviewed_by: null

