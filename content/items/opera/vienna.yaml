  - id: opera.lehar.die-lustige-witwe
    discipline: opera
    kind: work
    title: "Die lustige Witwe (The Merry Widow)"
    creator: Franz Lehár
    city: vienna
    difficulty: 1
    era: Viennese operetta
    year: 1905
    language: German
    pronunciation: "dee LOOS-tig-eh VIT-veh"
    facts:
      - "First performed at the Theater an der Wien on 30 December 1905, with Mizzi Günther as Hanna Glawari and Louis Treumann as Danilo; the libretto is by Victor Léon and Leo Stein, after Henri Meilhac's comedy L'Attaché d'ambassade (1861)."
      - "Hanna, a rich widow from Pontevedro, a Balkan state standing in for Montenegro, is in Paris; the embassy's Baron Zeta wants her millions kept at home by marrying her to Count Danilo, her old love, who refuses to court money."
      - "The numbers: Hanna's 'Vilja-Lied', Danilo's 'Da geh' ich zu Maxim', and the Act III duet 'Lippen schweigen', the Merry Widow Waltz."
      - "London had it at Daly's Theatre in June 1907 with Lily Elsie, New York that October; the 'Merry Widow hat' was a fashion, and the Silver Age of Viennese operetta is dated from it."
    remark: "Danilo will not court a woman with millions in case it looks like the money, so the two dance instead of talking until Act III, when 'Lippen schweigen' lets the violins say it; it opened at the Theater an der Wien on 30 December 1905 and was in London and New York within two years."
    gaffe: "Calling it Strauss, or Lehár Viennese by birth. He was a Hungarian bandmaster's son from Komárom, and the Widow belongs to the Silver Age of operetta, thirty years after Die Fledermaus."
    distractors:
      creator: [Johann Strauss II, Emmerich Kálmán, Oscar Straus]
