  - id: opera.term.opera-ball
    discipline: opera
    kind: term
    title: "Opernball (the Vienna Opera Ball)"
    city: vienna
    difficulty: 1
    era: Twentieth century
    year: 1935
    definition: "The ball held inside the Vienna State Opera on the Thursday before Ash Wednesday, the last great night of the Viennese carnival: the stalls are floored over level with the stage, dress is white tie and floor-length, and a committee of debutantes in white opens the dancing."
    pronunciation: "OH-pern-bal"
    language: German
    facts:
      - "The Court Opera held its first ball soirée in 1877; the first ball under the name Wiener Opernball was in 1935, and the modern series dates from 1956, the first carnival after the rebuilt house reopened."
      - "The seats come out and a dance floor goes in level with the stage in the days before; dress is white tie for men and floor-length for women, and the debutantes' committee, in white with tiaras, opens with a polonaise before the call of 'Alles Walzer' clears the floor for everyone."
      - "It was cancelled in 1991 during the Gulf War and in 2021 and 2022 for the pandemic; the demonstrations against it in the late 1980s and 1990s, the Opernballdemo, became a fixture of their own."
    remark: "The seats come out and a floor goes in level with the stage, so the debutantes open the ball on what is normally the set; it is white tie, on the Thursday before Ash Wednesday, and it was cancelled in 1991 for the Gulf War."
    gaffe: "Turning up in black tie, or calling it the Philharmonic Ball. Black tie is turned away at the door, the Philharmonic's ball is another night in the Musikverein, and the Opernball is the Staatsoper's own, once a year, on the Thursday before Ash Wednesday."
    distractors:
      term:
        - "The gala performance that opens the Vienna State Opera's season each September, with the orchestra on stage and the audience in evening dress."
        - "The Vienna Philharmonic's carnival ball in the Golden Hall of the Musikverein in January."
        - "The New Year's Eve performance of Die Fledermaus at the State Opera, followed by dancing in the foyers."
    links: [opera.venue.staatsoper, opera.strauss-ii.die-fledermaus, opera.term.operetta, history.person.franz-joseph]
    tags: [term, ball, fasching, debutantes, staatsoper, waltz, vienna]
    sources:
      - "Wiener Staatsoper, 'The Vienna Opera Ball: history'"
      - "Wien Geschichte Wiki, 'Opernball'"
    reviewed_by: null

  - id: opera.term.regietheater
    discipline: opera
    kind: term
    title: "Regietheater"
    city: vienna
    difficulty: 2
    era: Twentieth century
    year: 1976
    year_approx: true
    definition: "German for director's theatre: opera staging in which the director's concept, not the libretto's stated time and place, governs the production, relocating or reinterpreting the work and sometimes contradicting its text; used by admirers and, more often, by opponents."
    pronunciation: "reh-ZHEE-teh-ah-ter"
    language: German
    facts:
      - "The usual starting point is Patrice Chéreau's centenary Ring at Bayreuth in 1976, which set Wagner among the dams and frock coats of the industrial nineteenth century; it was booed in 1976 and given a long ovation in its last year, 1980."
      - "Its roots are earlier: Wieland Wagner cleared the scenery off the Bayreuth stage from 1951, and Walter Felsenstein's Komische Oper in East Berlin made the director's reading the point of the evening from 1947."
      - "Hans Neuenfels's Frankfurt Aida of 1981, with Aida as a cleaning woman, and Calixto Bieito's Entführung at the Berlin Komische Oper in 2004, set in a brothel, are the productions opponents cite; English critics say 'director's theatre' or, less kindly, 'Eurotrash'."
      - "Vienna's Staatsoper has been the conservative pole: Otto Schenk's 1968 production of Der Rosenkavalier is still in the repertory, and the Theater an der Wien has taken the newer stagings since 2006."
    remark: "It is a German word for a German habit: Chéreau's Bayreuth Ring of 1976, booed on its first night and cheered off in 1980, is where the argument starts, and Otto Schenk's 1968 Rosenkavalier, still on at the Staatsoper, is the argument on the other side."
    gaffe: "Using it to mean modern dress. Updated costumes are the least of it; the word means the director's reading outranks the libretto, and a production can be in period and still be Regietheater if it rewrites what happens."
    distractors:
      term:
        - "A production that follows the composer's stage directions and reproduces the sets and costumes of the premiere."
        - "The German repertory system, in which a house keeps a resident company and rotates dozens of works through a season."
        - "The practice of performing opera in the language of the audience rather than the original."
    links: [opera.r-strauss.der-rosenkavalier, opera.venue.staatsoper, opera.venue.theater-an-der-wien, opera.mozart.die-entfuehrung-aus-dem-serail]
    tags: [term, staging, director, bayreuth, chereau, staatsoper, vienna]
    sources:
      - "Grove Music Online, 'Production'"
      - "Frederic Spotts, Bayreuth: A History of the Wagner Festival (1994)"
      - "Carolyn Abbate and Roger Parker, A History of Opera (2012)"
    reviewed_by: null

  - id: opera.term.prompter
    discipline: opera
    kind: term
    title: "Prompter (Souffleur, Souffleuse)"
    city: vienna
    difficulty: 1
    era: Nineteenth century
    definition: "The person in the hooded box at the front centre of the stage who, facing the singers and watching the conductor, gives them the first words of each phrase a moment before they sing them; the Souffleur or Souffleuse of a German house, the maestro suggeritore of an Italian one."
    pronunciation: "soo-FLUR, soo-FLURZ"
    language: French
    facts:
      - "The opera prompter's box is sunk into the stage at the front centre with its hood towards the audience; the prompter sees the conductor on a monitor or in a mirror and passes on words and, when needed, the beat."
      - "In the spoken theatre the prompter sat at the side of the stage, which is why 'prompt side' and 'opposite prompt' are still British names for the two sides, prompt side usually being stage left."
      - "A repertory house such as the Staatsoper, which changes its opera almost every night on little rehearsal, still depends on prompters; the Metropolitan Opera keeps a box too, and some houses have done away with theirs."
      - "The word is from the French souffler, to breathe or whisper; the Italian suggeritore is the one who suggests."
    remark: "The hooded hump at the front of the stage is the prompter's box, and in a repertory house like the Staatsoper, which can change its opera every night on a morning's rehearsal, the Souffleuse is the one feeding every singer the next line a beat early."
    gaffe: "Assuming a singer who glances at the box has dried. The prompt is routine and a word ahead, and in a house running dozens of operas a season almost nobody sings without it; the one who has forgotten is the one who stops."
    distractors:
      term:
        - "The stage manager who calls the scene changes and lighting cues from the wings, 'on the book'."
        - "The répétiteur who plays the piano at rehearsals and coaches the singers in their roles."
        - "A paid group in the audience who lead the applause at agreed moments, the claque."
    links: [opera.venue.staatsoper, opera.venue.covent-garden, opera.term.voice-types]
    tags: [term, prompter, souffleur, stage, repertory, staatsoper, vienna]
    sources:
      - "The Oxford Companion to Music (ed. Alison Latham, 2002), 'Prompter'"
      - "John Warrack and Ewan West, The Oxford Dictionary of Opera (1992), 'Prompter'"
    reviewed_by: null
