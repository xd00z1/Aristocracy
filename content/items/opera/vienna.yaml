  - id: opera.gluck
    discipline: opera
    kind: creator
    title: "Christoph Willibald Gluck"
    city: vienna
    difficulty: 2
    era: Classical
    year: 1714
    year_end: 1787
    pronunciation: "GLOOK"
    facts:
      - "Born at Erasbach in the Upper Palatinate on 2 July 1714, a forester's son; worked in Milan, London and Prague before settling in Vienna, where he married a merchant's daughter in 1750 and died on 15 November 1787."
      - "With the librettist Ranieri de' Calzabigi he made the Vienna reform operas, Orfeo ed Euridice (1762), Alceste (1767) and Paride ed Elena (1770); the printed dedication of Alceste (1769) is the manifesto: music to serve the poetry, no da capo repeats, no ornament for its own sake."
      - "He had taught the Archduchess Maria Antonia her music in Vienna; as Marie Antoinette she backed him in Paris, where Iphigénie en Aulide (1774) set off the pamphlet war between his partisans and Niccolò Piccinni's."
      - "A papal Knight of the Golden Spur from 1756, hence 'Ritter von Gluck'; the Paris operas run to Armide (1777) and Iphigénie en Tauride (1779), after which strokes ended his career."
    remark: "A Bavarian forester's son who taught Marie Antoinette her music in Vienna and followed her to Paris, where his Iphigénie en Aulide of 1774 started the Gluckist and Piccinnist quarrel; the reform manifesto is the preface to Alceste, printed in 1769."
    gaffe: "Shelving him with Handel as Baroque because he wrote an Orpheus. The point of Gluck is the break with Baroque opera: no da capo arias, no display for its own sake, the drama first; Berlioz worshipped him and Wagner revised his Iphigénie en Aulide for Dresden."
