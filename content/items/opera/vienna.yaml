  - id: opera.strauss-ii.die-fledermaus
    discipline: opera
    kind: work
    title: "Die Fledermaus"
    creator: Johann Strauss II
    city: vienna
    difficulty: 1
    era: Viennese operetta
    year: 1874
    language: German
    pronunciation: "dee FLAY-der-mowss"
    facts:
      - "First performed at the Theater an der Wien on 5 April 1874; the libretto by Carl Haffner and Richard Genée derives from Meilhac and Halévy's French play Le Réveillon."
      - "Dr Falke pays Eisenstein back for once leaving him to walk home in daylight dressed as a bat: he lures him to Prince Orlofsky's ball, where Eisenstein flirts with his own masked wife."
      - "Prince Orlofsky is a trouser role for a mezzo-soprano; Adele's laughing song 'Mein Herr Marquis' and the Act II 'Brüderlein und Schwesterlein' are the numbers people hum."
      - "The Vienna State Opera plays it on New Year's Eve, a tradition of long standing."
    remark: "The Staatsoper puts it on every New Year's Eve, and the Russian prince throwing the party is sung by a woman; if Orlofsky sounds like a mezzo, that is the casting, not the acoustics."
    gaffe: "Calling Johann Strauss the father of Richard Strauss. Richard was from Munich and no relation; Johann's father was the other Johann Strauss, of the Radetzky March."
    theme:
      notes: "R/4 Db5/4 | Ab4/8 Db5/8 Ab4/4 Gb4/4 Bb4/4 | F4/4 Ab4/4 Eb4/4 R/8 Eb4/8 | F4/4 Ab4/4 Bb4/4 Bb4/16 Gb5/16 R/8 | Ab4/2. Db5/4 | Ab4/8 Db5/8 Ab4/4 Gb4/4 Bb4/4 | F4/4 Ab4/4 Eb4/4 R/8 Eb4/8 | F4/4 Ab4/4 Bb4/4 Bb4/16 Gb5/16 R/8 | Ab4/2 R/2"
      tempo: 144
      key: D-flat major
      note: "'Ich lade gern mir Gäste ein' (Chacun à son goût), Orlofsky's couplets in Act II; the vocal entry, after the 1875 Schreiber vocal score."
    distractors:
      creator: [Franz von Suppé, Carl Millöcker, Jacques Offenbach]
      title: ["Der Zigeunerbaron", "Eine Nacht in Venedig", "Die lustige Witwe"]
      era: [Classical, Grand opéra, Verismo]
    links: [opera.term.operetta, opera.venue.staatsoper, opera.beethoven.fidelio, opera.r-strauss, opera.term.voice-types]
    tags: [operetta, strauss, theater-an-der-wien, vienna, new-year, 1870s]
    sources:
      - "Grove Music Online, 'Fledermaus, Die'"
      - "Richard Traubner, Operetta: A Theatrical History (2nd ed., 2003)"
    reviewed_by: null

  - id: opera.r-strauss.der-rosenkavalier
    discipline: opera
    kind: work
    title: "Der Rosenkavalier"
    creator: Richard Strauss
    city: vienna
    difficulty: 1
    era: Late Romantic
    year: 1911
    language: German
    pronunciation: "dair ROH-zen-ka-va-leer"
    facts:
      - "First performed at the Dresden Court Opera on 26 January 1911, with a libretto by Hugo von Hofmannsthal; the Vienna Court Opera followed in April 1911."
      - "Set in Vienna in the 1740s, early in Maria Theresa's reign: the Marschallin gives up her young lover Octavian, who falls for Sophie while presenting the silver rose on behalf of the boorish Baron Ochs."
      - "Octavian is a trouser role for a mezzo-soprano; the Marschallin, Octavian and Sophie end the opera with a trio, and then Octavian and Sophie with a duet."
      - "The waltzes are an anachronism; the Viennese waltz belongs to the century after the opera's setting."
    remark: "The waltzes are an anachronism: the story is set in Maria Theresa's 1740s, two generations before the Viennese waltz, and it is still the most Viennese opera there is."
    gaffe: "Calling it a Vienna premiere. It opened in Dresden in January 1911, as Salome and Elektra had; Vienna's Court Opera got it that April."
    distractors:
      creator: [Gustav Mahler, Franz Schreker, Erich Wolfgang Korngold]
      title: ["Salome", "Elektra", "Ariadne auf Naxos"]
      era: [Classical, Baroque, Verismo]
    links: [opera.r-strauss, opera.venue.staatsoper, opera.strauss-ii.die-fledermaus, opera.term.voice-types]
    tags: [opera, strauss, hofmannsthal, dresden, vienna, maria-theresa, 1910s]
    sources:
      - "Grove Music Online, 'Rosenkavalier, Der'"
      - "Alan Jefferson, Richard Strauss: Der Rosenkavalier (Cambridge Opera Handbooks, 1985)"
    reviewed_by: null

