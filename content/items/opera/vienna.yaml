  - id: opera.venue.staatsoper
    discipline: opera
    kind: venue
    title: "Wiener Staatsoper (Vienna State Opera)"
    location: Vienna
    city: vienna
    difficulty: 1
    era: Ringstrasse era
    year: 1869
    facts:
      - "Opened on the Ringstrasse on 25 May 1869 as the Court Opera (Hofoper) with Mozart's Don Giovanni; the architects, August Sicard von Sicardsburg and Eduard van der Nüll, both died in 1868 before the opening, van der Nüll by his own hand."
      - "Gustav Mahler was its director from 1897 to 1907; it became the State Opera after the monarchy fell in 1918."
      - "The auditorium was destroyed by bombing on 12 March 1945; the house reopened on 5 November 1955 with Fidelio under Karl Böhm."
      - "The Vienna Opera Ball takes over the auditorium on the Thursday before Ash Wednesday, with the stalls floored over for dancing."
    remark: "It opened in 1869 with Don Giovanni and neither architect lived to see it: van der Nüll hanged himself after the design was ridiculed, and Sicardsburg died within weeks."
    gaffe: "Calling it the Volksoper. That is the other Vienna house, out by the Gürtel, for operetta and opera in German; the Staatsoper is the one on the Ring."
    distractors:
      title: ["Volksoper Wien", "Theater an der Wien", "Burgtheater"]
    links: [opera.mozart.don-giovanni, opera.beethoven.fidelio, opera.strauss-ii.die-fledermaus, opera.r-strauss]
    tags: [venue, vienna, opera-house, ringstrasse, opera-ball, mahler]
    sources:
      - "Wiener Staatsoper, 'History of the Vienna State Opera'"
      - "Grove Music Online, 'Vienna'"
    reviewed_by: null

  - id: opera.term.singspiel
    discipline: opera
    kind: term
    title: Singspiel
    city: vienna
    difficulty: 2
    era: Classical
    definition: "A German-language opera with spoken dialogue between the musical numbers instead of sung recitative; the Viennese form of the late eighteenth century, of which Die Zauberflöte is the summit."
    pronunciation: "ZING-shpeel (plural ZING-shpee-leh)"
    language: German
    facts:
      - "Joseph II founded a National Singspiel company at the Burgtheater in 1778 to promote opera in German; Mozart's Die Entführung aus dem Serail (1782) was written for it."
      - "Die Zauberflöte (1791) is a Singspiel; so, technically, is Fidelio (1805), which keeps spoken dialogue; the line runs on to Weber's Der Freischütz (1821)."
      - "The plural is Singspiele."
    remark: "It simply means that they talk between the numbers: The Magic Flute and Fidelio are both Singspiele, and the spoken dialogue is what modern productions cut or rewrite."
    gaffe: "Treating it as a lesser form, or as a musical. Mozart and Beethoven wrote Singspiele; the word describes the spoken dialogue, not the ambition."
    distractors:
      term:
        - "An Italian comic opera in two acts with a buffo bass and a patter finale."
        - "A short one-act German opera without chorus, performed as a curtain-raiser."
        - "A song cycle for voice and piano staged with costumes and scenery."
