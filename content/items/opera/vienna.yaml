  - id: opera.berg.wozzeck
    discipline: opera
    kind: work
    title: "Wozzeck"
    creator: Alban Berg
    city: vienna
    difficulty: 3
    era: Modernist
    year: 1925
    language: German
    pronunciation: "VOT-sek"
    facts:
      - "Berg, born in Vienna in 1885 and Schoenberg's pupil, saw Georg Büchner's unfinished play at its Vienna premiere in May 1914; he composed the opera between 1914 and 1922, around his war service, and Erich Kleiber gave the premiere at the Berlin State Opera on 14 December 1925."
      - "Three acts of five scenes each, every scene built as an instrumental form: the suite, passacaglia and rondo of Act I, the five-movement symphony of Act II, the inventions of Act III; the D minor interlude before the last scene is where the score turns tonal."
      - "The soldier Wozzeck, shaved, lectured and fed on beans by the Captain and the Doctor, cuts Marie's throat by the pond and drowns looking for the knife; their child rides his hobby-horse in the last scene while the others run off to see the body."
      - "The name is a misreading: Karl Emil Franzos, editing Büchner's manuscripts in 1879, read Woyzeck as Wozzeck, and Berg kept the spelling. The Vienna State Opera first gave it in March 1930 under Clemens Krauss."
    remark: "Berg saw Büchner's play in Vienna in May 1914 and needed eight years and a war to make it an opera, and the title keeps a misprint: Franzos, reading Büchner's hand in 1879, made Woyzeck into Wozzeck, and Berg never corrected it."
    gaffe: "Calling it twelve-tone. Wozzeck is atonal but not serial; Berg's row technique arrives with Lulu, and the shape of Wozzeck is old forms, a passacaglia, a symphony, a set of inventions, hidden under the drama."
