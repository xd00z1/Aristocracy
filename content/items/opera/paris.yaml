  - id: opera.offenbach
    discipline: opera
    kind: creator
    title: "Jacques Offenbach"
    city: paris
    difficulty: 1
    era: Romantic
    year: 1819
    year_end: 1880
    pronunciation: "zhahk OFF-en-bahk"
    facts:
      - "Born Jacob Offenbach in Cologne on 20 June 1819, the son of a synagogue cantor who had taken the name of his home town, Offenbach am Main; he came to the Paris Conservatoire as a cellist in 1833 and died in Paris on 5 October 1880."
      - "He opened his own theatre, the Bouffes-Parisiens, in 1855; its licence at first allowed only one-act pieces for a handful of singers, and Orphée aux enfers (1858) was his first full-length work once the rule was relaxed."
      - "La belle Hélène (1864), La Vie parisienne (1866), La Grande-Duchesse de Gérolstein (1867) and La Périchole (1868) made him the composer of the Second Empire; he was naturalised French in 1860. Rossini is said to have called him the Mozart of the Champs-Élysées."
      - "After the war of 1870 he was attacked in Paris as a German and in Germany as the man who had mocked the Empire; Les contes d'Hoffmann, his one serious opera, was unfinished when he died."
    remark: "He was the Second Empire's court jester and its one German: after 1870 France remembered where he was born and Germany remembered whom he had mocked, and the Hoffmann he did not live to finish was his bid to be taken seriously."
    gaffe: "Calling him a Viennese operetta composer. He is the Paris original; Johann Strauss took up the form after Offenbach's Vienna successes, and Die Fledermaus is 1874, sixteen years after Orphée."
