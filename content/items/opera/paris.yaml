  - id: opera.massenet.werther.pourquoi-me-reveiller
    discipline: opera
    kind: work
    title: "Pourquoi me réveiller"
    parent: "Werther (1892)"
    creator: Jules Massenet
    city: paris
    difficulty: 1
    era: Romantic
    year: 1892
    language: French
    pronunciation: "poor-KWAH muh ray-vay-YAY"
    facts:
      - "Massenet finished Werther in 1887; Léon Carvalho, director of the Opéra-Comique, turned it down as too gloomy, and the work opened instead at the Vienna Hofoper, in German, on 16 February 1892, with the Belgian tenor Ernest Van Dyck as Werther."
      - "Paris heard it on 16 January 1893, given by the Opéra-Comique company at the Théâtre Lyrique while the Salle Favart was being rebuilt after the fire of 1887."
      - "The libretto, by Édouard Blau, Paul Milliet and Georges Hartmann, follows Goethe's novel of 1774; the aria comes in Act 3, on Christmas Eve, when Werther reads Charlotte his translation of Ossian, the passage Goethe's Werther reads to Lotte in the book."
      - "Charlotte is a mezzo-soprano; Werther shoots himself with pistols borrowed from her husband Albert and dies as children sing a carol outside; Massenet later arranged the title role for the baritone Mattia Battistini, who sang it in St Petersburg in 1902."
    remark: "The words are not the librettists' but Ossian's: Werther is reading Charlotte his translation of Macpherson's counterfeit Gaelic bard, which is exactly what Goethe has him read to Lotte before he shoots himself."
    gaffe: "Calling it a German opera because it opened in Vienna. It is French through and through; Vienna took it after the Opéra-Comique had refused it as too gloomy, and Paris caught up a year later."
    distractors:
