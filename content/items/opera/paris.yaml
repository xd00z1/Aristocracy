  # Gounod: Faust (Théâtre Lyrique, 1859)
  # ---------------------------------------------------------------------------

  - id: opera.gounod.faust.jewel-song
    discipline: opera
    kind: work
    title: "Ah! je ris de me voir si belle (Jewel Song)"
    parent: "Faust (1859)"
    creator: Charles Gounod
    city: paris
    difficulty: 1
    era: Romantic
    year: 1859
    language: French
    pronunciation: "ah, zhuh REE duh muh VWAHR see BEL"
    facts:
      - "Faust opened at the Théâtre Lyrique, Paris, on 19 March 1859, with spoken dialogue; sung recitatives came later, and the Walpurgis Night ballet was added when the work entered the Opéra in 1869."
      - "Marguerite sings it in the garden in Act 3, having found a casket of jewels that Méphistophélès has left to tempt her; it is a waltz, and she sings it to a mirror."
      - "The libretto is by Jules Barbier and Michel Carré, after Part One of Goethe's Faust; in Germany the opera is often billed as Margarethe."
      - "The Metropolitan Opera opened its first season with Faust on 22 October 1883, with Christine Nilsson as Marguerite."
    remark: "It is a waltz sung to a mirror: Marguerite has just opened a box of jewels left by the devil, and it is the one aria Bianca Castafiore in Tintin ever sings."
    gaffe: "Calling the opera 'Goethe's Faust'. Gounod set only the Gretchen story from Part One, which is why the Germans bill it as Margarethe."
    distractors:
      creator: [Georges Bizet, Jules Massenet, Ambroise Thomas]
      title: ["Salut, demeure chaste et pure", "Le veau d'or est toujours debout", "Il était un roi de Thulé"]
      era: [Baroque, Classical, Verismo]
    links: [opera.term.opera-comique, opera.term.grand-opera, opera.term.aria]
    tags: [aria, soprano, gounod, faust, paris, 1850s]
    sources:
      - "Grove Music Online, 'Faust' (Gounod)"
      - "Steven Huebner, The Operas of Charles Gounod (1990)"
