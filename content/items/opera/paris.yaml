  # ---------------------------------------------------------------------------
  # The founders: Lully and Rameau
  # ---------------------------------------------------------------------------

  - id: opera.lully
    discipline: opera
    kind: creator
    title: "Jean-Baptiste Lully"
    city: paris
    difficulty: 2
    era: Baroque
    year: 1632
    year_end: 1687
    pronunciation: "zhahn bah-TEEST lew-LEE"
    facts:
      - "Born Giovanni Battista Lulli in Florence on 28 November 1632; brought to France as a boy in 1646 and naturalised in 1661."
      - "Louis XIV's surintendant de la musique; in 1672 he acquired the privilege of the Académie Royale de Musique, which gave him a monopoly on sung drama in France."
      - "With the poet Philippe Quinault he created the tragédie en musique: Cadmus et Hermione (1673), Alceste (1674), Atys (1676) and Armide (1686); before that he wrote the comédies-ballets with Molière, including Le Bourgeois gentilhomme (1670)."
      - "Struck his own foot with the long staff he beat time with while conducting a Te Deum for the king's recovery in January 1687, and died of the gangrene on 22 March."
    remark: "French opera was founded by a Florentine with a royal monopoly; Lully bought the privilege in 1672, and after that nobody in France could stage a sung drama without his leave."
    gaffe: "Calling him an Italian composer. He was born Lulli in Florence, but he was naturalised in 1661, and his operas are in French, for Louis XIV."
    media:
      image:
        commons: "File:Paul Mignard - Jean-Baptiste Lully.jpg"
        source: "Paul Mignard, portrait of Jean-Baptiste Lully, Musée Condé, Chantilly, via Wikimedia Commons"
        license: "Public domain (painter died 1691); verify the file's tag when fetching"
    distractors:
      person: [Jean-Philippe Rameau, Marc-Antoine Charpentier, Marin Marais]
      era: [Renaissance, Classical, Romantic]
    links: [opera.rameau, opera.venue.palais-garnier]
    tags: [composer, baroque, lully, louis-xiv, versailles, paris, 1600s]
    sources:
      - "Grove Music Online, 'Lully, Jean-Baptiste'"
      - "Jérôme de La Gorce, Jean-Baptiste Lully (2002)"
    reviewed_by: null

  - id: opera.rameau
    discipline: opera
    kind: creator
    title: "Jean-Philippe Rameau"
    city: paris
    difficulty: 2
    era: Baroque
    year: 1683
    year_end: 1764
    pronunciation: "zhahn fee-LEEP rah-MOH"
    facts:
      - "Baptised in Dijon on 25 September 1683; died in Paris on 12 September 1764."
      - "Published the Traité de l'harmonie in 1722 and was known for years as a theorist and organist before his first opera, Hippolyte et Aricie, at the Académie Royale de Musique in 1733, when he was nearly fifty."
      - "Les Indes galantes (1735), Castor et Pollux (1737), Dardanus (1739) and the comedy Platée (1745) followed; Les Boréades was never staged in his lifetime."
      - "Saw two Native Americans from Louisiana dance at the Théâtre-Italien in 1725, wrote a harpsichord piece called Les Sauvages, and later reworked it for the last entrée of Les Indes galantes."
      - "Attacked from both sides: by the partisans of Lully in the 1730s for too much harmony, and by Rousseau in the Querelle des Bouffons of the 1750s for not being Italian."
    remark: "He was nearly fifty before he wrote an opera, having been famous for a decade as the man who wrote the treatise on harmony; the Lullistes complained that Hippolyte et Aricie had too much of it."
    gaffe: "Filing him under Lully as more of the same. Rameau's first opera came forty-six years after Lully's death, and the Lullistes attacked it for being too modern."
    media:
      image:
        commons: "File:Attribué à Joseph Aved, Portrait de Jean-Philippe Rameau (vers 1728) - 001.jpg"
        source: "Attributed to Joseph Aved, portrait of Jean-Philippe Rameau (c. 1728), Musée des Beaux-Arts de Dijon, via Wikimedia Commons"
        license: "Public domain (painter died 1766); verify the file's tag when fetching"
    distractors:
      person: [Jean-Baptiste Lully, François Couperin, André Campra]
      era: [Renaissance, Classical, Romantic]
    links: [opera.lully]
    tags: [composer, baroque, rameau, harmony, dijon, paris, 1700s]
    sources:
      - "Grove Music Online, 'Rameau, Jean-Philippe'"
      - "Cuthbert Girdlestone, Jean-Philippe Rameau: His Life and Work (rev. ed., 1969)"
    reviewed_by: null

