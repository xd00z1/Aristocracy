      - "The company began in the fairground theatres of Paris around 1715 and merged with the Comédie-Italienne in 1762; the house is named after Charles-Simon Favart, the eighteenth-century librettist who ran it."
      - "Three theatres have stood on the site: the first Salle Favart of 1783 burned in 1838, the second, of 1840, burned on 25 May 1887 with 84 dead, and the third, by Louis Bernier, opened in December 1898."
      - "Carmen (1875), Les contes d'Hoffmann (1881), Lakmé (1883), Manon (1884), Louise (1900) and Pelléas et Mélisande (1902) all had their premieres with the company; Werther's Paris premiere in 1893 was given at the Théâtre Lyrique while the house was being rebuilt."
      - "It is a separate company from the Opéra, a few hundred metres from the Garnier and just off the boulevard des Italiens, and has been a théâtre national since 2005."
    remark: "Three theatres on the same spot: the Salle Favart of 1783 burned in 1838, its successor burned in 1887 with eighty-four dead, and the third, of 1898, is where Pelléas opened in 1902."
    gaffe: "Assuming the Opéra-Comique is part of the Opéra. It is a separate company with its own house a few hundred metres away, and Carmen, Manon and Pelléas were its premieres, not the Opéra's."
    distractors:
      title: ["Palais Garnier", "Théâtre des Bouffes-Parisiens", "Théâtre Lyrique"]
    links: [opera.term.opera-comique, opera.bizet.carmen.habanera, opera.debussy.pelleas-et-melisande, opera.venue.palais-garnier, opera.venue.opera-bastille]
    tags: [venue, opera-house, salle-favart, opera-comique, paris, 1780s, 1890s]
    sources:
      - "Grove Music Online, 'Opéra-Comique'"
      - "Nicole Wild and David Charlton, Théâtre de l'Opéra-Comique, Paris: répertoire 1762–1972 (2005)"
