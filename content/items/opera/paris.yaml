  # ---------------------------------------------------------------------------
  # Debussy: Pelléas et Mélisande (Opéra-Comique, 1902)
  # ---------------------------------------------------------------------------

  - id: opera.debussy.pelleas-et-melisande
    discipline: opera
    kind: work
    title: "Pelléas et Mélisande"
    creator: Claude Debussy
    city: paris
    difficulty: 2
    era: Early modern
    year: 1902
    language: French
    pronunciation: "pel-lay-AHSS ay may-lee-ZAHND"
    facts:
      - "First performed at the Opéra-Comique on 30 April 1902, conducted by André Messager, with the Scottish soprano Mary Garden as Mélisande and Jean Périer as Pelléas."
      - "The text is Maurice Maeterlinck's Symbolist play of 1892, set almost word for word; Maeterlinck wanted his companion Georgette Leblanc for Mélisande and, refused, attacked the production in print before the premiere."
      - "Golaud finds Mélisande weeping by a spring in a forest and marries her; his half-brother Pelléas falls in love with her, and Golaud kills him."
      - "Debussy's only completed opera. Fauré and Sibelius wrote incidental music for the same play, and Schoenberg a tone poem."
    remark: "Nobody in it raises their voice: the text is Maeterlinck's play set nearly word for word, and Debussy's only finished opera has no set-piece arias at all, which is the point rather than a defect."
    gaffe: "Confusing it with Fauré's or Sibelius's Pelléas, which are incidental music for the play, or with Schoenberg's tone poem. Only Debussy's is an opera."
    distractors:
      creator: [Gabriel Fauré, Maurice Ravel, Paul Dukas]
      title: ["L'heure espagnole", "Ariane et Barbe-bleue", "Pénélope"]
      era: [Baroque, Romantic, Verismo]
    links: [opera.term.opera-comique, opera.massenet.thais.meditation]
    tags: [opera, debussy, maeterlinck, symbolism, paris, 1900s]
    sources:
      - "Grove Music Online, 'Pelléas et Mélisande'"
      - "Roger Nichols and Richard Langham Smith, Claude Debussy: Pelléas et Mélisande (Cambridge Opera Handbooks, 1989)"
    reviewed_by: null

  # ---------------------------------------------------------------------------
  # Berlioz: Les Troyens
  # ---------------------------------------------------------------------------

  - id: opera.berlioz.les-troyens
    discipline: opera
    kind: work
    title: "Les Troyens"
    creator: Hector Berlioz
    city: paris
    difficulty: 3
    era: Romantic
    year: 1858
    language: French
    pronunciation: "lay trwah-YAN"
    facts:
      - "Berlioz wrote his own libretto from Virgil's Aeneid and composed the score between 1856 and 1858; the Opéra declined to stage it."
      - "Only the second half, as Les Troyens à Carthage, was performed in his lifetime, with cuts, at the Théâtre Lyrique on 4 November 1863; the first complete staging was at Karlsruhe in December 1890, over two evenings."
      - "Covent Garden gave it in one evening under Rafael Kubelík in 1957; the Opéra Bastille opened its first season with it on 17 March 1990."
      - "Cassandre in the Trojan acts and Didon in the Carthaginian acts are both mezzo-soprano roles; the 'Royal Hunt and Storm' is the orchestral interlude that turns up in concerts."
    remark: "Berlioz never saw the Trojan acts staged; Paris gave him half of it, cut, in 1863, and the whole thing waited for Karlsruhe in 1890 and Covent Garden in 1957."
    gaffe: "Calling it Berlioz's Faust. La damnation de Faust is a different work and not written for the stage; Les Troyens is Virgil, in five acts and about four hours."
    distractors:
      creator: [Giacomo Meyerbeer, Charles Gounod, Camille Saint-Saëns]
      title: ["La damnation de Faust", "Benvenuto Cellini", "Béatrice et Bénédict"]
      era: [Baroque, Classical, Verismo]
    links: [opera.venue.covent-garden, opera.venue.palais-garnier, opera.term.grand-opera]
    tags: [opera, berlioz, virgil, mezzo, paris, 1850s]
    sources:
      - "Grove Music Online, 'Troyens, Les'"
      - "David Cairns, Berlioz: Servitude and Greatness, 1832–1869 (1999)"
      - "Hugh Macdonald, Berlioz (1982)"
