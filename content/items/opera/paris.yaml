  - id: opera.venue.palais-garnier
    discipline: opera
    kind: venue
    title: "Palais Garnier"
    location: "Place de l'Opéra, Paris"
    city: paris
    difficulty: 1
    era: Second Empire
    year: 1875
    pronunciation: "pah-LEH gar-NYAY"
    facts:
      - "Charles Garnier, aged 35, won the competition for the new opera house in 1861; Napoleon III commissioned it as part of Haussmann's rebuilding of Paris, but it opened under the Third Republic, on 5 January 1875."
      - "In 1896 a counterweight from the chandelier fell into the auditorium and killed a spectator; Gaston Leroux used the accident in Le Fantôme de l'Opéra (1910), along with the water tank beneath the stage."
      - "Marc Chagall's ceiling, commissioned by André Malraux, was unveiled on 23 September 1964; it is painted on removable panels fixed over Lenepveu's original of 1872."
      - "The Opéra Bastille, designed by Carlos Ott, was inaugurated on 13 July 1989; since then most opera is given there, and the Garnier is chiefly the house of the ballet."
    remark: "Napoleon III ordered it and never saw it finished; it opened in January 1875 under the Third Republic, five years after his empire had fallen."
    gaffe: "Booking the Garnier expecting an opera. Since the Bastille opened in 1989 the Garnier is mostly ballet; check the poster before you boast about your seats."
    distractors:
      title: ["Opéra Bastille", "Opéra-Comique (Salle Favart)", "Théâtre des Champs-Élysées"]
