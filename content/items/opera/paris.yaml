  # ---------------------------------------------------------------------------

  - id: opera.meyerbeer
    discipline: opera
    kind: creator
    title: "Giacomo Meyerbeer"
    city: paris
    difficulty: 2
    era: Romantic
    year: 1791
    year_end: 1864
    pronunciation: "JAH-ko-mo MY-er-bair"
    facts:
      - "Born Jakob Liebmann Beer near Berlin on 5 September 1791, the son of a Jewish banker; the Meyer came from his mother's family. He died in Paris on 2 May 1864."
      - "Studied with the Abbé Vogler at Darmstadt alongside Carl Maria von Weber, then spent the years 1816 to 1824 in Italy writing Italian operas, ending with Il crociato in Egitto (Venice, 1824)."
      - "Robert le diable (1831), Les Huguenots (1836) and Le prophète (1849) at the Paris Opéra made him the most performed opera composer of the century; L'Africaine was staged in 1865, the year after his death. From 1842 he was also Prussian Generalmusikdirektor in Berlin."
      - "His support helped get Wagner's Rienzi staged at Dresden in 1842; Wagner repaid him in 1850 with the anonymous pamphlet 'Das Judenthum in der Musik'."
    remark: "Wagner owed him Rienzi and repaid him with 'Das Judenthum in der Musik'; the most performed opera composer of the nineteenth century is now known chiefly through the attack on him."
    gaffe: "Calling him a French composer. He was a Berlin banker's son who wrote Italian operas for Venice before he ever wrote for Paris, and he held the Prussian court's music post while the Opéra lived off Les Huguenots."
