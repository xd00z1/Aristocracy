  # Massenet: Thaïs (Opéra, 1894)
  # ---------------------------------------------------------------------------

  - id: opera.massenet.thais.meditation
    discipline: opera
    kind: work
    title: "Méditation (from Thaïs)"
    parent: "Thaïs (1894)"
    creator: Jules Massenet
    city: paris
    difficulty: 1
    era: Romantic
    year: 1894
    language: French
    pronunciation: "may-dee-tah-SYON; tah-EES"
    facts:
      - "Thaïs opened at the Opéra, in the Palais Garnier, on 16 March 1894, with Sibyl Sanderson, the American soprano Massenet wrote the role for; the libretto is by Louis Gallet, after Anatole France's novel of 1890."
      - "The Méditation is an intermezzo for solo violin and orchestra between the two scenes of Act 2; while it plays, Thaïs, a courtesan in Alexandria, resolves to follow the monk Athanaël into the desert."
      - "Athanaël is a baritone; by the last act it is he who burns with desire and she who dies a saint."
      - "Massenet's other repertory operas are Manon (Opéra-Comique, 1884) and Werther, first given in Vienna in 1892."
    remark: "It is the sound of a courtesan converting: the violin plays between the two scenes of Act 2 while Thaïs decides to follow the monk, and by the last act the monk wants her and she is dying a saint."
    gaffe: "Treating it as a stand-alone violin piece by 'the man who wrote the Méditation'. It is an entr'acte from Thaïs, and Massenet's reputation rests on Manon and Werther."
    theme:
      notes: "F#5/2 F#5/8 D5/8 A4/16 D5/16 F#5/8 | B5/2 C#6/4 D6/4 | D5/4. E5/8 F#5/16 G5/32 F#5/32 E5/16 F#5/16 A5/8 A4/8 | B4/2. C#5/8 D5/8"
      tempo: 66
      key: D major
      note: "Solo violin from its entry after the harp introduction, Andante religioso. The opening tied note is re-struck; the triplet in bar 1 and the five-note turn in bar 3 are approximated."
    distractors:
      creator: [Camille Saint-Saëns, Charles Gounod, Gabriel Fauré]
      title: ["Adieu, notre petite table", "Pourquoi me réveiller", "En fermant les yeux (Le rêve)"]
      era: [Baroque, Classical, Verismo]
    links: [opera.venue.palais-garnier, opera.term.opera-comique]
    tags: [intermezzo, violin, massenet, thais, paris, 1890s]
    sources:
