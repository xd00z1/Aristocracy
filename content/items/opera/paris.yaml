  - id: opera.offenbach.contes-d-hoffmann.barcarolle
    discipline: opera
    kind: work
    title: "Belle nuit, ô nuit d'amour (Barcarolle)"
    parent: "Les contes d'Hoffmann (1881)"
    creator: Jacques Offenbach
    city: paris
    difficulty: 1
    era: Romantic
    year: 1881
    language: French
    pronunciation: "BEL NWEE, oh NWEE dah-MOOR"
    facts:
      - "Les contes d'Hoffmann opened at the Opéra-Comique on 10 February 1881; Offenbach had died on 5 October 1880 with the orchestration unfinished, and Ernest Guiraud completed the score."
      - "The Barcarolle opens the Venetian act and is a duet for Giulietta, a courtesan, and Nicklausse, Hoffmann's companion, a trouser role for mezzo-soprano."
      - "Offenbach took the tune from his own Die Rheinnixen (Vienna, 1864), where it was a song for elves."
      - "It is in D major and a rocking 6/8: a barcarolle imitates the song of a Venetian gondolier."
    remark: "Offenbach never heard it in this opera; the tune was second-hand from his Rheinnixen of 1864, where elves sang it, and the score was finished by Guiraud after his death."
    gaffe: "Taking it for a love duet between a man and a woman. Both singers are women, and one of them is playing a man."
    theme:
      notes: "A4/4 B4/8 B4/4 C#5/8 | C#5/4 D5/8 D5/4 C#5/8 | C#5/4 B4/8 B4/4 A4/8 | A4/4. A4/4 R/8 | A4/4 B4/8 B4/4 C#5/8 | C#5/4 D5/8 D5/4 C#5/8 | C#5/4 B4/8 B4/4 A4/8 | A4/4. A4/4 A4/8 | A4/4 B4/8 B4/4 C5/8 | D5/2."
      tempo: 80
      key: D major
      note: "Melody from the vocal entry ('Belle nuit'), in 6/8; the lower of the two voices carries the tune. A tied note in bar 8 is re-struck."
    distractors:
      creator: [Georges Bizet, Charles Gounod, Léo Delibes]
      title: ["Les oiseaux dans la charmille (Doll Song)", "Scintille, diamant", "Sous le dôme épais (Flower Duet)"]
      era: [Baroque, Classical, Verismo]
    links: [opera.offenbach.orphee-aux-enfers.galop-infernal, opera.term.opera-comique]
    tags: [duet, barcarolle, mezzo, soprano, offenbach, hoffmann, paris, 1880s]
    sources:
      - "Grove Music Online, 'Contes d'Hoffmann, Les'"
      - "Alexander Faris, Jacques Offenbach (1980)"
    reviewed_by: null

  - id: opera.offenbach.orphee-aux-enfers.galop-infernal
    discipline: opera
    kind: work
    title: "Galop infernal (the Can-can)"
    parent: "Orphée aux enfers (1858)"
    creator: Jacques Offenbach
    city: paris
    difficulty: 1
    era: Romantic
    year: 1858
    language: French
    pronunciation: "gah-LOP an-fair-NAHL"
    facts:
      - "Orphée aux enfers opened at Offenbach's own Théâtre des Bouffes-Parisiens on 21 October 1858, to a libretto by Hector Crémieux and Ludovic Halévy; an expanded four-act version followed at the Théâtre de la Gaîté in 1874."
      - "The galop is the finale in Hades: the gods, bored with Olympus, dance it at Pluto's party, and Eurydice, who has no wish to go home with Orpheus, joins in; the chorus sings 'Ce bal est original'."
      - "It became the music of the cancan later, in the dance halls; in the opera it is a galop, and nobody kicks."
      - "Saint-Saëns quotes it, slowed to a crawl, for the tortoises in Le carnaval des animaux (1886)."
    remark: "In the opera nobody kicks; it is a galop for bored Olympians at a party in Hades, and Saint-Saëns's joke in the Carnival of the Animals is to play it at tortoise speed."
    gaffe: "Calling it 'the Can-can by Offenbach' as if he had written a cancan. He wrote a galop for a mythological burlesque; the dance halls borrowed it."
    theme:
      notes: "G4/2 | A4/8 C5/8 B4/8 A4/8 | D5/4 D5/4 | D5/8 E5/8 B4/8 C5/8 | A4/4 A4/4 | A4/8 C5/8 B4/8 A4/8 | G4/8 G5/8 F#5/8 E5/8 | D5/8 C5/8 B4/8 A4/8 | G4/2"
      tempo: 160
      key: G major
      note: "The principal strain, sung to 'Ce bal est original', in G major as first heard; the galop's own opening bars are a different, less known tune."
    distractors:
      creator: [Johann Strauss II, Georges Bizet, Charles Lecocq]
      title: ["Belle nuit, ô nuit d'amour (Barcarolle)", "Duo de la mouche", "Couplets du roi de Béotie"]
      era: [Baroque, Classical, Verismo]
    links: [opera.offenbach.contes-d-hoffmann.barcarolle]
    tags: [galop, operetta, chorus, offenbach, orphee, paris, 1850s]
    sources:
      - "Grove Music Online, 'Orphée aux enfers'"
      - "Alexander Faris, Jacques Offenbach (1980)"
