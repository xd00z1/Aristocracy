  - id: opera.term.claque
    discipline: opera
    kind: term
    title: "Claque"
    city: paris
    difficulty: 2
    era: Nineteenth century
    definition: "An organised body of paid applauders, seated through the house and directed by a chef de claque, who clapped, laughed, wept and called for encores to order; from claquer, to clap."
    pronunciation: "klak"
    language: French
    facts:
      - "Paris put applause on a commercial footing in 1820, when a man named Sauton opened an agency selling it to managers and performers; Auguste Levasseur, who ran the Opéra's claque from 1853 until the Empire fell in 1870, studied the score and attended rehearsals to plan where his people would clap."
      - "A claque had specialists: rieurs to laugh, pleureurs to weep, bisseurs to demand the encore, and chatouilleurs to keep their neighbours in good humour."
      - "The practice is older than opera: Nero kept a trained body of young applauders, the Augustiani. Mahler fought the claque at the Vienna Hofoper after 1897, and houses went on tolerating it well into the twentieth century."
    remark: "At the Opéra under Napoleon III the applause was scored as carefully as the music: Levasseur, the chef de claque, went to rehearsals to plan where his people would clap, laugh, weep and call for the encore."
    gaffe: "Taking a warm reception at a Paris premiere as the verdict of the public. Well into the twentieth century some of it was paid for, seated in the middle of the parterre, and told when to start."
    distractors:
      term:
        - "A group of critics and connoisseurs who sat together in the parterre and set the town's opinion of a new work."
        - "The clatter made by the stage machinery of an old French theatre, used as a signal to the orchestra."
        - "A rousing vocal flourish written into the end of an aria to draw an ovation."
    links: [opera.venue.palais-garnier, opera.term.grand-opera, opera.meyerbeer, opera.venue.staatsoper]
    tags: [term, claque, applause, audience, paris, 1820s]
    sources:
      - "Grove Music Online, 'Claque'"
      - "The Oxford Companion to Music, 'Claque'"
    reviewed_by: null

  - id: opera.term.divertissement
    discipline: opera
    kind: term
    title: "Divertissement (the ballet in French opera)"
    city: paris
    difficulty: 2
    era: Baroque to Romantic
    definition: "The dance episode built into a French opera: a set of dances, usually with chorus, that halts the plot to show the company's ballet. Lully put one in every act, and the Opéra of the 1830s expected it in Act 2."
    pronunciation: "dee-vair-teess-MAHN"
    language: French
    facts:
      - "Louis XIV danced himself, appearing as the rising sun in the Ballet royal de la Nuit in 1653 with Lully among the dancers; Lully's tragédies en musique kept a divertissement of dances and choruses in each act, and Rameau's Les Indes galantes (1735) is an opéra-ballet, a form held together by dancing."
      - "The Romantic ballet was born inside an opera: the ballet of the dead nuns in Act 3 of Meyerbeer's Robert le diable (1831), choreographed by Filippo Taglioni for his daughter Marie, came a year before La Sylphide."
      - "Verdi supplied ballet music for Paris from Jérusalem (1847) to the Paris Otello of 1894, by way of Les vêpres siciliennes (1855), Le trouvère (1857) and Don Carlos (1867); Gounod's Faust acquired its Walpurgis Night ballet when it moved to the Opéra in 1869."
    remark: "The Romantic ballet was born inside an opera: the dance of the dead nuns in Robert le diable in 1831, with Marie Taglioni, came a year before La Sylphide, and after that the Opéra expected a ballet from everyone, Verdi and Wagner included."
    gaffe: "Treating the ballet in a French opera as padding to cut. Verdi wrote one every time Paris asked, from Jérusalem in 1847 to Otello in 1894, and the whole opéra-ballet form of Rameau is nothing but the dancing."
    distractors:
      term:
        - "The comic intermezzo played between the acts of an Italian opera seria, from which opera buffa grew."
        - "A spoken scene between the musical numbers of an opéra comique."
        - "The orchestral prelude played before the curtain rises on a French grand opéra."
    links: [opera.lully, opera.rameau, opera.term.grand-opera, opera.meyerbeer, opera.gounod.faust.jewel-song, opera.venue.palais-garnier]
    tags: [term, ballet, divertissement, lully, rameau, meyerbeer, verdi, paris]
    sources:
      - "Grove Music Online, 'Divertissement'"
      - "Marian Smith, Ballet and Opera in the Age of Giselle (2000)"
      - "David Charlton (ed.), The Cambridge Companion to Grand Opera (2003)"
    reviewed_by: null
