  # Massenet: Manon (Opéra-Comique, 1884) and Werther (Vienna, 1892)
  # ---------------------------------------------------------------------------

  - id: opera.massenet.manon.adieu-notre-petite-table
    discipline: opera
    kind: work
    title: "Adieu, notre petite table"
    parent: "Manon (1884)"
    creator: Jules Massenet
    city: paris
    difficulty: 1
    era: Romantic
    year: 1884
    language: French
    pronunciation: "ah-DYUH, NOT-ruh puh-TEET TAHBL"
    facts:
      - "Manon opened at the Opéra-Comique on 19 January 1884, with Marie Heilbron as Manon and Jean-Alexandre Talazac as des Grieux; the libretto is by Henri Meilhac and Philippe Gille, after the Abbé Prévost's novel of 1731."
      - "Manon sings it in Act 2, in the lovers' rooms in the rue Vivienne, having already agreed to leave des Grieux for the rich de Brétigny; des Grieux comes in, sings her his dream ('En fermant les yeux'), and is carried off by his father's men before the act ends."
      - "Much of the dialogue is spoken over the orchestra rather than sung, a device called mélodrame; in Massenet's version Manon dies on the road to Le Havre, not, as in the novel, in Louisiana."
      - "Puccini set the same novel as Manon Lescaut (Turin, 1 February 1893); Massenet answered with a one-act sequel, Le portrait de Manon, in 1894."
    remark: "She is saying goodbye to a table, not to a man: Manon has already agreed to go off with the rich de Brétigny, and des Grieux, who does not know, walks in and sings her his dream."
    gaffe: "Confusing it with Puccini's Manon Lescaut. Same novel, nine years later, in Italian; Massenet's Manon dies on the road to Le Havre, Puccini's in a Louisiana desert."
    distractors:
      creator: [Charles Gounod, Georges Bizet, Ambroise Thomas]
      title: ["En fermant les yeux (Le rêve)", "Obéissons quand leur voix appelle (Gavotte)", "Je suis encor tout étourdie"]
