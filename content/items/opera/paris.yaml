items:
  # ---------------------------------------------------------------------------
  # Bizet: Carmen (Opéra-Comique, 1875)
  # ---------------------------------------------------------------------------

  - id: opera.bizet.carmen.habanera
    discipline: opera
    kind: work
    title: "L'amour est un oiseau rebelle (Habanera)"
    parent: "Carmen (1875)"
    creator: Georges Bizet
    city: paris
    difficulty: 1
    era: Romantic
    year: 1875
    language: French
    pronunciation: "lah-MOOR eh tuhn wah-ZOH ruh-BEL"
    facts:
      - "Carmen opened at the Opéra-Comique, Paris, on 3 March 1875; Bizet died on 3 June, three months later, aged 36, before the work had become a success."
      - "Carmen sings it in Act 1, outside the cigarette factory in Seville, to a crowd of soldiers; Célestine Galli-Marié created the role, which is written for mezzo-soprano."
      - "The tune is taken from 'El Arreglito', a habanera by the Spanish composer Sebastián Iradier, published in 1863; Bizet believed it was a folk song and, when told otherwise, added an acknowledgement to the vocal score."
      - "The libretto is by Henri Meilhac and Ludovic Halévy, after Prosper Mérimée's novella of 1845."
    remark: "The tune is not Bizet's own; it is 'El Arreglito' by Sebastián Iradier, which Bizet took for a folk song and credited in the vocal score once someone told him."
    gaffe: "Calling Carmen a soprano. She is a mezzo, and the Habanera sits in the middle of the voice on purpose; the soprano in the opera is Micaëla."
    theme:
      notes: "D5/8 C#5/8 | C5/16 C5/16 C5/8 B4/8 Bb4/8 | A4/8. A4/16 G#4/8 G4/8 | F4/32 G4/32 F4/16 E4/16 F4/16 G4/8 F4/8 | E4/8 R/8 D5/8 C#5/8 | C5/16 C5/16 C5/8 B4/8 Bb4/8 | A4/8. A4/16 G4/8 F4/8 | E4/32 F4/32 E4/16 D4/16 E4/16 F4/8 E4/8 | D4/4"
      tempo: 72
      key: D minor
      note: "Vocal line from the entry of Carmen, first two lines of text. The triplets on 'est un oi-' and the turn on 'nul' are approximated with straight values."
    distractors:
      creator: [Charles Gounod, Jules Massenet, Léo Delibes]
      title: ["Près des remparts de Séville (Séguedille)", "Votre toast, je peux vous le rendre (Toreador Song)", "La fleur que tu m'avais jetée"]
      era: [Baroque, Classical, Verismo]
    links: [opera.bizet.carmen.toreador-song, opera.term.opera-comique, opera.term.voice-types]
    tags: [aria, mezzo, bizet, carmen, paris, 1870s]
    sources:
      - "Grove Music Online, 'Carmen'"
      - "Winton Dean, Georges Bizet: His Life and Work (1965)"
      - "Hugh Macdonald, Bizet (2014)"
    reviewed_by: null

  - id: opera.bizet.carmen.toreador-song
    discipline: opera
    kind: work
    title: "Votre toast, je peux vous le rendre (Toreador Song)"
    parent: "Carmen (1875)"
    creator: Georges Bizet
    city: paris
    difficulty: 1
    era: Romantic
    year: 1875
    language: French
    pronunciation: "VOT-ruh TOAST, zhuh puh voo luh RAHN-druh"
    facts:
      - "Escamillo, the bullfighter, sings it on his entrance in Act 2, at Lillas Pastia's tavern; the role is a baritone, first sung by the Belgian Jacques Bouhy."
      - "The refrain, 'Toréador, en garde', is heard before the curtain rises, as the middle section of the Prelude, in F major."
      - "The refrain returns at the very end: the crowd sings it inside the bullring while Don José stabs Carmen outside the gates."
      - "Toréador is the French form of the word; a Spanish bullfighter is a torero, or, if he kills, a matador."
    remark: "Bizet saves the jolliest tune in the score for the murder; the crowd sings 'Toréador, en garde' inside the arena while Don José kills Carmen at the gate."
    gaffe: "Calling Escamillo a tenor. He is the baritone; the tenor is Don José, and he never sings a note of this."
    theme:
      notes: "C5/4 D5/8. C5/16 | A4/4 A4/4 | A4/8. G4/16 A4/8. Bb4/16 | A4/4. R/8 | Bb4/4 G4/8. C5/16 | A4/4. R/8 | F4/4 D4/8. G4/16 | C4/4. R/8 | G4/2 | G4/8 D5/8 C5/8 Bb4/8 | A4/8 G4/8 A4/8 Bb4/8 | A4/4. R/8"
      tempo: 112
      key: F major
      note: "The refrain ('Toréador, en garde') as it appears in the Prelude, treble register; Escamillo sings it an octave lower."
    distractors:
      creator: [Charles Gounod, Jacques Offenbach, Jules Massenet]
      title: ["L'amour est un oiseau rebelle (Habanera)", "La fleur que tu m'avais jetée", "Les tringles des sistres tintaient (Chanson bohème)"]
      era: [Baroque, Classical, Verismo]
    links: [opera.bizet.carmen.habanera, opera.term.opera-comique, opera.term.voice-types]
    tags: [aria, baritone, bizet, carmen, paris, 1870s]
    sources:
