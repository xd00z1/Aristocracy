  # ---------------------------------------------------------------------------
  # Terms
  # ---------------------------------------------------------------------------

  - id: opera.term.grand-opera
    discipline: opera
    kind: term
    title: "Grand opéra"
    city: paris
    difficulty: 2
    era: Romantic
    definition: "The Paris Opéra's house style from the 1830s: four or five acts, sung throughout in French, on a historical subject, with a large chorus, spectacular staging and an obligatory ballet, and usually a libretto by Eugène Scribe."
    pronunciation: "grahn oh-pay-RAH"
    language: French
    facts:
      - "Auber's La Muette de Portici (1828) and Rossini's Guillaume Tell (1829) set the pattern; Meyerbeer's Robert le diable (1831) and Les Huguenots (1836) and Halévy's La Juive (1835) made it the fashion of Europe."
      - "Giacomo Meyerbeer (1791–1864), a Berlin banker's son, was the most performed opera composer of his age; Les Huguenots passed its thousandth performance at the Opéra in 1906."
      - "The ballet was expected in Act 2, after the members of the Jockey Club had dined; Wagner put his Tannhäuser ballet in Act 1 for the Paris production of March 1861, the Jockey Club whistled, and the opera was withdrawn after three performances."
      - "Verdi wrote Don Carlos (1867) for the Opéra in the form; Wagner's attack on Meyerbeer in 'Das Judenthum in der Musik' (1850) helped bury Meyerbeer's reputation."
    remark: "The ballet was contractual and it went in Act 2, because the Jockey Club dined first; Wagner put his in Act 1 in 1861 and Tannhäuser lasted three nights."
    gaffe: "Using 'grand opera' to mean any big serious opera. In Paris it names a form with rules: five acts, history, chorus, ballet, and usually Scribe."
    distractors:
      term:
        - "An Italian tradition of florid singing in which the beauty of the vocal line matters more than dramatic truth."
        - "A French opera with spoken dialogue between the musical numbers, whether or not the subject is comic."
        - "A late nineteenth-century Italian school that put working-class violence on the stage in short, blunt acts."
    links: [opera.term.opera-comique, opera.berlioz.les-troyens, opera.venue.palais-garnier, opera.gounod.faust.jewel-song]
    tags: [term, grand-opera, meyerbeer, scribe, ballet, paris, 1830s]
    sources:
      - "Grove Music Online, 'Grand opéra'"
      - "David Charlton (ed.), The Cambridge Companion to Grand Opera (2003)"
    reviewed_by: null

  - id: opera.term.opera-comique
    discipline: opera
    kind: term
    title: "Opéra comique"
    city: paris
    difficulty: 1
    era: Romantic
    definition: "French opera with spoken dialogue between the musical numbers instead of recitative; the name describes the form, not the tone, and Carmen, which ends in a stabbing, is one."
    pronunciation: "oh-pay-RAH koh-MEEK"
    language: French
    facts:
      - "The Opéra-Comique is also the company and its theatre, the Salle Favart on the place Boieldieu; the present house, the third, opened in 1898 after a fire on 25 May 1887 killed 84 people."
      - "Carmen (1875), Les contes d'Hoffmann (1881), Lakmé (1883), Manon (1884) and Pelléas et Mélisande (1902) all opened there."
      - "Carmen was written with spoken dialogue; the sung recitatives usually heard instead were composed by Ernest Guiraud for Vienna in October 1875, after Bizet's death."
    remark: "Comique means the form, not the jokes: an opéra comique has spoken dialogue, and Carmen, which ends with a stabbing, opened at the Opéra-Comique in 1875."
    gaffe: "Saying Carmen 'is not really an opéra comique because it is not funny'. The term has nothing to do with comedy; it means spoken dialogue."
    distractors:
      term:
        - "A comic opera in the Italian style, with recitative and an ensemble finale to each act."
        - "A light French stage piece of the Second Empire with songs and dances, written for the boulevard theatres."
        - "The Paris Opéra's spectacular five-act form, sung throughout, with an obligatory ballet."
    links: [opera.term.grand-opera, opera.bizet.carmen.habanera, opera.offenbach.contes-d-hoffmann.barcarolle, opera.debussy.pelleas-et-melisande]
    tags: [term, opera-comique, spoken-dialogue, salle-favart, paris]
    sources:
      - "Grove Music Online, 'Opéra comique'"
      - "Hervé Lacombe, The Keys to French Opera in the Nineteenth Century (2001)"
    reviewed_by: null

