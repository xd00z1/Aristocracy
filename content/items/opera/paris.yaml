    remark: "Delibes was a ballet composer first, and the duet, sung in thirds by a Brahmin's daughter and her servant picking flowers by a river, is the one page of Lakmé that an airline and everybody else took."
    gaffe: "Calling it a love duet. Both singers are women, mistress and servant, and the man Lakmé loves, a British officer, has not yet walked on."
