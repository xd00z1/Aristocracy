  - id: opera.venue.glyndebourne
    discipline: opera
    kind: venue
    title: "Glyndebourne"
    location: "Near Lewes, East Sussex"
    city: london
    difficulty: 2
    era: Twentieth century
    year: 1934
    pronunciation: "GLINED-born"
    facts:
      - "Opened on 28 May 1934 with The Marriage of Figaro, in an opera house that John Christie had built on to his country house for his wife, the soprano Audrey Mildmay."
      - "The first seasons were run by three men newly out of Germany: the conductor Fritz Busch, the producer Carl Ebert and and Rudolf Bing, who negotiated the singers' contracts in 1934, became general manager in 1936 and later ran the Metropolitan Opera."
      - "Britten's The Rape of Lucretia (1946) and Albert Herring (1947) had their premieres there; the present house, by Michael Hopkins, opened in 1994."
      - "The summer festival keeps its own customs: evening dress in the afternoon, and a dinner interval long enough for a picnic in the gardens."
    remark: "John Christie built it in 1934 for his wife, the soprano Audrey Mildmay, and staffed it with three men just out of Hitler's Germany: Fritz Busch, Carl Ebert and Rudolf Bing, who went on to run the Met."
    gaffe: "Turning up in a lounge suit, or complaining about the length of the interval. Evening dress and a picnic in the long dinner interval are the point, and it is in Sussex, not London."
    distractors:
      title: ["London Coliseum", "Royal Opera House, Covent Garden", "Garsington Opera"]
    links: [opera.venue.covent-garden, opera.britten.peter-grimes]
    tags: [venue, festival, country-house-opera, sussex, 1930s]
    sources:
      - "Grove Music Online, 'Glyndebourne'"
      - "Spike Hughes, Glyndebourne: A History of the Festival Opera (1965)"
    reviewed_by: null

  # ---------------------------------------------------------------------------
  # Terms
  # ---------------------------------------------------------------------------

  - id: opera.term.aria
    discipline: opera
    kind: term
    title: "Aria"
    city: london
    difficulty: 1
    era: All periods
    definition: "A self-contained song for one voice in an opera or oratorio, in which the action pauses so that a character can feel something at length; its opposite is recitative, the speech-like passages that carry the plot."
    pronunciation: "AH-ree-a"
    language: Italian
    facts:
      - "In a Handel opera almost every aria is a da capo aria, in the form A–B–A, and the singer was expected to ornament the repeat of the first section."
      - "Recitative comes in two kinds: secco, accompanied by the continuo alone, and accompagnato, with the orchestra."
      - "The English plural is arias; an arietta is a short one, and an arioso is something between recitative and aria."
    remark: "In a Handel opera the plot happens in the recitative and the feeling in the arias; if you find yourself following a story during an aria, you have missed something."
    gaffe: "Calling a duet or a chorus an aria, or asking where the tune is during a recitative: the recitative is not meant to have one."
    distractors:
      term:
        - "A passage of sung speech, following the rhythms of the words, in which the story is carried forward between the set numbers."
        - "The spoken dialogue between musical numbers in a comic opera or Singspiel."
        - "An instrumental piece played by the orchestra before the curtain rises."
    links: [opera.handel.rinaldo.lascia-chio-pianga, opera.handel.serse.ombra-mai-fu, opera.purcell.dido-and-aeneas.when-i-am-laid-in-earth, opera.handel.giulio-cesare]
    tags: [term, aria, recitative, italian]
    sources:
      - "Grove Music Online, 'Aria'"
      - "Grove Music Online, 'Recitative'"
    reviewed_by: null

  - id: opera.term.castrato
    discipline: opera
    kind: term
    title: "Castrato"
    city: london
    difficulty: 2
    era: Baroque
    definition: "A male singer castrated before puberty so that he kept a boy's high range with a grown man's lungs; the star of Italian opera from the mid-seventeenth century to about 1800, whose heroic roles now go to countertenors or to women."
    pronunciation: "kass-TRAH-toh (plural castrati)"
    language: Italian
    facts:
      - "Handel wrote Rinaldo for Nicolini and Giulio Cesare for Senesino; Farinelli came to London in 1734 to sing for the rival company set up against Handel."
      - "The last castrato of the Sistine Chapel choir, Alessandro Moreschi, made recordings in 1902 and 1904 and died in 1922."
      - "A countertenor is a different thing: an intact man singing in a developed falsetto. Alfred Deller revived the voice in England in the 1940s, and Britten wrote Oberon in A Midsummer Night's Dream (1960) for him."
    remark: "Handel's Caesar and Rinaldo were castrato roles, and a countertenor is not the same thing: he is an intact man singing in a trained falsetto, which is why the sound is lighter."
    gaffe: "Calling a countertenor a castrato. The last of the castrati, Alessandro Moreschi, died in 1922 and can be heard on records made in 1902 and 1904."
    distractors:
      term:
        - "A tenor with an exceptionally high range, trained to sing above the stave in full voice rather than falsetto."
        - "A bass singer who specialises in the comic roles of Italian opera."
        - "A boy soprano in a cathedral choir, replaced when his voice breaks."
    links: [opera.handel.giulio-cesare, opera.handel.rinaldo.lascia-chio-pianga, opera.handel, opera.term.voice-types]
    tags: [term, castrato, countertenor, baroque, italian]
    sources:
      - "Grove Music Online, 'Castrato'"
      - "Grove Music Online, 'Countertenor'"
    reviewed_by: null

  - id: opera.term.voice-types
    discipline: opera
    kind: term
    title: "The voice types"
    city: london
    difficulty: 1
    era: All periods
    definition: "From high to low: soprano, mezzo-soprano and contralto for women; countertenor, tenor, baritone and bass for men. Convention gives the heroine to the soprano, the lover to the tenor, and the fathers, villains and kings to baritones and basses."
    language: Italian
    facts:
      - "Mimì, Violetta and Tosca are sopranos; Rodolfo, Alfredo and Cavaradossi, the men who love them, are tenors."
      - "Mezzo-sopranos get the seductresses and the trouser roles: Carmen, and the young men Cherubino in The Marriage of Figaro and Octavian in Der Rosenkavalier."
      - "Scarpia in Tosca, Iago in Otello and Rigoletto are baritones; Sarastro in The Magic Flute and Boris Godunov are basses."
    remark: "The rule of thumb is that sopranos and tenors fall in love and baritones and basses get in the way; Scarpia, Iago and Rigoletto are all baritones."
    gaffe: "Calling Scarpia 'the tenor'. He is a baritone, and the tenor is the man he has arranged to have shot in Act III."
    distractors:
      term:
        - "The ranks of an opera company, from principal to chorus, fixed by the terms of a singer's contract."
        - "The three registers of a single voice, chest, middle and head, which a singer must learn to blend."
        - "The clefs in which vocal parts were printed before the nineteenth century: soprano, alto, tenor and bass."
    links: [opera.purcell.dido-and-aeneas.when-i-am-laid-in-earth, opera.britten.peter-grimes, opera.handel.giulio-cesare, opera.term.castrato]
    tags: [term, voice-types, soprano, mezzo, tenor, baritone, bass]
