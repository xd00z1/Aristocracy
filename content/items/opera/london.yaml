  # ---------------------------------------------------------------------------

  - id: opera.handel.rinaldo.lascia-chio-pianga
    discipline: opera
    kind: work
    title: "Lascia ch'io pianga"
    parent: "Rinaldo (1711)"
    creator: George Frideric Handel
    city: london
    difficulty: 1
    era: Baroque
    year: 1711
    language: Italian
    pronunciation: "LAH-sha kyo PYAHN-ga"
    facts:
      - "Rinaldo opened at the Queen's Theatre in the Haymarket on 24 February 1711, the first Italian opera composed specifically for the London stage."
      - "Sung in Act II by Almirena, a captive of the sorceress Armida, asking to be left to weep for her cruel fate and sigh for liberty."
      - "The tune had already served as a sarabande in Almira (Hamburg, 1705) and as 'Lascia la spina' in Il trionfo del Tempo (Rome, 1707)."
      - "The libretto is by Giacomo Rossi, from a scenario by Aaron Hill after Tasso; Addison mocked the production's live sparrows in The Spectator."
    remark: "Handel had used the tune twice already, as a sarabande in Almira at Hamburg and as 'Lascia la spina' in Rome; London in 1711 got the third set of words and kept it."
    gaffe: "Calling it 'Handel's Largo'. That is 'Ombra mai fu' from Serse; this is a sarabande from Rinaldo, sung by a woman in captivity asking for the liberty to weep."
    distractors:
      creator: [Henry Purcell, Johann Sebastian Bach, Alessandro Scarlatti]
      title: ["Ombra mai fu", "Dido's Lament", "Piangerò la sorte mia"]
      era: [Classical, Romantic, Renaissance]
    links: [opera.handel, opera.handel.serse.ombra-mai-fu, opera.term.aria, opera.term.castrato]
    tags: [aria, baroque, handel, soprano, london, 1710s]
    sources:
      - "Grove Music Online, 'Rinaldo'"
      - "Winton Dean and John Merrill Knapp, Handel's Operas, 1704–1726 (1987)"
    reviewed_by: null

  - id: opera.handel.giulio-cesare
    discipline: opera
    kind: work
    title: "Giulio Cesare in Egitto"
    creator: George Frideric Handel
    city: london
    difficulty: 1
    era: Baroque
    year: 1724
    language: Italian
    pronunciation: "JOO-lyo CHAY-za-reh in eh-JEET-to"
    facts:
      - "First performed at the King's Theatre in the Haymarket on 20 February 1724 by the Royal Academy of Music, the opera company Handel served as composer."
      - "The title role was written for the castrato Senesino and Cleopatra for the soprano Francesca Cuzzoni; the libretto is by Nicola Francesco Haym."
      - "Set in Egypt in 48 BC: Ptolemy has Pompey murdered and presents his head to Caesar, while Cleopatra, disguised as 'Lidia', sets out to win Caesar for herself."
      - "Cleopatra's arias include 'V'adoro, pupille', 'Piangerò la sorte mia' and 'Da tempeste'; Caesar's 'Va tacito e nascosto' has a solo horn stalking alongside the voice."
    remark: "Caesar was written for the castrato Senesino, so today he is a countertenor or a mezzo; if the Caesar you hear is a baritone, someone has transposed it."
    gaffe: "Expecting Shakespeare. Haym's libretto is Caesar in Egypt in 48 BC: Pompey's severed head, Cleopatra and her brother Ptolemy, and no Brutus at all."
    distractors:
      creator: [Giovanni Bononcini, Alessandro Scarlatti, Antonio Vivaldi]
      title: ["Rinaldo", "Serse", "Alcina"]
      era: [Classical, Restoration, Romantic]
    links: [opera.handel, opera.term.castrato, opera.handel.rinaldo.lascia-chio-pianga, opera.term.aria, opera.term.voice-types]
    tags: [opera, baroque, handel, castrato, london, 1720s]
    sources:
      - "Grove Music Online, 'Giulio Cesare in Egitto'"
      - "Winton Dean and John Merrill Knapp, Handel's Operas, 1704–1726 (1987)"
    reviewed_by: null

  - id: opera.handel
    discipline: opera
    kind: creator
    title: "George Frideric Handel"
    city: london
    difficulty: 1
    era: Baroque
    year: 1685
    year_end: 1759
    facts:
      - "Born in Halle on 23 February 1685, in what was then the Duchy of Magdeburg under Brandenburg-Prussia; came to London in 1710, settled there in 1712, and was naturalised as a British subject by Act of Parliament in 1727."
      - "Wrote more than thirty Italian operas for London, from Rinaldo in 1711 to Deidamia in 1741, before turning to English oratorio; Messiah was first heard in Dublin in 1742."
      - "Lived at 25 Brook Street from 1723 until his death on 14 April 1759; he went blind in his last years and is buried in Westminster Abbey."
    remark: "He was a Saxon who became a British subject by Act of Parliament in 1727, wrote more than thirty Italian operas for London, and turned to English oratorio only when the opera business failed him."
    gaffe: "Assuming he and Bach knew each other. They were born in the same year, 1685, in towns a few days' ride apart, and never met; Bach tried twice."
    distractors:
      person: [Henry Purcell, Thomas Arne, Giovanni Bononcini]
      era: [Classical, Restoration, Romantic]
    links: [opera.handel.rinaldo.lascia-chio-pianga, opera.handel.giulio-cesare, opera.handel.serse.ombra-mai-fu, opera.venue.covent-garden, opera.term.castrato]
    tags: [composer, baroque, handel, london, 1700s]
    sources:
      - "Grove Music Online, 'Handel, George Frideric'"
      - "Oxford Dictionary of National Biography, 'Handel, George Frideric'"
      - "Donald Burrows, Handel (2nd ed., 2012)"
    reviewed_by: null

