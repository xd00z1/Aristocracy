  - id: opera.britten.peter-grimes
    discipline: opera
    kind: work
    title: "Peter Grimes"
    creator: Benjamin Britten
    city: london
    difficulty: 3
    era: Twentieth century
    year: 1945
    language: English
    facts:
      - "First performed at Sadler's Wells Theatre, London, on 7 June 1945, a month after VE Day, with Peter Pears as Grimes and Joan Cross as Ellen Orford; Reginald Goodall conducted."
      - "The libretto is by Montagu Slater, after George Crabbe's poem The Borough (1810); Britten found Crabbe through an article by E. M. Forster that he read in California in 1941."
      - "Grimes is a fisherman in a Suffolk village whose apprentices keep dying; the Borough turns on him, and Balstrode tells him to sail out and sink his boat."
      - "The orchestral interludes were published separately as the Four Sea Interludes, Op. 33a: Dawn, Sunday Morning, Moonlight and Storm; the Passacaglia is Op. 33b."
    remark: "It opened at Sadler's Wells a month after VE Day with Peter Pears as Grimes, and it is the first English opera since Purcell to hold the stage everywhere."
    gaffe: "Calling Grimes a villain, or a baritone. He is a tenor written for Pears, and the point is that the Borough condemns him without ever proving anything."
    distractors:
      creator: [Ralph Vaughan Williams, Michael Tippett, William Walton]
      title: ["Billy Budd", "The Turn of the Screw", "Albert Herring"]
      era: [Victorian, Baroque, Romantic]
    links: [opera.term.voice-types, opera.purcell, opera.venue.glyndebourne]
    tags: [opera, britten, tenor, sea-interludes, twentieth-century, london, 1940s]
    sources:
      - "Grove Music Online, 'Peter Grimes'"
      - "Humphrey Carpenter, Benjamin Britten: A Biography (1992)"
    reviewed_by: null

