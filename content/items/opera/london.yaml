  - id: opera.purcell.dido-and-aeneas.when-i-am-laid-in-earth
    discipline: opera
    kind: work
    title: "When I am laid in earth (Dido's Lament)"
    parent: "Dido and Aeneas (c. 1689)"
    creator: Henry Purcell
    city: london
    difficulty: 1
    era: Restoration
    year: 1689
    year_approx: true
    language: English
    facts:
      - "The only performance we can document in Purcell's lifetime was at Josias Priest's boarding school for young gentlewomen in Chelsea, in or before 1689; the exact date is still argued over."
      - "Built over a five-bar ground bass in G minor that descends by semitones from G to D and repeats, unchanged, under the whole lament."
      - "Dido sings it after she has sent Aeneas away; the words end 'Remember me, but ah! forget my fate', and the chorus 'With drooping wings' follows."
      - "The libretto is by Nahum Tate; no score in Purcell's hand survives, and the earliest copy dates from long after his death."
    remark: "The whole lament sits on a five-bar ground bass that sinks chromatically from G to D and simply repeats; the grief is in the bass line, and the voice is left to break across it."
    gaffe: "Attributing it to Handel. Purcell died in 1695, and Handel did not reach London until 1710."
    distractors:
      creator: [John Blow, George Frideric Handel, Claudio Monteverdi]
      title: ["Ombra mai fu", "Lascia ch'io pianga", "Music for a While"]
      era: [Renaissance, Classical, Romantic]
    links: [opera.purcell, opera.term.aria, opera.term.voice-types]
    tags: [aria, lament, ground-bass, purcell, restoration, london, 1680s]
    sources:
      - "Grove Music Online, 'Dido and Aeneas'"
      - "Curtis Price, Henry Purcell and the London Stage (1984)"
      - "Ellen T. Harris, Henry Purcell's Dido and Aeneas (1987)"
    reviewed_by: null

  - id: opera.purcell
    discipline: opera
    kind: creator
    title: "Henry Purcell"
    city: london
    difficulty: 2
    era: Restoration
    year: 1659
    year_end: 1695
    pronunciation: "PUR-sul"
    facts:
      - "Born in 1659, almost certainly in Westminster; organist of Westminster Abbey from 1679 and of the Chapel Royal from 1682."
      - "Wrote one opera sung throughout, Dido and Aeneas, and four semi-operas for the London theatres: Dioclesian (1690), King Arthur (1691), The Fairy-Queen (1692) and The Indian Queen (1695)."
      - "Died on 21 November 1695, aged about thirty-six, and was buried in Westminster Abbey beside the organ; the music he had written for Queen Mary's funeral that March was played at his own."
      - "Playford published his songs after his death under the title Orpheus Britannicus (1698)."
    remark: "Dido is his only opera sung throughout; King Arthur and The Fairy-Queen are semi-operas, in which the principal characters speak and the singing is left to spirits, shepherds and a drunken poet."
    gaffe: "Saying 'Pur-SELL'. The stress falls on the first syllable, as in 'purse'."
    distractors:
      person: [John Blow, Thomas Arne, George Frideric Handel]
      era: [Elizabethan, Georgian, Victorian]
    links: [opera.purcell.dido-and-aeneas.when-i-am-laid-in-earth, opera.handel, opera.britten.peter-grimes]
    tags: [composer, restoration, purcell, london, 1600s]
    sources:
      - "Grove Music Online, 'Purcell, Henry'"
      - "Oxford Dictionary of National Biography, 'Purcell, Henry'"
      - "Peter Holman, Henry Purcell (1994)"
    reviewed_by: null

