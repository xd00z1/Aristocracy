  # ---------------------------------------------------------------------------

  - id: opera.sullivan.hms-pinafore
    discipline: opera
    kind: work
    title: "H.M.S. Pinafore"
    creator: Arthur Sullivan
    city: london
    difficulty: 2
    era: Victorian
    year: 1878
    language: English
    facts:
      - "Opened at the Opera Comique, London, on 25 May 1878 and ran for 571 performances; the words are by W. S. Gilbert, the fourth of his collaborations with Sullivan."
      - "Josephine, the captain's daughter, loves the able seaman Ralph Rackstraw but is promised to Sir Joseph Porter, First Lord of the Admiralty, who rose to rule the Queen's Navy without ever going to sea."
      - "Little Buttercup resolves everything by confessing that she nursed Ralph and the captain as babies and mixed them up; the numbers include 'When I was a lad' and 'He is an Englishman'."
      - "Unauthorised American productions in 1878 and 1879 earned the authors nothing, which is why their next piece opened in New York."
    remark: "Sir Joseph Porter, who polished up the handle of the big front door and never went to sea, was taken by everyone in 1878 to be W. H. Smith, the newsagent Disraeli had just made First Lord of the Admiralty."
    gaffe: "Calling Sullivan the librettist, or Gilbert the composer. Gilbert wrote the words and Sullivan the music, and the partnership nearly ended in 1890 in a quarrel over the cost of a carpet for the Savoy."
    distractors:
      creator: [Jacques Offenbach, Edward German, Alfred Cellier]
      title: ["The Pirates of Penzance", "The Mikado", "The Gondoliers"]
      era: [Georgian, Edwardian, Baroque]
    links: [opera.sullivan.pirates-of-penzance, opera.sullivan.the-mikado, opera.term.voice-types]
    tags: [comic-opera, gilbert-and-sullivan, victorian, london, 1870s]
    sources:
      - "Grove Music Online, 'H.M.S. Pinafore'"
      - "Arthur Jacobs, Arthur Sullivan: A Victorian Musician (1984)"
    reviewed_by: null

  - id: opera.sullivan.pirates-of-penzance
    discipline: opera
    kind: work
    title: "The Pirates of Penzance"
    creator: Arthur Sullivan
    city: london
    difficulty: 1
    era: Victorian
    year: 1879
    language: English
    facts:
      - "After a single copyright performance at Paignton in Devon on 30 December 1879, it opened at the Fifth Avenue Theatre, New York, on 31 December 1879, and reached the Opera Comique in London on 3 April 1880."
      - "Frederic, apprenticed to the pirates until his twenty-first birthday, was born on 29 February and so has had only five birthdays; he will come of age in 1940."
      - "Major-General Stanley's patter song 'I am the very model of a modern Major-General' lists everything he knows, none of it military; the pirates turn out to be noblemen who have gone wrong."
      - "The other famous numbers are 'With cat-like tread', 'Poor wand'ring one' and the Sergeant of Police's 'A policeman's lot is not a happy one'."
    remark: "It is the one Gilbert and Sullivan opera that opened in New York, on the last day of 1879, because American managers had spent a year staging Pinafore without paying either of them a penny."
    gaffe: "Attributing the Major-General's song to The Mikado. It is from Pirates, and the joke is that Stanley knows everything except anything military."
    distractors:
      creator: [Jacques Offenbach, Edward German, Alfred Cellier]
      title: ["H.M.S. Pinafore", "The Mikado", "Iolanthe"]
      era: [Georgian, Edwardian, Baroque]
    links: [opera.sullivan.hms-pinafore, opera.sullivan.the-mikado, opera.term.voice-types]
    tags: [comic-opera, gilbert-and-sullivan, patter-song, victorian, london, 1870s]
    sources:
      - "Grove Music Online, 'Pirates of Penzance, The'"
      - "Arthur Jacobs, Arthur Sullivan: A Victorian Musician (1984)"
    reviewed_by: null

  - id: opera.sullivan.the-mikado
    discipline: opera
    kind: work
    title: "The Mikado"
    creator: Arthur Sullivan
    city: london
    difficulty: 1
    era: Victorian
    year: 1885
    language: English
    facts:
      - "Opened at the Savoy Theatre on 14 March 1885 and ran for 672 performances, the longest first run of any of the Gilbert and Sullivan operas; it was the ninth of their collaborations."
      - "Set in the town of Titipu: Nanki-Poo, the Mikado's son disguised as a wandering minstrel, loves Yum-Yum, who is engaged to her guardian Ko-Ko, the Lord High Executioner."
      - "Sullivan borrowed one genuine Japanese tune, the march 'Miya sama', for the Mikado's entrance; a Japanese village exhibition had opened in Knightsbridge two months before the premiere."
      - "The numbers include 'A wand'ring minstrel I', 'Three little maids from school are we', 'The sun whose rays', 'Tit-Willow' and Ko-Ko's 'I've got a little list'."
    remark: "The Japan is fancy dress and the target is Victorian England, which is why Ko-Ko's little list of people who never would be missed has been rewritten with topical names since Gilbert's own day."
    gaffe: "Calling it Japanese music. Sullivan borrows one Japanese tune, the march 'Miya sama' for the Mikado's entrance, and the rest is a Victorian burlesque in kimonos."
    distractors:
      creator: [Jacques Offenbach, Edward German, Alfred Cellier]
      title: ["The Pirates of Penzance", "H.M.S. Pinafore", "The Yeomen of the Guard"]
      era: [Georgian, Edwardian, Baroque]
    links: [opera.sullivan.hms-pinafore, opera.sullivan.pirates-of-penzance, opera.term.voice-types]
    tags: [comic-opera, gilbert-and-sullivan, savoy, victorian, london, 1880s]
    sources:
      - "Grove Music Online, 'Mikado, The'"
      - "Arthur Jacobs, Arthur Sullivan: A Victorian Musician (1984)"
    reviewed_by: null

