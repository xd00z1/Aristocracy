  - id: music.term.salon
    discipline: music
    kind: term
    title: "The salon"
    city: paris
    difficulty: 2
    era: Romantic
    definition: "The private drawing-room gathering, presided over by a hostess, at which music was played to an invited audience of society, artists and writers. In nineteenth-century Paris it was where Chopin chose to be heard, where reputations were made and pupils found, and where much of the piano repertoire was first played; 'salon music' later became a sneer for the pretty pieces written for it."
    pronunciation: "sa-LOHN"
    language: French
    facts:
      - "Chopin gave about thirty public concerts in his life and played the rest in drawing rooms; after his Salle Pleyel debut of 26 February 1832 he was taken up by the Rothschilds and the Faubourg Saint-Germain, and his pupils, at twenty francs a lesson, came from there."
      - "Liszt and Thalberg played against each other at the Princess Belgiojoso's on 31 March 1837; her reported verdict, that Thalberg was the first pianist in the world and Liszt the only one, is the most quoted line a salon ever produced."
      - "The tradition ran on into the twentieth century: the Princesse de Polignac, born Winnaretta Singer of the sewing-machine fortune, commissioned Stravinsky's Renard, Satie's Socrate, Falla's El retablo de maese Pedro and Poulenc's Organ Concerto for her salon on the avenue Henri-Martin."
      - "Fauré's songs, Debussy's early works and much of Ravel were first heard in private rooms; Proust's Madame Verdurin is a satire of the hostesses who ran them."
    remark: "Chopin gave about thirty public concerts in his whole life and did the rest of his playing in drawing rooms; the salon was his concert hall, his publicity and his employment exchange, since that is where the pupils at twenty francs a lesson came from."
    gaffe: "Saying 'salon music' as a compliment, or muddling the salon with the Salon. The Salon, capital S, is the state art exhibition named after a room in the Louvre; and since about 1870 'salon music' has meant pretty and shallow, so do not say it of a Chopin nocturne in front of a pianist."
    distractors:
      term:
        - "The official state exhibition of living artists in Paris, held from 1667 and named after a room in the Louvre."
        - "A public concert series with a paid orchestra and printed programmes, such as the Concerts Lamoureux or the Concerts Colonne."
        - "A café with a small stage where singers and pianists entertained a paying crowd, such as Le Chat Noir in Montmartre."
    links: [music.chopin.nocturne-op9-2, art.term.salon, music.faure, music.satie.gymnopedie-1, music.poulenc, music.saint-saens.le-cygne]
    tags: [term, salon, institution, chopin, liszt, polignac, paris, 1800s]
    sources:
      - "Grove Music Online, 'Salon music'"
      - "Jean-Jacques Eigeldinger, Chopin: Pianist and Teacher as Seen by his Pupils (1986)"
      - "Sylvia Kahan, Music's Modern Muse: A Life of Winnaretta Singer, Princesse de Polignac (2003)"
      - "Alan Walker, Franz Liszt: The Virtuoso Years, 1811–1847 (rev. ed., 1987)"
    reviewed_by: null

  - id: music.term.conservatoire
    discipline: music
    kind: term
    title: "The Conservatoire"
    city: paris
    difficulty: 2
    era: Revolution
    year: 1795
    definition: "The Paris Conservatoire, the state school of music founded by the Convention in 1795; for two centuries the gate through which French composers and players had to pass, with its own concert society, its published methods, its prizes, and the students who competed for the Prix de Rome, which Berlioz won and Ravel lost five times."
    pronunciation: "kon-sair-va-TWAR"
    language: French
    facts:
      - "Founded by decree of the Convention on 3 August 1795, merging the old École royale de chant with the National Guard's music school, under Bernard Sarrette; it stood on the rue Bergère until 1911, then on the rue de Madrid, and since 1990 at the Cité de la musique at La Villette."
      - "Its directors included Cherubini (1822 to 1842), Auber, Ambroise Thomas, Théodore Dubois and Fauré (1905 to 1920); its Société des Concerts, founded by François Habeneck in 1828, brought Beethoven's symphonies to Paris and was dissolved in 1967, succeeded by the Orchestre de Paris."
      - "The Prix de Rome, judged by the Académie des Beaux-Arts, sent the winner to the Villa Medici: Berlioz won it in 1830, having entered every year since 1826, Bizet in 1857, Debussy in 1884; Saint-Saëns failed twice and Ravel five times."
      - "When the jury eliminated Ravel in the first round in 1905, and it emerged that the finalists were all pupils of one juror, the scandal forced Dubois out of the directorship and put Fauré, who had never studied there, in his place."
    remark: "Berlioz won the Prix de Rome after five years of trying and Ravel lost it five times; when the jury threw Ravel out in the first round in 1905, the scandal cost the director his job and gave it to Fauré, who had never been a student there."
    gaffe: "Saying 'the Conservatory'. In Paris it is the Conservatoire, founded in 1795 by the Convention and not by any king; and the Prix de Rome was not even its prize, but the Académie's, which is why the row of 1905 was so hard to contain."
    distractors:
      term:
        - "The Paris Opéra's own ballet school, which trains the company's dancers from childhood."
        - "A private school founded in 1853 to train church organists and choirmasters, at which Fauré studied under Saint-Saëns."
        - "The concert hall built by the piano firm Pleyel on the rue du Faubourg Saint-Honoré in 1927."
    links: [music.berlioz.symphonie-fantastique, music.faure, music.ravel.bolero, music.cherubini, music.poulenc, music.term.salon, history.episode.french-revolution]
    tags: [term, institution, conservatoire, prix-de-rome, berlioz, ravel, faure, paris, 1790s]
    sources:
      - "Grove Music Online, 'Paris' and 'Conservatories'"
      - "Roger Nichols, Ravel (2011)"
      - "Constant Pierre, Le Conservatoire national de musique et de déclamation: documents historiques et administratifs (1900)"
    reviewed_by: null
