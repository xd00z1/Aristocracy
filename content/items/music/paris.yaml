  - id: music.faure
    discipline: music
    kind: creator
    title: "Gabriel Fauré"
    city: paris
    difficulty: 2
    era: Late Romantic
    year: 1845
    year_end: 1924
    pronunciation: "gah-bree-EL fo-RAY"
    facts:
      - "Born in Pamiers, in the Ariège, on 12 May 1845; trained not at the Conservatoire but at the École Niedermeyer in Paris, a school for church musicians, where Saint-Saëns taught him the piano and showed him Schumann, Liszt and Wagner."
      - "Choirmaster at the Madeleine from 1877 and its organist from 1896; director of the Paris Conservatoire from 1905 to 1920, where his reforms and sackings earned him the nickname Robespierre, and his pupils included Ravel, Enescu, Koechlin and Nadia Boulanger."
      - "His Requiem was first sung at the Madeleine on 16 January 1888, at the funeral of an architect, and grew to its final form by 1900; it leaves out the Dies irae sequence, and he said in 1902 that someone had called it 'a lullaby of death'."
      - "The Pavane of 1887 has words by Robert de Montesquiou and is dedicated to the Comtesse Greffulhe, the two people Proust would later turn into the Baron de Charlus and the Duchesse de Guermantes."
      - "Deaf and hearing pitches distorted from about 1903, he went on composing; he died in Paris on 4 November 1924 and was given a state funeral at the Madeleine."
    remark: "The Pavane's words are by Robert de Montesquiou and it is dedicated to the Comtesse Greffulhe: that is, to the models for Proust's Charlus and his Duchesse de Guermantes, a quarter of a century before Proust wrote them down."
    gaffe: "Expecting the Requiem to sound like Verdi's. It leaves out the Dies irae sequence that Verdi and Berlioz put at the centre of theirs; Fauré reported that someone had called it a lullaby of death and did not object."
    distractors:
      person: [Camille Saint-Saëns, Claude Debussy, Ernest Chausson]
      era: [Baroque, Classical, Modernist]
    links: [music.saint-saens.le-cygne, music.term.conservatoire, music.ravel.bolero, music.term.salon, music.debussy.clair-de-lune]
    tags: [composer, faure, requiem, pavane, conservatoire, madeleine, paris, 1800s, 1900s]
    sources:
      - "Grove Music Online, 'Fauré, Gabriel'"
      - "Jean-Michel Nectoux, Gabriel Fauré: A Musical Life, trans. Roger Nichols (1991)"
      - "Robert Orledge, Gabriel Fauré (1979)"
    reviewed_by: null

  - id: music.poulenc
    discipline: music
    kind: creator
    title: "Francis Poulenc"
    city: paris
    difficulty: 3
    era: Twentieth century
    year: 1899
    year_end: 1963
    pronunciation: "frahn-SEESS poo-LANK"
    facts:
      - "Born in Paris on 7 January 1899, the son of a pharmaceutical manufacturer whose firm became Rhône-Poulenc; he never attended the Conservatoire, studied the piano with Ricardo Viñes, and took his only composition lessons from Charles Koechlin in the early 1920s."
      - "One of Les Six, named by the critic Henri Collet in 1920, and the youngest of them but for Georges Auric, five weeks his junior; Rapsodie nègre (1917) made his name at eighteen, and Diaghilev staged his ballet Les Biches in 1924."
      - "After the death of his friend Pierre-Octave Ferroud in 1936 and a visit to the shrine of Rocamadour he returned to the Catholic faith; the Litanies à la Vierge noire (1936), the Stabat Mater (1950), Dialogues des Carmélites (La Scala, 1957) and the Gloria (1959–60) followed."
      - "He first accompanied the baritone Pierre Bernac in 1934 and gave the first recital of their twenty-five-year partnership on 3 April 1935, writing and touring his songs with him thereafter; in 1950 the critic Claude Rostand called him 'moine et voyou', monk and guttersnipe, and the phrase has stuck."
      - "Died in Paris on 30 January 1963; his last opera, La Voix humaine (1959), is a forty-minute telephone call for one soprano, to a text by Cocteau."
    remark: "He was a pharmaceutical manufacturer's son who never went to the Conservatoire, and Claude Rostand's 'moine et voyou' covers him: the Gloria and the Carmelites on one side, the naughty songs and Les Biches on the other."
    gaffe: "Treating Les Six as a school with a doctrine that Poulenc followed. They were six friends bundled together by a critic in 1920, with no manifesto of their own; Cocteau's Le Coq et l'Arlequin was the nearest thing, and it was Cocteau's."
    distractors:
      person: [Darius Milhaud, Arthur Honegger, Georges Auric]
      era: [Baroque, Classical, Romantic]
    links: [music.movement.les-six, music.satie.gymnopedie-1, music.term.conservatoire, music.term.salon]
    tags: [composer, poulenc, les-six, cocteau, song, sacred, paris, 1900s]
    sources:
      - "Grove Music Online, 'Poulenc, Francis'"
      - "Roger Nichols, Poulenc: A Biography (2020)"
      - "Carl B. Schmidt, Entrancing Muse: A Documented Biography of Francis Poulenc (2001)"
    reviewed_by: null

