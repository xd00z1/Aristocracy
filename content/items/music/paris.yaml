# Paris, music. Berlioz and the idée fixe, Chopin in the salons, Saint-Saëns's
# Swan, Satie, Debussy, Ravel's Boléro, the Rite of Spring riot; Fauré and
# Poulenc as creators; Les Six; and the words a fluent person needs
# (impressionism, the salon, the Conservatoire). Offenbach's galop and Lully
# live in the opera and Florence files and are linked, not duplicated.
# Themes are melody line only, at concert pitch, opening phrase, and only where
# the pitches could be written down with confidence; see CLAUDE.md.
items:
  # ---------------------------------------------------------------------------
  # Works
  # ---------------------------------------------------------------------------

  - id: music.berlioz.symphonie-fantastique
    discipline: music
    kind: work
    title: "Symphonie fantastique, Op. 14"
    creator: Hector Berlioz
    city: paris
    difficulty: 1
    era: Romantic
    year: 1830
    language: French
    pronunciation: "sam-fo-NEE fahn-tass-TEEK"
    facts:
      - "First performed on 5 December 1830 in the hall of the Paris Conservatoire, conducted by François Habeneck; Berlioz had won the Prix de Rome that August, having entered every year since 1826."
      - "Five movements with a printed programme: Rêveries – Passions, Un bal, Scène aux champs, Marche au supplice, and Songe d'une nuit du sabbat, in which the artist, who has taken opium, dreams he is executed and then mocked at a witches' sabbath to the plainchant Dies irae."
      - "The beloved is a tune, which Berlioz's programme calls the idée fixe; it returns in every movement, waltzing in the second, and in the finale it comes back as a shrill parody on the E-flat clarinet."
      - "The beloved was real: the Irish actress Harriet Smithson, whom Berlioz had seen as Ophelia at the Odéon in September 1827 and had never met. They were introduced in December 1832 and married on 3 October 1833."
      - "Liszt made the piano transcription in 1833, which is how much of Europe first heard it."
    remark: "It was written in 1830, three years after Beethoven died, and its idée fixe is a tune for a real woman, the actress Harriet Smithson, whom Berlioz had seen on stage and never met; they married three years later and it did not go well."
    gaffe: "Calling the idée fixe a leitmotif. Berlioz's is a whole tune that returns and is transformed, and idée fixe is his own term from the printed programme; Wagner's leitmotifs were decades away and work differently."
    distractors:
      creator: [Franz Liszt, Giacomo Meyerbeer, Charles Gounod]
      title: ["Harold en Italie", "Roméo et Juliette", "La damnation de Faust"]
      era: [Baroque, Classical, Modernist]
    links: [opera.berlioz.les-troyens, music.term.conservatoire, music.chopin.nocturne-op9-2, art.delacroix.liberty-leading-the-people]
    tags: [symphony, orchestral, berlioz, programme-music, idee-fixe, paris, 1830s]
    sources:
      - "Grove Music Online, 'Berlioz, Hector'"
      - "David Cairns, Berlioz: The Making of an Artist, 1803–1832 (2nd ed., 1999)"
      - "Edward T. Cone (ed.), Berlioz: Fantastic Symphony (Norton Critical Score, 1971)"
    reviewed_by: null

  - id: music.chopin.nocturne-op9-2
    discipline: music
    kind: work
    title: "Nocturne in E-flat major, Op. 9 No. 2"
    creator: Frédéric Chopin
    city: paris
    difficulty: 1
    era: Romantic
    year: 1832
    year_approx: true
    facts:
      - "The second of the three nocturnes of Op. 9, composed between 1830 and 1832 and dedicated to Madame Camille Pleyel: the pianist Marie Moke, who had been engaged to Berlioz and married the piano maker instead in April 1831."
      - "Chopin settled in Paris in the autumn of 1831 and made his debut there at the Salle Pleyel on 26 February 1832; he stayed for the rest of his life and wrote twenty-one nocturnes in all."
      - "The nocturne as a piano piece was the invention of the Irish pianist John Field, whose first ones were published in the 1810s; Chopin took the form and its singing right hand over a rocking left."
      - "In 12/8 and marked Andante; the tune returns more ornamented each time, and Chopin wrote further variants of the ornaments into his pupils' copies, some of which survive."
      - "Chopin's Funeral March, the slow movement of the B-flat minor Sonata, Op. 35, was written in 1837, two years before the rest of the sonata; it was played at his own funeral at the Madeleine in October 1849, orchestrated by Henri Reber."
    remark: "It is dedicated to Madame Camille Pleyel, the pianist Marie Moke, who had jilted Berlioz for the piano maker in the year Chopin arrived; musical Paris in 1831 was a very small town."
    gaffe: "Asking for 'the Chopin nocturne'. There are twenty-one; this is Op. 9 No. 2 in E-flat, and if you add anything, add that the form was invented by an Irishman, John Field, not by Chopin."
    distractors:
      creator: [Franz Liszt, John Field, Robert Schumann]
      title: ["Nocturne in C-sharp minor, Op. posth.", "Waltz in D-flat major, Op. 64 No. 1 ('Minute')", "Prelude in D-flat major, Op. 28 No. 15 ('Raindrop')"]
      era: [Baroque, Classical, Modernist]
    links: [music.term.salon, music.berlioz.symphonie-fantastique, music.term.conservatoire, art.delacroix.liberty-leading-the-people]
    tags: [piano, nocturne, chopin, salon, paris, 1830s]
    sources:
      - "Grove Music Online, 'Chopin, Fryderyk Franciszek'"
      - "Jim Samson, Chopin (Master Musicians, 1996)"
      - "Jean-Jacques Eigeldinger, Chopin: Pianist and Teacher as Seen by his Pupils (1986)"
    reviewed_by: null

  - id: music.saint-saens.le-cygne
    discipline: music
    kind: work
    title: "Le Cygne (The Swan)"
    parent: "Le Carnaval des animaux (1886)"
    creator: Camille Saint-Saëns
    city: paris
    difficulty: 1
    era: Late Romantic
    year: 1886
    language: French
    pronunciation: "luh SEEN-yuh"
    facts:
      - "The thirteenth of the fourteen movements of Le Carnaval des animaux, a 'grand zoological fantasy' written in a few days in February 1886 for a private Shrove Tuesday concert given by the cellist Charles Lebouc on 9 March."
      - "For cello and two pianos in the original; Saint-Saëns forbade public performance of the Carnival in his lifetime, fearing it would damage his reputation as a serious composer, and allowed only The Swan to be published, in 1887. The rest appeared in 1922, after his death."
      - "The Carnival's jokes include Offenbach's galop from Orphée aux enfers slowed to a crawl for the tortoises, Berlioz's Dance of the Sylphs given to the elephant on a double bass, and Saint-Saëns's own Danse macabre rattled out on a xylophone in Fossils."
      - "Michel Fokine made the solo The Dying Swan for Anna Pavlova to it in St Petersburg in 1905; it became her signature piece and she danced it for the rest of her life."
    remark: "It is the only piece of the Carnival that Saint-Saëns let out in his lifetime; the rest, with its tortoises dancing Offenbach's galop at a crawl, was a private joke he sat on for thirty-five years."
    gaffe: "Calling it The Dying Swan as if that were the title. Saint-Saëns wrote Le Cygne; the dying is Fokine's and Pavlova's, some twenty years later, and the composer had nothing to do with it."
    distractors:
      creator: [Gabriel Fauré, Jules Massenet, Édouard Lalo]
      title: ["Aquarium, from Le Carnaval des animaux", "Danse macabre, Op. 40", "Havanaise, Op. 83"]
      era: [Baroque, Classical, Modernist]
    links: [opera.offenbach.orphee-aux-enfers.galop-infernal, music.faure, music.term.salon, music.stravinsky.le-sacre-du-printemps]
    tags: [cello, carnival-of-the-animals, saint-saens, ballet, paris, 1880s]
    sources:
      - "Grove Music Online, 'Saint-Saëns, Camille'"
      - "Brian Rees, Camille Saint-Saëns: A Life (1999)"
      - "Sabina Teller Ratner, Camille Saint-Saëns, 1835–1921: A Thematic Catalogue of his Complete Works, vol. 1 (2002)"
    reviewed_by: null

  - id: music.satie.gymnopedie-1
    discipline: music
    kind: work
    title: "Gymnopédie No. 1"
    creator: Erik Satie
    city: paris
    difficulty: 1
    era: Fin de siècle
    year: 1888
    language: French
    pronunciation: "zheem-no-pay-DEE"
    facts:
      - "The first of three Gymnopédies for piano written in 1888, when Satie was twenty-two and earning his living as a pianist at the cabaret Le Chat Noir in Montmartre; it is marked 'Lent et douloureux', slow and sorrowful."
      - "The word refers to the gymnopaedia, a festival of ancient Sparta at which naked youths danced; where Satie found it is disputed, and he is said to have introduced himself at the Chat Noir as a 'gymnopédiste'."
      - "Debussy orchestrated the first and third in 1896 and swapped their numbers, so that Debussy's 'first' Gymnopédie is Satie's third; the orchestral versions were first played at the Société nationale in February 1897."
      - "One tune over a rocking accompaniment of two chords, in 3/4, in D major; the second and third Gymnopédies use the same shape, which is why they are often mistaken for one another."
    remark: "The word means the naked-boy dances of Sparta and nobody knows why Satie chose it; Debussy orchestrated two of the three in 1896 and swapped their numbers, so his first Gymnopédie is Satie's third."
    gaffe: "Calling it Impressionist because it is quiet and French. It is six years older than Debussy's Faune and the opposite of it: no wash of colour, one tune, two chords. Les Six took their plainness from Satie, not from Debussy."
    distractors:
      creator: [Claude Debussy, Gabriel Fauré, Maurice Ravel]
      title: ["Gnossienne No. 1", "Je te veux", "Trois morceaux en forme de poire"]
      era: [Baroque, Classical, Romantic]
    links: [music.movement.les-six, music.debussy.clair-de-lune, music.term.impressionism, music.poulenc]
    tags: [piano, satie, montmartre, chat-noir, paris, 1880s]
    sources:
      - "Grove Music Online, 'Satie, Erik'"
      - "Robert Orledge, Satie the Composer (1990)"
      - "Steven Moore Whiting, Satie the Bohemian: From Cabaret to Concert Hall (1999)"
    reviewed_by: null

  - id: music.debussy.clair-de-lune
    discipline: music
    kind: work
    title: "Clair de lune, from Suite bergamasque"
    parent: "Suite bergamasque (c. 1890, published 1905)"
    creator: Claude Debussy
    city: paris
    difficulty: 1
    era: Impressionist
    year: 1890
    year_approx: true
    language: French
    pronunciation: "klair duh LOON"
    facts:
      - "The third of the four movements of the Suite bergamasque for piano (Prélude, Menuet, Clair de lune, Passepied), begun around 1890 and revised for publication by Fromont in 1905, when Debussy had become famous and the publisher held the rights."
      - "The title is Verlaine's, from the poem 'Clair de lune' in Fêtes galantes (1869), which begins 'Votre âme est un paysage choisi' and speaks of 'masques et bergamasques'; Debussy set the poem as a song twice, in 1882 and 1891."
      - "In the 1890 manuscript the movement was called 'Promenade sentimentale', after another Verlaine poem; the present title came with the revision of 1905."
      - "In D-flat major and 9/8, marked 'Andante très expressif'; Debussy had won the Prix de Rome in 1884 and was, at the time he wrote it, a struggling composer of songs."
    remark: "Bergamasque is Verlaine's word, from a poem about masks in moonlight, and the piece was called Promenade sentimentale until Debussy revised it for publication in 1905, fifteen years after he wrote it."
    gaffe: "Calling it Debussy's Moonlight Sonata, or attributing it to Chopin. It is one movement of a four-movement suite; and the nickname Moonlight was not even Beethoven's, but a critic's, five years after his death."
    distractors:
      creator: [Maurice Ravel, Gabriel Fauré, Erik Satie]
      title: ["Rêverie", "Arabesque No. 1", "La fille aux cheveux de lin"]
      era: [Baroque, Classical, Romantic]
    links: [music.term.impressionism, music.satie.gymnopedie-1, music.ravel.bolero, opera.debussy.pelleas-et-melisande, music.faure]
    tags: [piano, suite, debussy, verlaine, paris, 1890s, 1900s]
    sources:
      - "Grove Music Online, 'Debussy, Claude'"
      - "François Lesure, Claude Debussy: A Critical Biography, trans. Marie Rolf (2019)"
      - "Roger Nichols, The Life of Debussy (1998)"
    reviewed_by: null

  - id: music.ravel.bolero
    discipline: music
    kind: work
    title: "Boléro"
    creator: Maurice Ravel
    city: paris
    difficulty: 1
    era: Early modern
    year: 1928
    language: French
    pronunciation: "bo-lay-RO"
    facts:
      - "Commissioned by the dancer Ida Rubinstein and first performed at the Paris Opéra on 22 November 1928, with Rubinstein dancing on a table in a Spanish tavern, choreography by Bronislava Nijinska, sets by Alexandre Benois, and Walther Straram conducting."
      - "Ravel had meant to orchestrate pieces from Albéniz's Iberia for her, found that the orchestration rights belonged to Enrique Fernández Arbós, and wrote an original piece instead."
      - "One rhythm on the side drum from the first bar to the last, two eighteen-bar tunes alternating over it, a single crescendo, and C major throughout until one change of key just before the end; Ravel told the Daily Telegraph in 1931 that it was 'orchestral tissue without music'."
      - "Ravel wanted it slow, about a quarter of an hour; when Toscanini took it faster with the New York Philharmonic in Paris in May 1930 the two men quarrelled about it."
      - "Ravel's other tune that everyone knows, the Pavane pour une infante défunte, was written for piano in 1899 while he was still a Conservatoire student and orchestrated in 1910."
    remark: "Ravel wrote it for Ida Rubinstein to dance on a tavern table in 1928, and told the Daily Telegraph it was 'orchestral tissue without music': one rhythm, two tunes, one crescendo, one change of key just before the end."
    gaffe: "Complaining that it is repetitive. That is the whole design and Ravel said so himself; the informed complaint is about the tempo, which Toscanini took too fast in 1930 and was told so."
    distractors:
      creator: [Claude Debussy, Manuel de Falla, Igor Stravinsky]
      title: ["La Valse", "Pavane pour une infante défunte", "Rapsodie espagnole"]
      era: [Baroque, Classical, Romantic]
    links: [music.debussy.clair-de-lune, music.stravinsky.le-sacre-du-printemps, music.term.conservatoire, music.term.impressionism, opera.venue.palais-garnier]
    tags: [orchestral, ballet, ravel, ida-rubinstein, paris, 1920s]
    sources:
      - "Grove Music Online, 'Ravel, Maurice'"
      - "Arbie Orenstein, Ravel: Man and Musician (1975)"
      - "Roger Nichols, Ravel (2011)"
    reviewed_by: null

  - id: music.stravinsky.le-sacre-du-printemps
    discipline: music
    kind: work
    title: "Le Sacre du printemps (The Rite of Spring)"
    creator: Igor Stravinsky
    city: paris
    difficulty: 1
    era: Early modern
    year: 1913
    language: French
    pronunciation: "luh SAH-kruh dew pran-TAHN"
    facts:
      - "First performed on 29 May 1913 at the Théâtre des Champs-Élysées, which had opened that April, by Diaghilev's Ballets Russes: choreography by Vaslav Nijinsky, designs by Nicholas Roerich, Pierre Monteux conducting."
      - "Subtitled 'Pictures of pagan Russia in two parts'; a chosen maiden dances herself to death. The audience laughed, shouted and fought until the orchestra could not be heard; Stravinsky left his seat and watched from the wings, where Nijinsky stood on a chair shouting the counts to the dancers."
      - "The music itself won within a year: Monteux conducted it in concert at the Casino de Paris on 5 April 1914 and Stravinsky was carried out on the crowd's shoulders."
      - "Nijinsky's choreography was lost after a handful of performances in Paris and London and was reconstructed by Millicent Hodson and Kenneth Archer for the Joffrey Ballet in 1987."
      - "Debussy and Stravinsky played it through as a piano duet at Louis Laloy's house at Bellevue in June 1912, a year before the premiere."
    remark: "The riot was at the ballet, not the music: a year later Monteux conducted it in concert at the Casino de Paris and Stravinsky was carried out on the crowd's shoulders. It was Nijinsky's steps that people could not bear."
    gaffe: "Repeating that Saint-Saëns stormed out over the bassoon's first note. The story is Stravinsky's own, told years later, and there is no evidence that Saint-Saëns was in the theatre that night."
    distractors:
      creator: [Claude Debussy, Sergei Prokofiev, Maurice Ravel]
      title: ["L'Oiseau de feu (The Firebird)", "Petrushka", "Daphnis et Chloé"]
      era: [Baroque, Classical, Romantic]
    links: [music.ravel.bolero, music.debussy.clair-de-lune, music.saint-saens.le-cygne, music.movement.les-six]
    tags: [ballet, orchestral, stravinsky, diaghilev, ballets-russes, premiere, paris, 1910s]
    sources:
      - "Grove Music Online, 'Stravinsky, Igor'"
      - "Thomas Forrest Kelly, First Nights: Five Musical Premieres (2000)"
      - "Richard Taruskin, Stravinsky and the Russian Traditions (1996)"
    reviewed_by: null

