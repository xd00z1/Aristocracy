  - id: music.movement.les-six
    discipline: music
    kind: movement
    title: "Les Six"
    city: paris
    difficulty: 2
    era: Twentieth century
    year: 1920
    year_end: 1924
    language: French
    pronunciation: "lay SEESS"
    facts:
      - "Named by the critic Henri Collet in the newspaper Comœdia on 16 January 1920, in an article that set six young French composers beside the Russian Five and Erik Satie: Georges Auric, Louis Durey, Arthur Honegger, Darius Milhaud, Francis Poulenc and Germaine Tailleferre."
      - "Jean Cocteau was their publicist and Satie their elder; Cocteau's pamphlet Le Coq et l'Arlequin (1918) had called for a French music of the circus, the music hall and the street, against Wagner and against Debussy's mists."
      - "They wrote one work together, the Album des Six for piano in 1920, and one stage piece, Cocteau's Les Mariés de la tour Eiffel of 1921, to which only five contributed; Durey left in 1921 and by the mid-1920s the rest had gone their own ways."
      - "Milhaud's ballet Le Bœuf sur le toit (1920) gave its name to the bar on the rue Boissy d'Anglas, opened in 1922, where the group and its friends met; Honegger, a Swiss, wrote Pacific 231 (1923) about a locomotive."
    remark: "Henri Collet made them up in a newspaper in January 1920 by counting them against the Russian Five; they wrote exactly one stage work together, Cocteau's Les Mariés de la tour Eiffel, and only five of them did that."
    gaffe: "Counting Satie among Les Six. He was their patron saint, not a member, and Collet's article named him separately; the six are Auric, Durey, Honegger, Milhaud, Poulenc and Tailleferre, and Tailleferre is the one everyone forgets."
    distractors:
      title: ["Les Apaches", "The Russian Five", "The Second Viennese School"]
      era: [Baroque, Classical, Romantic]
    links: [music.poulenc, music.satie.gymnopedie-1, music.term.impressionism, music.term.conservatoire, music.movement.florentine-camerata, music.stravinsky.le-sacre-du-printemps]
    tags: [movement, les-six, cocteau, satie, poulenc, milhaud, honegger, paris, 1920s]
    sources:
      - "Grove Music Online, 'Six, Les'"
      - "Robert Shapiro (ed.), Les Six: The French Composers and Their Mentors Jean Cocteau and Erik Satie (2011)"
      - "Jean Cocteau, Le Coq et l'Arlequin (1918)"
    reviewed_by: null

  # ---------------------------------------------------------------------------
