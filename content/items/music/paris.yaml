  - id: music.term.impressionism
    discipline: music
    kind: term
    title: "Impressionism (in music)"
    city: paris
    difficulty: 1
    era: Impressionist
    year: 1894
    definition: "The label borrowed from painting for the music of Debussy and, less happily, Ravel: colour and atmosphere over argument, whole-tone and modal scales, chords chosen for their sound rather than their function, and titles about water, weather and light. Debussy disliked the word."
    pronunciation: "im-PRESH-un-izm"
    facts:
      - "The word was first applied to Debussy in 1887 by the Académie des Beaux-Arts, as a reproach, in its report on Printemps, the piece he had sent back from Rome as a Prix de Rome winner; it warned him against 'vague impressionism'."
      - "Prélude à l'après-midi d'un faune, after Mallarmé's poem, was first played at the Société nationale on 22 December 1894; Boulez later wrote that modern music was awakened by it. La Mer, three symphonic sketches, followed at the Concerts Lamoureux on 15 October 1905, with Hokusai's Great Wave on the cover of the score."
      - "Debussy wrote to his publisher Durand in March 1908 that he was trying to make 'something different, realities in a way: what imbeciles call impressionism'."
      - "Ravel, who wrote sonatas, a string quartet and Le Tombeau de Couperin, resisted the label, and the two composers' partisans quarrelled for years over who had borrowed from whom."
    remark: "Debussy hated the word: he wrote to his publisher in 1908 that he was after 'what imbeciles call impressionism', and the first people to apply it to him, the Académie des Beaux-Arts in 1887, meant it as a reproach."
    gaffe: "Lumping Ravel in with Debussy as 'the Impressionists' in front of a musician. Ravel wrote sonatas, a string quartet and a Tombeau de Couperin; the two men's admirers quarrelled over who had borrowed from whom, and neither man liked the word."
    distractors:
      term:
        - "The German movement of about 1905 to 1925 that expressed extreme inner states through dissonance and the abandonment of key, as in early Schoenberg and Berg."
        - "The revival of eighteenth-century forms, clear textures and small orchestras in the 1920s, as in Stravinsky's Pulcinella."
        - "The nineteenth-century idea that orchestral music should tell a story or paint a scene, as in Liszt's symphonic poems."
