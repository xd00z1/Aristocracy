  - id: music.movement.second-viennese-school
    discipline: music
    kind: movement
    title: "The Second Viennese School"
    city: vienna
    difficulty: 3
    era: Modernist
    year: 1904
    facts:
      - "Arnold Schoenberg (1874–1951) and his two great pupils, Alban Berg and Anton Webern, who both began studying with him in 1904; the name answers the first Viennese school of Haydn, Mozart and Beethoven."
      - "On 31 March 1913, in the Great Hall of the Musikverein, a concert of their music conducted by Schoenberg ended in a brawl and had to be abandoned; Vienna calls it the Skandalkonzert."
      - "Schoenberg's answer to hostile audiences was the Society for Private Musical Performances, which ran from 1918 to 1921: members only, no critics admitted, no applause, and the programme not announced in advance."
      - "He made the twelve-note method public in 1923: all twelve notes of the chromatic scale set in a row and used in order, so that none of them can become home. He was superstitious about the number thirteen, spelled the title of his opera Moses und Aron with one 'a' to keep it to twelve letters, and died on Friday 13 July 1951."
    remark: "The name is a claim rather than a label: it answers the first Viennese school of Haydn, Mozart and Beethoven, and Schoenberg thought he was continuing that line, not breaking it."
    gaffe: "Calling the music atonal in front of anyone who cares. Schoenberg disliked the word — the notes have relations, just not a key — and talked instead about the emancipation of the dissonance."
    distractors:
      title: ["The First Viennese School", "Les Six", "The Mighty Handful"]
      era: [Baroque, Classical, Romantic]
