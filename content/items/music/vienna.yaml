      title: ["Symphony No. 3 in E-flat major, 'Eroica'", "Symphony No. 9 in D minor, 'Choral'", "Symphony No. 6 in F major, 'Pastoral'"]
      era: [Baroque, High Romantic, Modernist]
    links: []
    tags: [symphony, vienna, 1800s, beethoven]
