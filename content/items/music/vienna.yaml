  - id: music.haydn.symphony-94.ii
    discipline: music
    kind: work
    title: "Symphony No. 94 in G major ('Surprise'), second movement"
    creator: Joseph Haydn
    city: vienna
    difficulty: 1
    era: Classical
    year: 1792
    facts:
      - "One of the twelve 'London' symphonies written for Johann Peter Salomon's concerts; first performed at the Hanover Square Rooms in London on 23 March 1792, with Haydn directing from the fortepiano."
      - "The Andante is a set of variations on a tune of nursery simplicity; the theme is played once quietly and then repeated more quietly still, and the fortissimo chord with the kettledrum lands at the end of that repeat."
      - "Asked by his biographer Griesinger whether the chord was meant to wake a dozing audience, Haydn said he had wanted to surprise the public with something new and to keep his former pupil Ignaz Pleyel, then running rival concerts in London, from outdoing him. His friend the composer Gyrowetz remembered him showing off the passage beforehand and saying it would make the ladies scream."
      - "Back in Vienna in 1797 Haydn wrote 'Gott erhalte Franz den Kaiser' as an Austrian answer to the 'God Save the King' he had heard in London, and used it as the slow movement of the String Quartet Op. 76 No. 3, which is why that quartet is called the Emperor."
    remark: "Haydn told his biographer that the chord was there to give the public something new and to stop his old pupil Pleyel outdoing him in London; the story that he wrote it to wake a dozing audience came afterwards."
    gaffe: "Waiting for the surprise in the first movement, or calling this the Drumroll. The chord comes in the slow movement, and the Drumroll is No. 103, which opens with one."
    theme:
      notes: "C5/4 C5/4 | E5/4 E5/4 | G5/4 G5/4 | E5/4 R/4 | F5/4 F5/4 | D5/4 D5/4 | B4/4 B4/4 | G4/4 R/4"
      tempo: 76
      key: C major
      note: "The first eight bars of the Andante theme, melody only, staccato in the strings; the chord arrives eight bars later, at the end of the quiet repeat."
    distractors:
      creator: [Wolfgang Amadeus Mozart, Ludwig van Beethoven, Ignaz Pleyel]
      title: ["Symphony No. 104 in D major ('London')", "Symphony No. 45 in F-sharp minor ('Farewell')", "Symphony No. 101 in D major ('The Clock')"]
      era: [Baroque, Romantic, Modernist]
    links: [music.anon.god-save-the-king, music.mozart.eine-kleine-nachtmusik, music.beethoven.symphony-5.i]
    tags: [symphony, haydn, london-symphonies, classical, 1790s, salomon]
    sources:
      - "Grove Music Online, 'Haydn, Joseph'"
      - "H. C. Robbins Landon, Haydn: Chronicle and Works, vol. 3: Haydn in England 1791–1795 (1976)"
      - "Georg August Griesinger, Biographische Notizen über Joseph Haydn (1810)"
    reviewed_by: null

  - id: music.mozart.eine-kleine-nachtmusik
    discipline: music
    kind: work
    title: "Eine kleine Nachtmusik, K. 525, first movement"
    creator: Wolfgang Amadeus Mozart
    city: vienna
    difficulty: 1
    era: Classical
    year: 1787
    language: German
    pronunciation: "EYE-nuh KLY-nuh NAHKHT-moo-zeek"
    facts:
      - "Mozart entered it in his own catalogue of works on 10 August 1787, in Vienna, while he was in the middle of Don Giovanni; no commission, occasion or performance in his lifetime is documented."
      - "His catalogue entry lists five movements — Allegro, Minuet and Trio, Romance, Minuet and Trio, Finale — but the leaf carrying the first minuet was torn out of the autograph and lost, which is why it is played in four."
      - "A serenade for strings: two violins, viola, cello and bass, one to a part or a whole string orchestra."
      - "It was not published until 1827, thirty-six years after his death, by Johann André of Offenbach."
    remark: "He wrote it in Vienna in August 1787 in the middle of composing Don Giovanni, and nobody knows who it was for or whether he ever heard it; it was not printed until 1827."
    gaffe: "Calling it a symphony, or a quartet. It is a serenade for strings, and it had five movements until somebody tore the first minuet out of the manuscript."
    theme:
      notes: "G4/4 R/8 D4/8 G4/4 R/8 D4/8 | G4/8 D4/8 G4/8 B4/8 D5/4 R/4"
      tempo: 132
      key: G major
      note: "The opening two bars, all the strings in unison, melody only."
    distractors:
      creator: [Joseph Haydn, Luigi Boccherini, Johann Christian Bach]
      title: ["Serenade No. 10 in B-flat major ('Gran Partita')", "Symphony No. 40 in G minor, K. 550", "Divertimento in D major, K. 136"]
      era: [Baroque, Romantic, Modernist]
    links: [opera.mozart.don-giovanni, opera.mozart, music.mozart.rondo-alla-turca, music.haydn.symphony-94.ii, history.episode.joseph-ii-and-mozart]
    tags: [serenade, strings, mozart, classical, 1780s]
    sources:
      - "Grove Music Online, 'Mozart, Wolfgang Amadeus'"
      - "Neal Zaslaw and William Cowdery (eds.), The Compleat Mozart (1990)"
      - "Köchel-Verzeichnis (Internationale Stiftung Mozarteum), KV 525"
    reviewed_by: null

  - id: music.mozart.rondo-alla-turca
    discipline: music
    kind: work
    title: "Rondo alla turca, from the Piano Sonata in A major, K. 331"
    parent: "Piano Sonata No. 11 in A major, K. 331 (c. 1783)"
    creator: Wolfgang Amadeus Mozart
    city: vienna
    difficulty: 1
    era: Classical
    year: 1783
    year_approx: true
    facts:
      - "The finale of the Sonata in A major, K. 331, which Artaria published in Vienna early in 1784 with two other sonatas; scholars now date all three to about 1783 rather than to Paris in 1778, as older books have it."
      - "Marked 'Alla turca', it imitates the janissary band of the Ottoman army, whose sound Vienna had heard at the siege of 1683 and whose fashion was at its height in the 1780s; Viennese pianos of the day often had a pedal that rang a bell and struck a drum for this kind of music."
      - "The sonata contains no movement in sonata form at all: a theme and variations, a minuet, and this rondo."
      - "In 2014 Balázs Mikusi found four pages of the lost autograph in the National Széchényi Library in Budapest; they differ in places from the printed first edition."
    remark: "It imitates a janissary band, and the Viennese pianos of the 1780s often had a pedal that rang a bell and beat a drum for exactly this sort of music."
    gaffe: "Calling it a Turkish tune. It quotes no Turkish melody: alla turca is a Viennese style, got up a century after the janissaries were last at the walls."
    theme:
      notes: "B4/16 A4/16 G#4/16 A4/16 | C5/4 D5/16 C5/16 B4/16 C5/16 | E5/4 F5/16 E5/16 D#5/16 E5/16"
      tempo: 120
      key: A minor
      note: "The upbeat turn and the first two bars of the rondo theme; the turn figures climb the A minor triad, and the third of them is left where it lands."
    distractors:
      creator: [Joseph Haydn, Muzio Clementi, Johann Nepomuk Hummel]
      title: ["Fantasia in D minor, K. 397", "Rondo in A minor, K. 511", "Twelve Variations on 'Ah vous dirai-je, Maman', K. 265"]
      era: [Baroque, Romantic, Modernist]
    links: [history.episode.siege-of-vienna, opera.mozart.die-entfuehrung-aus-dem-serail, music.mozart.eine-kleine-nachtmusik, opera.mozart]
    tags: [piano, sonata, mozart, alla-turca, janissary, classical, 1780s]
    sources:
      - "Grove Music Online, 'Mozart, Wolfgang Amadeus'"
      - "Eva Badura-Skoda and Paul Badura-Skoda, Interpreting Mozart: The Performance of His Piano Works (rev. ed., 2008)"
      - "National Széchényi Library, Budapest, on the K. 331 autograph fragment found in 2014"
    reviewed_by: null

  - id: music.beethoven.symphony-9.ode-to-joy
    discipline: music
    kind: work
    title: "Ode to Joy, from the Symphony No. 9 in D minor, Op. 125"
    parent: "Symphony No. 9 in D minor, Op. 125 ('Choral', 1824)"
    creator: Ludwig van Beethoven
    city: vienna
    difficulty: 1
    era: Classical / early Romantic
    year: 1824
    facts:
      - "First performed at the Kärntnertortheater in Vienna on 7 May 1824. Michael Umlauf conducted and the players had been told to watch him; Beethoven stood beside him setting the tempi, too deaf to hear what followed, and the contralto Caroline Unger turned him round to see the applause."
      - "The tune enters in the finale on cellos and basses alone, with no harmony under it, and is built up through the orchestra before any voice sings a word."
      - "The words are Schiller's An die Freude of 1785, in the poet's later revision; the lines that open the finale, calling for other and more pleasant sounds, are Beethoven's own."
      - "The Council of Europe adopted the tune as its anthem in 1972, in an arrangement by Herbert von Karajan, and the European Communities followed in 1985; it is official without words, so that no language is favoured."
    remark: "The tune arrives on cellos and basses alone, with no harmony at all, and the orchestra has to build it up before anyone is allowed to sing it; the first words of the finale are Beethoven's own, not Schiller's."
    gaffe: "Calling the Ode to Joy the symphony. It is one tune in a finale of about a quarter of an hour, in a work that runs over an hour, and three movements go by before it appears."
    theme:
      notes: "F#4/4 F#4/4 G4/4 A4/4 | A4/4 G4/4 F#4/4 E4/4 | D4/4 D4/4 E4/4 F#4/4 | F#4/4. E4/8 E4/2 | F#4/4 F#4/4 G4/4 A4/4 | A4/4 G4/4 F#4/4 E4/4 | D4/4 D4/4 E4/4 F#4/4 | E4/4. D4/8 D4/2"
      tempo: 108
      key: D major
      note: "The first eight bars of the tune as the cellos and basses give it out in the finale, melody only."
    distractors:
      creator: [Franz Schubert, Joseph Haydn, Carl Maria von Weber]
      title: ["Missa solemnis, Op. 123", "Symphony No. 6 in F major ('Pastoral')", "Fantasia in C minor, Op. 80 ('Choral Fantasy')"]
      era: [Baroque, Late Romantic, Modernist]
    links: [music.beethoven.symphony-5.i, opera.beethoven.fidelio, history.episode.congress-of-vienna, music.schubert]
    tags: [symphony, choral, beethoven, schiller, 1820s, european-anthem]
    sources:
      - "Grove Music Online, 'Beethoven, Ludwig van'"
      - "Lewis Lockwood, Beethoven: The Music and the Life (2003)"
      - "Nicholas Cook, Beethoven: Symphony No. 9 (Cambridge Music Handbooks, 1993)"
    reviewed_by: null

  - id: music.strauss-ii.an-der-schoenen-blauen-donau
    discipline: music
    kind: work
    title: "An der schönen, blauen Donau (The Blue Danube), Op. 314"
    creator: Johann Strauss II
    city: vienna
    difficulty: 1
    era: Romantic
    year: 1867
    language: German
    pronunciation: "ahn dair SHUR-nen BLOW-en DOH-now"
    facts:
      - "First performed on 15 February 1867 at the Dianabad-Saal in Vienna, as a choral waltz for the Wiener Männergesang-Verein to comic verses by the society's own poet, Josef Weyl; the wordless orchestral version came later that year and made its name in Paris at the World Exhibition."
      - "Vienna had been beaten by Prussia at Königgrätz the summer before, and the piece was written for a city in low spirits."
      - "The title comes from a poem by Karl Isidor Beck, whose refrain addresses the beautiful blue Danube; the river at Vienna is grey-green."
      - "Brahms, who admired Strauss and was his friend, is said to have written the opening bars on Adele Strauss's fan and added that they were, alas, not by Johannes Brahms."
    remark: "It started life as a choral waltz for a men's singing club in February 1867, with joke verses, written for a city that had just lost a war to Prussia; the version everyone knows has no words at all."
    gaffe: "Assuming the Danube is blue, or that this Strauss wrote the Radetzky March. The river is grey-green, and the march is his father's, from the other side of the 1848 barricades."
    theme:
      notes: "D4/4 F#4/4 A4/4 | A4/2. | D4/4 F#4/4 A4/4 | A4/2."
      tempo: 160
      key: D major
      note: "The first waltz: the rising D major triad and its held answer, twice. The orchestra's accented after-beats under the held note are not notated."
    distractors:
      creator: [Johann Strauss I, Josef Lanner, Émile Waldteufel]
      title: ["Tales from the Vienna Woods, Op. 325", "Emperor Waltz, Op. 437", "Wine, Women and Song, Op. 333"]
      era: [Baroque, Classical, Modernist]
    links: [music.term.waltz, music.strauss-i.radetzky-marsch, opera.strauss-ii.die-fledermaus, history.episode.1848-and-franz-joseph, music.brahms]
    tags: [waltz, strauss, vienna, danube, 1860s, mannergesang-verein]
    sources:
      - "Grove Music Online, 'Strauss, Johann (ii)'"
      - "Peter Kemp, The Strauss Family: Portrait of a Musical Dynasty (1985)"
    reviewed_by: null

  - id: music.strauss-i.radetzky-marsch
    discipline: music
    kind: work
    title: "Radetzky-Marsch, Op. 228"
    creator: Johann Strauss I
    city: vienna
    difficulty: 2
    era: Romantic
    year: 1848
    language: German
    facts:
      - "First played on 31 August 1848 at a festival at the Wasserglacis in Vienna, in honour of Field Marshal Radetzky, who had beaten the Piedmontese at Custoza on 25 July; the officers in the audience clapped and stamped along, and the audience has clapped ever since."
      - "Strauss the elder took the court's side in the revolutions of 1848 while his son Johann II played the Marseillaise for the other, which cost the son official favour for years."
      - "It has ended the Vienna Philharmonic's New Year's Concert since 1946, with the conductor turning round to govern the clapping."
      - "The score used from 1946 was an arrangement made in 1914 by Leopold Weninger, who later joined the Nazi party; the orchestra played the original 1848 scoring under Nikolaus Harnoncourt in 2001 and adopted a new edition in 2020."
    remark: "It is the counter-revolution's own tune: written in August 1848 for the field marshal who had just put down the Italians, while the composer's son was playing the Marseillaise for the revolution at home."
    gaffe: "Crediting it to the waltz Strauss. The march is the father's, the Blue Danube the son's, and in 1848 the two of them were on opposite sides."
    distractors:
      creator: [Johann Strauss II, Josef Lanner, Josef Strauss]
      title: ["Persischer Marsch, Op. 289", "Egyptischer Marsch, Op. 335", "Marche militaire No. 1 in D, D. 733"]
      era: [Baroque, Classical, Modernist]
    links: [music.term.waltz, music.strauss-ii.an-der-schoenen-blauen-donau, history.episode.1848-and-franz-joseph, history.person.franz-joseph]
    tags: [march, strauss, radetzky, revolution-1848, new-years-concert, vienna]
    sources:
      - "Grove Music Online, 'Strauss, Johann (i)'"
      - "Peter Kemp, The Strauss Family: Portrait of a Musical Dynasty (1985)"
      - "Wiener Philharmoniker, 'The Philharmonic Version of the Radetzky March'"
    reviewed_by: null

