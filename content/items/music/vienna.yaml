  - id: music.term.lied
    discipline: music
    kind: term
    title: Lied
    city: vienna
    difficulty: 1
    era: Romantic
    definition: "A German art song for solo voice and piano, in which the piano is a partner rather than an accompaniment; the plural is Lieder."
    pronunciation: "leet (plural LEE-der)"
    language: German
    facts:
      - "Schubert wrote more than six hundred Lieder, including the cycles Die schöne Müllerin and Winterreise."
      - "Schumann, Brahms, Wolf, Mahler and Richard Strauss carried the form to the end of the nineteenth century."
    remark: "The point of a Lied is that the piano is telling the story too; listen to what it does under the voice, not just to the tune."
    gaffe: "Saying 'a Lieder'. Lied is the singular; Lieder is the plural."
    distractors:
      term:
        - "A short instrumental piece for solo piano in a single mood, often published in sets."
        - "A German dance in triple time that preceded the waltz."
        - "The German term for a choral movement in an oratorio."
    links: []
    tags: [term, song, german, schubert]
    sources:
      - "Grove Music Online, 'Lied'"
    reviewed_by: null

