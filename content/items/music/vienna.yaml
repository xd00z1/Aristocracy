  - id: music.term.waltz
    discipline: music
    kind: term
    title: Waltz
    pronunciation: "German Walzer, VAL-tser"
    language: German
    city: vienna
    difficulty: 2
    era: Romantic
    definition: "A dance in triple time in which a couple turn while holding each other, and the music written for it; the Viennese sort is fast, and its second beat is played a shade early."
    facts:
      - "It grew out of the Ländler, the turning dance of the Alpine countryside, and scandalised polite Europe because the partners held one another instead of dancing in a line or a set."
      - "The Congress of Vienna danced it into respectability in 1814 and 1815; the Prince de Ligne's line about the Congress dancing rather than advancing was about actual balls."
      - "Joseph Lanner and Johann Strauss the elder turned it into concert music in the 1820s and 1830s, as rivals; Strauss's son Johann II wrote over five hundred pieces, most of them dances, and his brothers Josef and Eduard kept the family orchestra going."
      - "The Vienna Philharmonic's New Year's Concert, chiefly Strauss family music, was first given on 31 December 1939 under Clemens Krauss in the Musikverein, whose Golden Hall opened in 1870 to Theophil Hansen's design; it ends with the Blue Danube and the Radetzky March."
    remark: "It scandalised Europe because the partners held each other, and the Congress of Vienna danced it into respectability; the Viennese play the second beat a shade early, which is why their waltzes cannot be counted evenly."
    gaffe: "Counting a Viennese waltz in a strict one-two-three, or calling anything in triple time a waltz. The minuet and the Ländler are in three as well, and neither is a waltz."
    distractors:
      term:
        - "A stately court dance in triple time, danced by couples in a line, that closes the Baroque suite."
        - "An Austrian country dance in duple time, played by brass bands at village fairs."
        - "A Bohemian dance in quick duple time that swept Vienna in the 1840s."
    links: [music.strauss-ii.an-der-schoenen-blauen-donau, music.strauss-i.radetzky-marsch, opera.strauss-ii.die-fledermaus, history.episode.congress-of-vienna, opera.term.opera-ball]
    tags: [term, dance, waltz, strauss, vienna, new-years-concert]
    sources:
      - "Grove Music Online, 'Waltz'"
      - "Grove Music Online, 'Strauss family'"
      - "Peter Kemp, The Strauss Family: Portrait of a Musical Dynasty (1985)"
