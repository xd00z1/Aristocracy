  - id: music.schubert
    discipline: music
    kind: creator
    title: "Franz Schubert"
    city: vienna
    difficulty: 1
    era: Early Romantic
    year: 1797
    year_end: 1828
    facts:
      - "Born in Himmelpfortgrund, a suburb of Vienna, on 31 January 1797; died in the city on 19 November 1828, aged thirty-one, of what the death record calls Nervenfieber, usually read as typhoid. He asked to be buried near Beethoven, who had died the year before, at Währing; both were moved to the Zentralfriedhof in 1888."
      - "More than six hundred songs, among them Erlkönig, written to Goethe in 1815 when he was eighteen and published six years later as his Op. 1, and the two cycles Die schöne Müllerin and Winterreise."
      - "He gave exactly one public concert of his own music, on 26 March 1828, eight months before he died; the rest was heard at friends' evening parties, the Schubertiaden."
      - "The two movements of the B minor symphony of 1822 were left with Anselm Hüttenbrenner and not performed until 17 December 1865, thirty-seven years after his death."
    remark: "He gave one public concert of his own music, eight months before he died at thirty-one; everything else was heard in friends' drawing rooms, and the Unfinished sat in a drawer until 1865."
    gaffe: "Saying the Unfinished is unfinished because he died. He wrote its two movements in 1822 and lived another six years, long enough to write the Great C major symphony; the manuscript simply stayed with a friend."
    distractors:
      person: [Robert Schumann, Carl Maria von Weber, Felix Mendelssohn]
      creator: [Robert Schumann, Carl Maria von Weber, Felix Mendelssohn]
      era: [Baroque, Late Romantic, Modernist]
    links: [music.term.lied, music.beethoven.symphony-5.i, art.term.biedermeier, music.brahms, history.episode.congress-of-vienna]
    tags: [composer, schubert, lieder, early-romantic, vienna, 1820s]
    sources:
      - "Grove Music Online, 'Schubert, Franz'"
      - "Elizabeth Norman McKay, Franz Schubert: A Biography (1996)"
      - "Christopher H. Gibbs, The Life of Schubert (2000)"
    reviewed_by: null

  - id: music.brahms
    discipline: music
    kind: creator
    title: "Johannes Brahms"
    city: vienna
    difficulty: 2
    era: Late Romantic
    year: 1833
    year_end: 1897
    facts:
      - "Born in Hamburg on 7 May 1833; he came to Vienna in 1862, made it his home, and died there on 3 April 1897. He lies in the Zentralfriedhof a few steps from Beethoven and Schubert."
      - "He spent twenty-one years on his First Symphony, begun in 1855 and finished in 1876; when Hans von Bülow called it Beethoven's Tenth, Brahms is said to have replied that any fool could hear as much."
      - "The Wiegenlied, 'Guten Abend, gut' Nacht', Op. 49 No. 4, was published in 1868 for Bertha Faber on the birth of her second son, with a Ländler she used to sing to him hidden in the piano part."
      - "Musical Vienna divided into Wagnerians and Brahmsians, with the critic Eduard Hanslick leading for Brahms; the essay that finally called him a modernist, Schoenberg's 'Brahms the Progressive', began as a talk for the Brahms centenary in 1933 and was published in its familiar form in 1947."
    remark: "The lullaby everyone knows was a present for Bertha Faber on the birth of her second son, and he hid in the piano part a Ländler she had sung to him years before."
    gaffe: "Calling the Hungarian Dances his own tunes. He published them without opus numbers and called himself the arranger, precisely because most of the melodies were not his, and he was accused of stealing them anyway."
    distractors:
      person: [Anton Bruckner, Robert Schumann, Antonín Dvořák]
      creator: [Anton Bruckner, Robert Schumann, Antonín Dvořák]
      era: [Baroque, Classical, Modernist]
    links: [music.term.lied, music.schubert, music.movement.second-viennese-school, music.strauss-ii.an-der-schoenen-blauen-donau]
    tags: [composer, brahms, vienna, late-romantic, hanslick, 1800s]
    sources:
      - "Grove Music Online, 'Brahms, Johannes'"
      - "Jan Swafford, Johannes Brahms: A Biography (1997)"
      - "Styra Avins, Johannes Brahms: Life and Letters (1997)"
    reviewed_by: null

  - id: music.mahler
    discipline: music
    kind: creator
    title: "Gustav Mahler"
    city: vienna
    difficulty: 2
    era: Late Romantic
    year: 1860
    year_end: 1911
    facts:
      - "Born on 7 July 1860 at Kalischt in Bohemia into a German-speaking Jewish family; he was baptised a Catholic early in 1897 because the post he wanted, the directorship of the Vienna Hofoper, was closed to a Jew. He held it from 1897 to 1907 and died in Vienna on 18 May 1911."
      - "He conducted for a living and composed in the summers: nine numbered symphonies, Das Lied von der Erde, and a Tenth left unfinished."
      - "The Adagietto is the fourth movement of the Fifth Symphony, written in 1901 and 1902 for strings and harp alone; Willem Mengelberg noted in his score that both Mahler and Alma had told him it was a declaration of love to her."
      - "It was played at Robert Kennedy's funeral in 1968 and ran through Visconti's Death in Venice in 1971, which is how most people meet Mahler."
    remark: "He was baptised in 1897 because the directorship of the Court Opera was closed to a Jew, took the job, ran it for ten years, and had to do his composing in the summer holidays."
    gaffe: "Treating the Adagietto as music about death because of the Visconti film. Mengelberg's score says Mahler and Alma both told him it was a love letter to her; the film came seventy years later."
    distractors:
      person: [Richard Strauss, Anton Bruckner, Hugo Wolf]
      creator: [Richard Strauss, Anton Bruckner, Hugo Wolf]
      era: [Baroque, Classical, Renaissance]
    links: [opera.venue.staatsoper, history.episode.vienna-1900, music.movement.second-viennese-school, art.klimt, music.term.lied]
    tags: [composer, mahler, symphony, hofoper, vienna-1900, 1900s]
    sources:
      - "Grove Music Online, 'Mahler, Gustav'"
      - "Henry-Louis de La Grange, Gustav Mahler (4 vols., 1973–2008)"
      - "Jens Malte Fischer, Gustav Mahler (English edition, 2011)"
    reviewed_by: null

