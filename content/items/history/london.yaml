  - id: history.apocrypha.playing-fields-of-eton
    discipline: history
    kind: apocrypha
    title: "\"The Battle of Waterloo was won on the playing fields of Eton\""
    attributed_to: The Duke of Wellington
    verdict: invented
    claim: "Revisiting Eton in old age, the Duke of Wellington said that the Battle of Waterloo had been won on its playing fields."
    truth: "Nothing of the kind is recorded in Wellington's lifetime. The earliest version is in French, in Montalembert's De l'avenir politique de l'Angleterre (1856), four years after the Duke's death: 'C'est ici qu'a été gagnée la bataille de Waterloo', with no playing fields in it. The 'playing fields' form belongs to the 1880s; Sir William Fraser's Words on Wellington (1889) is the version the Oxford Dictionary of Quotations cites."
    city: london
    difficulty: 2
    era: Regency
    year: 1815
    facts:
      - "Wellington was at Eton from 1781 to 1784, was taken away early because the family could not afford it, and was not fond of the place; the cult of organised games at Eton is Victorian, after his time."
      - "The Oxford Dictionary of Quotations traces the words to Montalembert (1856) and the 'playing fields' to the 1880s; no contemporary of the Duke's reports him saying either."
      - "Waterloo was fought on 18 June 1815; Turner exhibited The Field of Waterloo at the Royal Academy in 1818, and Byron had put the battle into Childe Harold in 1816."
    remark: "It is French and posthumous: Montalembert printed 'C'est ici qu'a été gagnée la bataille de Waterloo' in 1856, four years after the Duke died, and the playing fields were added by English writers in the 1880s."
    gaffe: "Quoting it to an Etonian as the Duke's own words. He was taken away from the school early, disliked it, and the cult of games at Eton is Victorian, after his day."
    links: [history.episode.regency, art.turner]
    tags: [england, wellington, waterloo, eton, quotation, 1810s]
    sources:
      - "Oxford Dictionary of Quotations (8th ed., 2014), 'Arthur Wellesley, 1st Duke of Wellington'"
      - "Elizabeth Longford, Wellington: The Years of the Sword (1969)"
      - "Charles de Montalembert, De l'avenir politique de l'Angleterre (1856)"
    reviewed_by: null

  - id: history.apocrypha.raleighs-cloak
    discipline: history
    kind: apocrypha
    title: "Raleigh's cloak in the puddle"
    attributed_to: Sir Walter Raleigh
    verdict: invented
    claim: "Meeting the Queen at a muddy place, the young Walter Raleigh spread his new plush cloak over the puddle so that she could cross dry-shod, and his fortune at court was made."
    truth: "No one who knew Raleigh or Elizabeth mentions it. The story first appears in Thomas Fuller's Worthies of England, published in 1662, some eighty years after the supposed event and forty-four after Raleigh's execution; Fuller is also the earliest source for the couplet scratched on a window pane. Scott's Kenilworth (1821) made it universal."
    city: london
    difficulty: 3
    era: Tudor
    year: 1581
    year_approx: true
    facts:
      - "Raleigh, born about 1554 in Devon, rose at court from about 1581, was knighted in 1585, and was beheaded in Old Palace Yard, Westminster, on 29 October 1618 under a treason sentence passed fifteen years earlier."
      - "Fuller's Worthies of England (1662) is the first place the cloak appears: 'meeting with a plashy place, she seemed to scruple going thereon; presently Raleigh cast and spread his new plush cloak on the ground'."
      - "He spelled his own name Ralegh, and the Oxford Dictionary of National Biography lists him that way."
    remark: "The cloak comes from Fuller's Worthies of 1662, the same book that gives us the couplet scratched on the window, and Fuller was collecting Devon anecdotes eighty years after the fact; Scott's Kenilworth did the rest."
    gaffe: "Telling the cloak story as a fact about Elizabeth's court. The only thing it reliably records is what the 1660s liked to believe about the 1580s."
    links: [history.person.elizabeth-i, history.episode.elizabeth-armada, music.byrd]
    tags: [england, tudor, raleigh, elizabeth, anecdote, 1580s]
    sources:
      - "Thomas Fuller, The History of the Worthies of England (1662), 'Devonshire'"
      - "Oxford Dictionary of National Biography, 'Ralegh, Sir Walter'"
      - "Mark Nicholls and Penry Williams, Sir Walter Raleigh: In Life and Legend (2011)"
    reviewed_by: null
