    links: [history.episode.elizabeth-armada, music.byrd, history.apocrypha.raleighs-cloak, history.person.henry-viii]
    tags: [england, tudor, queen, armada-portrait, portrait, 1500s]
    sources:
      - "Oxford Dictionary of National Biography, 'Elizabeth I'"
