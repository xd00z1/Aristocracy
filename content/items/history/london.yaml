  - id: history.person.henry-viii
    discipline: history
    kind: person
    title: "Henry VIII"
    role: King of England
    city: london
    difficulty: 1
    era: Tudor
    year: 1491
    year_end: 1547
    facts:
      - "Born at Greenwich on 28 June 1491, the second son of Henry VII; his elder brother Arthur died in 1502, and Henry came to the throne in April 1509 aged seventeen, marrying Arthur's widow, Catherine of Aragon, within two months."
      - "Leo X gave him the title Defender of the Faith in October 1521 for a book against Luther; he broke with Rome in 1534 and kept the title, and F.D. is still on the coins."
      - "Holbein painted him in 1537 for the Whitehall mural, which burned in 1698; the small panel in the Thyssen-Bornemisza in Madrid is the only surviving painted portrait of the king generally accepted as Holbein's own work."
      - "'Pastime with Good Company' is his, in the manuscript songbook of about 1518; 'Greensleeves' is not, being first registered in 1580, thirty-three years after his death."
      - "Died at Whitehall on 28 January 1547, leaving three children who reigned in turn: Edward VI, Mary I and Elizabeth I."
    remark: "He got 'Defender of the Faith' from the Pope in 1521 for a book against Luther, broke with the Pope thirteen years later, and kept the title; F.D. is still on the coins."
    gaffe: "Crediting him with Greensleeves. It is first recorded in 1580, thirty-three years after his death; the tune that is actually his is 'Pastime with Good Company'."
    media:
      image:
        commons: "File:Hans Holbein, the Younger, Around 1497-1543 - Portrait of Henry VIII of England - Google Art Project.jpg"
        source: "Hans Holbein the Younger, Portrait of Henry VIII of England (1537), Museo Nacional Thyssen-Bornemisza, Madrid, via Wikimedia Commons (Google Art Project)"
        license: "Public domain (artist died 1543); verify the file's tag when fetching"
    distractors:
      person: [Francis I, Charles V, Henry VII]
      era: [Plantagenet, Stuart, Norman]
    links: [history.episode.henry-viii-break-with-rome, art.holbein.the-ambassadors, history.person.elizabeth-i]
    tags: [england, tudor, king, holbein, portrait, 1500s]
    sources:
      - "Oxford Dictionary of National Biography, 'Henry VIII'"
      - "J. J. Scarisbrick, Henry VIII (Yale English Monarchs, 1968)"
      - "Museo Nacional Thyssen-Bornemisza, Madrid, catalogue entry for Hans Holbein the Younger, Portrait of Henry VIII of England (1537)"
      - "Grove Music Online, 'Henry VIII, King of England'"
    reviewed_by: null

  - id: history.person.elizabeth-i
    discipline: history
    kind: person
    title: "Elizabeth I"
    role: Queen of England
    city: london
    difficulty: 1
    era: Tudor
    year: 1533
    year_end: 1603
    facts:
      - "Born at Greenwich on 7 September 1533, the daughter of Anne Boleyn; declared illegitimate after her mother's execution in 1536, imprisoned in the Tower by her half-sister Mary in 1554, and queen on 17 November 1558."
      - "Never married, though the suitors included Robert Dudley, Earl of Leicester, and a French prince more than twenty years her junior; the childlessness made the succession the running anxiety of the reign."
      - "The Armada Portrait of about 1588 exists in three versions, at Woburn Abbey, the National Portrait Gallery and Greenwich; the painter is unknown, the old attribution to George Gower having been dropped."
      - "Her hand rests on a globe over the Americas; the fleet sails in one window and wrecks in the other, and a mermaid is carved on the chair. Royal Museums Greenwich bought its version in 2016 for an agreed £10 million from the Tyrwhitt-Drake family, after a public appeal that raised £10.3 million."
      - "In 1575 she granted Tallis and Byrd the monopoly on printing music in England, and kept Byrd, a Catholic, on the books of her Chapel Royal for the rest of her reign."
    remark: "The Armada Portrait is propaganda with a globe in it: her hand rests on the Americas, the Spanish fleet burns in one window and wrecks in the other, and there are three versions because it was made to be copied."
    gaffe: "Calling it 'the Gower'. The attribution to George Gower was dropped long ago; the painter is unknown, and the version Greenwich bought in 2016 had come down in Drake's family."
    media:
      image:
        commons: "File:Elizabeth I (Armada Portrait).jpg"
        source: "Unknown English artist, the Armada Portrait of Elizabeth I (c. 1588), Woburn Abbey version, via Wikimedia Commons"
        license: "Public domain (anonymous sixteenth-century work); verify the file's tag when fetching"
    distractors:
