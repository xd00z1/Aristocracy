  - id: history.person.elisabeth
    discipline: history
    kind: person
    title: "Empress Elisabeth (Sisi)"
    role: Empress of Austria, Queen of Hungary
    city: vienna
    difficulty: 1
    era: Ringstrasse era
    year: 1837
    year_end: 1898
    facts:
      - "Born in Munich on Christmas Eve 1837, a daughter of Duke Max in Bavaria; married her cousin Franz Joseph at sixteen on 24 April 1854, having gone to Bad Ischl in August 1853 only to accompany her mother and her elder sister Helene, the intended bride."
      - "Winterhalter painted her in 1865 in white tulle with diamond stars in her hair; the stars were real, made by the court jeweller Köchert, and the portrait hangs in the Hofburg. She refused to be photographed after her early thirties, so it is the face the world kept."
      - "She kept a waist of about fifty centimetres with riding, walking and a set of gymnastic rings in her apartments; her hair took hours a day; she learned Hungarian, championed the Compromise of 1867, was crowned Queen of Hungary that June and was given Gödöllő as a coronation present."
      - "She read Heine, wrote verse, built the Achilleion on Corfu about 1890 and then tired of it; after Mayerling she wore black and travelled almost without pause."
      - "On 10 September 1898, walking to a lake steamer on the quay at Geneva, she was stabbed through the heart with a sharpened file by the anarchist Luigi Lucheni and died within the hour. The 1950s films with Romy Schneider spell her 'Sissi'; the family spelling is Sisi."
    remark: "The diamond stars in the Winterhalter portrait were real, made by Köchert, and the waist underneath was about fifty centimetres; she stopped allowing photographs in her early thirties, so the 1865 picture is the face the world kept."
    gaffe: "Spelling her Sissi. That is the Romy Schneider films of the 1950s; the family spelling is Sisi, and she was Bavarian, not Austrian, a duchess in Bavaria married to her cousin at sixteen."
    media:
      image:
        commons: "File:Winterhalter Elisabeth 2.jpg"
        source: "Franz Xaver Winterhalter, Empress Elisabeth of Austria in Courtly Gala Dress with Diamond Stars (1865), Hofburg, Vienna, via Wikimedia Commons"
