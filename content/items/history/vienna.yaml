  - id: history.apocrypha.mozart-proposes-to-marie-antoinette
    discipline: history
    kind: apocrypha
    title: "The child Mozart proposes to Marie Antoinette"
    attributed_to: Wolfgang Amadeus Mozart
    verdict: embellished
    claim: "At Schönbrunn in 1762 the six-year-old Mozart slipped on the polished floor, was picked up by the little Archduchess Maria Antonia, and announced that he would marry her when he grew up."
    truth: "The visit happened: Leopold Mozart's letter of 16 October 1762 describes Wolfgang playing at Schönbrunn on 13 October, jumping into the Empress's lap and kissing her. The slip on the floor and the proposal are not in the letter, the only contemporary account, and appear only in later biography; they cannot be verified."
    city: vienna
    difficulty: 1
    era: Enlightenment
    year: 1762
    facts:
      - "The Mozarts, on their first tour, were received by Maria Theresa at Schönbrunn on 13 October 1762; Leopold's letter home of 16 October reports the Empress's kindness and the boy jumping into her lap, and says nothing of a proposal."
      - "Maria Antonia, the future Marie Antoinette, was born on 2 November 1755 and was six that October, as was Mozart, born on 27 January 1756; she left for France and the Dauphin in 1770."
      - "Gluck's Orfeo ed Euridice had opened at the Burgtheater on 5 October 1762, the week before the Mozarts arrived."
    remark: "What Leopold actually wrote home in October 1762 was that Wolferl jumped into the Empress's lap and kissed her; the slip on the floor and the proposal to the future Marie Antoinette came later, when both children were famous for other reasons."
    gaffe: "Telling it as Mozart proposing to the Queen of France. In 1762 she was Maria Antonia, the Empress's fifteenth child, aged six, and the French marriage was eight years off; and the proposal is not in the one letter that describes the day."
    links: [history.person.maria-theresa, history.person.marie-antoinette, history.apocrypha.let-them-eat-cake, opera.gluck.orfeo-ed-euridice, opera.mozart.le-nozze-di-figaro]
    tags: [vienna, mozart, marie-antoinette, schoenbrunn, anecdote, 1760s]
    sources:
      - "Emily Anderson (ed.), The Letters of Mozart and His Family (3rd ed., 1985), Leopold Mozart to Lorenz Hagenauer, 16 October 1762"
      - "Otto Erich Deutsch, Mozart: A Documentary Biography (1965)"
      - "Maynard Solomon, Mozart: A Life (1995)"
    reviewed_by: null

  - id: history.apocrypha.salieri-poisoned-mozart
    discipline: history
    kind: apocrypha
    title: "Salieri poisoned Mozart"
    attributed_to: Antonio Salieri
    verdict: invented
    claim: "Antonio Salieri, the court Kapellmeister, poisoned Mozart out of jealousy and confessed to it on his deathbed."
    truth: "Mozart died on 5 December 1791 after about two weeks of illness; the death register gives 'hitziges Frieselfieber', an acute fever with a rash. A Berlin paper printed the poisoning rumour within the month, with no evidence. In 1823, old and in mental decline, Salieri was said to have accused himself; he denied it to Moscheles on his word of honour, and the rumour survives mostly in Beethoven's conversation books. Pushkin's play Mozart and Salieri (1830), Rimsky-Korsakov's opera (1898) and Shaffer's Amadeus (1979) made the story permanent."
    city: vienna
    difficulty: 2
    era: Classical
    year: 1791
    facts:
      - "Seven weeks before he died Mozart took Salieri to Die Zauberflöte, and wrote to Constanze on 14 October 1791 that Salieri had called out bravo at every number."
      - "Salieri taught Beethoven, Schubert, Liszt and Mozart's own younger son Franz Xaver; he was Kapellmeister to the imperial court from 1788 until 1824 and died on 7 May 1825."
      - "Peter Shaffer's Amadeus opened at the National Theatre in London in 1979, and Milos Forman's film of 1984 won eight Academy Awards; Pushkin's little tragedy of 1830 had already put the poison in Salieri's hand."
    remark: "Salieri taught Beethoven, Schubert, Liszt and Mozart's own younger son, which is not what you do with the family of a man you have murdered; the poison is Pushkin's, from 1830, and Shaffer's, from 1979."
    gaffe: "Taking Amadeus for biography. The register says fever, the poisoning story was gossip within a month, and Salieri's supposed confession is a rumour from his dementia in 1823, denied by him and preserved second-hand in Beethoven's conversation books."
    links: [opera.mozart.die-zauberfloete, opera.mozart.le-nozze-di-figaro, opera.da-ponte, history.episode.joseph-ii-and-mozart, music.beethoven.symphony-5.i]
    tags: [vienna, mozart, salieri, myth, amadeus, 1790s]
    sources:
      - "Grove Music Online, 'Salieri, Antonio'"
      - "H. C. Robbins Landon, 1791: Mozart's Last Year (1988)"
      - "Otto Erich Deutsch, Mozart: A Documentary Biography (1965)"
      - "Emily Anderson (ed.), The Letters of Mozart and His Family (3rd ed., 1985), Mozart to Constanze, 14 October 1791"
