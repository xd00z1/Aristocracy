  - id: history.person.maria-theresa
    discipline: history
    kind: person
    title: "Maria Theresa"
    role: Archduchess of Austria, Queen of Hungary and Bohemia
    city: vienna
    difficulty: 1
    era: Enlightenment
    year: 1717
    year_end: 1780
    facts:
      - "Born in Vienna on 13 May 1717, the eldest surviving child of Charles VI, who spent his reign getting Europe to accept that a daughter could inherit; she succeeded on 20 October 1740, and Frederick the Great invaded Silesia within two months."
      - "She was never Holy Roman Empress in her own right: the title came from her husband, Francis Stephen of Lorraine, elected Emperor in 1745, and what she held was Hungary, Bohemia and the Austrian lands. She fought Frederick twice for Silesia, in the War of the Austrian Succession and the Seven Years' War, and lost it both times."
      - "In September 1741 the Hungarian Diet at Pressburg voted her their 'life and blood'; the prints that show her holding up the infant Joseph while they cheer conflate two sittings. Sixteen children, among them Joseph II, Leopold II and Maria Antonia, who became Marie Antoinette."
      - "She had Pacassi rebuild Schönbrunn from 1743 as the summer palace; there, on 13 October 1762, the six-year-old Mozart played to her, and by Leopold Mozart's letter home jumped into her lap and kissed her. Gluck's Orfeo had opened at the Burgtheater eight days earlier."
      - "Martin van Meytens, her court painter, made the standard portraits; the Theresianum (1746), compulsory schooling (1774) and the alliance with France that sent her daughter to Versailles are hers. She died on 29 November 1780."
    remark: "She was never empress in her own right; the title came from her husband's election in 1745, and what she actually held was Hungary, Bohemia and the Austrian lands, which she kept by fighting Frederick the Great twice over Silesia and losing it both times."
    gaffe: "Calling her Holy Roman Empress as though she had been elected, or muddling the Hofburg with Schönbrunn. Schönbrunn is the summer palace she had Pacassi rebuild, where the six-year-old Mozart played in October 1762."
    media:
      image:
        commons: "File:Kaiserin Maria Theresia (HRR).jpg"
        source: "Martin van Meytens, Empress Maria Theresa (c. 1759), Akademie der bildenden Künste, Vienna, via Wikimedia Commons"
        license: "Public domain (artist died 1770); verify the file's tag when fetching"
    distractors:
      person: [Catherine the Great, Elizabeth of Russia, Maria Carolina of Naples]
      era: [Baroque, Restoration, Ringstrasse era]
    links: [history.episode.joseph-ii-and-mozart, history.apocrypha.mozart-proposes-to-marie-antoinette, opera.gluck.orfeo-ed-euridice, opera.r-strauss.der-rosenkavalier, history.person.marie-antoinette]
    tags: [vienna, habsburg, empress, schoenbrunn, meytens, portrait, 1700s]
    sources:
      - "Edward Crankshaw, Maria Theresa (1969)"
      - "Barbara Stollberg-Rilinger, Maria Theresia: Die Kaiserin in ihrer Zeit (2017)"
      - "Otto Erich Deutsch, Mozart: A Documentary Biography (1965), Leopold Mozart's letter of 16 October 1762"
    reviewed_by: null

  - id: history.person.metternich
    discipline: history
    kind: person
    title: "Metternich"
    role: Austrian Foreign Minister and State Chancellor
    city: vienna
    difficulty: 3
    era: Restoration
    year: 1773
    year_end: 1859
    facts:
      - "Klemens von Metternich was born at Koblenz on 15 May 1773, a Rhinelander whose family lost its lands to the French Revolution; he was Austrian ambassador in Paris from 1806 to 1809, foreign minister from October 1809, and arranged Napoleon's marriage to the Emperor's daughter Marie Louise in 1810."
      - "He hosted the Congress of Vienna, and Francis I paid him in 1816 with Schloss Johannisberg on the Rhine, which is why a sparkling wine still carries the name Fürst von Metternich; he was made State Chancellor in 1821."
      - "The Carlsbad Decrees of 1819 put the universities and the press under police watch across the German Confederation; the 'Metternich system' is the name for the censorship and congress diplomacy of the thirty years after 1815. 'Italy is a geographical expression' is his, from 1847."
      - "Thomas Lawrence painted him for the Prince Regent's Waterloo Chamber at Windsor, among the sovereigns and ministers who had beaten Napoleon."
      - "He resigned on 13 March 1848, the day the barricades went up, fled to England, came back to Vienna in 1851 and died there on 11 June 1859."
    remark: "He held the job for thirty-nine years, from 1809 to the afternoon of 13 March 1848, and the Emperor paid him for the Congress with Schloss Johannisberg on the Rhine, which is why his name is on a bottle of Sekt."
    gaffe: "Saying he was Prussian, or that he fell at the Congress. He was a Rhinelander in Austrian service who ran the Congress and lasted another thirty-three years; it was the barricades of March 1848 that put him on the road to England."
    media:
      image:
        commons: "File:Prince Metternich by Lawrence.jpeg"
        source: "Sir Thomas Lawrence, Prince Metternich (1814–15), Royal Collection, Waterloo Chamber, Windsor Castle, via Wikimedia Commons"
        license: "Public domain (artist died 1830); verify the file's tag when fetching"
    distractors:
      person: [Talleyrand, Castlereagh, Hardenberg]
      era: [Baroque, Fin de siècle, Enlightenment]
    links: [history.episode.congress-of-vienna, history.episode.1848-and-franz-joseph, art.term.biedermeier, opera.beethoven.fidelio]
    tags: [vienna, habsburg, diplomat, congress, restoration, lawrence, portrait, 1800s]
    sources:
