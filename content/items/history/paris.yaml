  - id: history.person.napoleon
    discipline: history
    kind: person
    title: "Napoleon Bonaparte"
    role: Emperor of the French
    city: paris
    difficulty: 1
    era: Empire
    year: 1769
    year_end: 1821
    facts:
      - "Born at Ajaccio on 15 August 1769, the year after Genoa ceded Corsica to France, so that he was French by a diplomatic accident; he was trained as an artillery officer at Brienne and Paris and spoke French with a Corsican accent all his life."
      - "He made his name at Toulon in 1793 and in Italy in 1796, took power in the coup of 18 Brumaire in November 1799 as First Consul, was made consul for life in 1802 and Emperor of the French in 1804. The Code civil, promulgated that March, is the part of him still in force across half of Europe."
      - "He married Joséphine de Beauharnais in 1796, divorced her in 1810 for want of an heir and married the Austrian emperor's daughter Marie Louise; Austerlitz was 2 December 1805, the retreat from Moscow 1812, the abdication and Elba 1814, Waterloo 18 June 1815, and St Helena until his death on 5 May 1821."
      - "The shortness is a mistake in units. The autopsy gave five feet two inches in French measure, and the French inch was longer than the English one, which puts him near one metre sixty-nine, about five foot six, a shade above his own infantry."
      - "David painted the crossing of the Alps and the Coronation; Ingres put him on the imperial throne in 1806, posed like a medieval God the Father; and Beethoven, by his pupil Ries's account, tore up the Eroica's dedication when he heard that Bonaparte had made himself emperor."
    remark: "The famous shortness is an arithmetic error: the autopsy gave five foot two in French measure, whose inches were longer than English ones, which makes him about five foot six and slightly taller than his own infantry."
    gaffe: "Calling him Emperor of France. The title was Emperor of the French, chosen to rest on a people rather than a territory, and it dates from 1804; in 1799 he was First Consul."
    media:
      image:
        commons: "File:Ingres, Napoleon on his Imperial throne.jpg"
        source: "Jean-Auguste-Dominique Ingres, Napoléon Ier sur le trône impérial (1806), Musée de l'Armée, Paris, via Wikimedia Commons"
        license: "Public domain (artist died 1867); verify the file's tag when fetching"
    distractors:
      person: [Talleyrand, Joseph Bonaparte, Marshal Murat]
      era: [Revolution, Restoration, Ancien Régime]
    links: [art.david.oath-of-the-horatii, music.beethoven.symphony-5.i, history.episode.napoleon-egypt-coronation-louvre, history.episode.congress-of-vienna, history.apocrypha.playing-fields-of-eton]
    tags: [france, napoleon, empire, corsica, ingres, portrait, 1800s]
    sources:
      - "Philip Dwyer, Napoleon: The Path to Power (2007) and Citizen Emperor: Napoleon in Power (2013)"
      - "Musée de l'Armée, Paris, catalogue entry for Ingres, Napoléon Ier sur le trône impérial"
      - "Ferdinand Ries and Franz Wegeler, Biographische Notizen über Ludwig van Beethoven (1838)"
    reviewed_by: null

  - id: history.person.voltaire
    discipline: history
    kind: person
    title: "Voltaire"
    role: Writer and philosophe
    city: paris
    difficulty: 1
    era: Enlightenment
    year: 1694
    year_end: 1778
    facts:
      - "Born François-Marie Arouet in Paris on 21 November 1694; he took the name Voltaire in 1718, after eleven months in the Bastille for verses about the Regent, and kept it for sixty years."
      - "The Chevalier de Rohan had him beaten by his footmen in 1726 and Voltaire went to the Bastille and then to England for two years; the Lettres philosophiques of 1734, which praised English toleration and Newton at France's expense, were burned by the Paris hangman."
      - "He spent fifteen years with Émilie du Châtelet, much of it at her husband's château at Cirey, and she translated Newton's Principia into French; then three years at Potsdam with Frederick the Great, until they quarrelled. From 1759 he lived at Ferney, on the frontier with Geneva."
      - "Candide appeared in 1759. The Calas case made him a campaigner: a Toulouse Protestant broken on the wheel in 1762 for a murder he had not committed, whose conviction Voltaire had quashed in 1765, and out of which came the Treatise on Toleration."
      - "He wrote for the opera as well as the stage: two court entertainments with Rameau in 1745, and a Samson the censors would not pass. He came back to Paris in February 1778 after twenty-eight years away, was crowned in his box at the Comédie-Française on 30 March at a performance of his Irène, and died on 30 May; the Revolution moved him to the Panthéon in July 1791."
    remark: "He settled at Ferney in 1759 because it sat on the Genevan frontier: the great campaigner against censorship arranged his life so that he could be out of French jurisdiction within the hour."
    gaffe: "Quoting 'I disapprove of what you say, but I will defend to the death your right to say it' as Voltaire. His English biographer Evelyn Beatrice Hall wrote it in 1906, and said afterwards that she was summarising his attitude, not quoting him."
    media:
