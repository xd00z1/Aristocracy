  - id: history.apocrypha.letat-cest-moi
    discipline: history
    kind: apocrypha
    title: "\"L'état, c'est moi\""
    attributed_to: Louis XIV
    verdict: invented
    claim: "Told by the Parlement of Paris that his edicts must serve the interests of the state, the young Louis XIV replied: the state, it is me."
    truth: "The words are in no contemporary source, and not in the registers of the Parlement for the session of 13 April 1655 at which the story places them. They appear in print only in the nineteenth century, in Lémontey in 1818 and in Dulaure's history of Paris in 1834. What a contemporary did write down, the marquis de Dangeau in his journal, is nearly the opposite: at the deathbed in 1715 the king said that he was going but that the state would remain."
    city: paris
    difficulty: 1
    era: Ancien Régime
    year: 1655
    facts:
      - "The scene is set at the session of 13 April 1655, at which the sixteen-year-old king did appear before the Parlement of Paris; the words are not in its registers, and no memoir of the reign has them."
      - "They surface long after his death, in Lémontey's essay on the monarchy of Louis XIV in 1818 and in Dulaure's history of Paris in 1834, when French writers were arguing about absolutism rather than reporting it."
      - "Dangeau, who was at Versailles for the death in August 1715, has the king saying that he was going but that the state would remain always; the accounts of the deathbed also have him telling his five-year-old heir not to copy his taste for building or for war."
    remark: "The one line everybody has from him is not his: it reaches print more than a century after his death, and what a courtier actually wrote down at the deathbed was that he was going but the state would remain."
    gaffe: "Producing it as a quotation. It is not in the registers of the Parlement, not in the memoirs and not in print before the nineteenth century, and anyone who has read a life of Louis XIV will hear it coming."
    links: [history.episode.louis-xiv-versailles, opera.lully, art.term.salon, history.apocrypha.let-them-eat-cake]
    tags: [france, bourbon, versailles, quotation, absolutism]
    sources:
      - "Journal du marquis de Dangeau, entries of August 1715"
      - "Peter Burke, The Fabrication of Louis XIV (1992)"
      - "Jean-Christian Petitfils, Louis XIV (1995)"
      - "Pierre-Édouard Lémontey, Essai sur l'établissement monarchique de Louis XIV (1818)"
    reviewed_by: null
