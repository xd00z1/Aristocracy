  - id: history.person.diaghilev
    discipline: history
    kind: person
    title: "Sergei Diaghilev"
    role: Impresario of the Ballets Russes
    city: paris
    difficulty: 3
    era: Belle Époque
    year: 1872
    year_end: 1929
    facts:
      - "Born in Novgorod province on 31 March 1872 and trained in law at St Petersburg; he took his compositions to Rimsky-Korsakov, was told he had no gift for it, and became instead the editor of the magazine Mir iskusstva, the World of Art, from 1898 to 1904."
      - "He brought Russian painting to the Salon d'Automne in 1906, Russian concerts to Paris in 1907 and Chaliapin in Boris Godunov in 1908; the first Saison Russe of ballet opened at the Théâtre du Châtelet on 19 May 1909 and made Nijinsky and Karsavina famous in a fortnight."
      - "He commissioned rather than created: Stravinsky's Firebird in 1910, Petrushka in 1911 and the Rite of Spring in 1913, Ravel's Daphnis et Chloé in 1912, Debussy's Jeux in 1913, Satie's Parade in 1917 with Picasso's designs and Cocteau's scenario, then Poulenc, Milhaud and Prokofiev in the 1920s."
      - "Nijinsky's Afternoon of a Faun, danced to Debussy's music on 29 May 1912, was attacked the next morning on the front page of Le Figaro for its closing gesture; Rodin defended it in print and the paper turned on Rodin."
      - "The company was Russian and never danced in Russia. Diaghilev died in Venice on 19 August 1929, in debt, and is buried on the cemetery island of San Michele."
    remark: "He never choreographed a step or wrote a bar: Rimsky-Korsakov told him he had no gift for composition, so he spent thirty years commissioning it from Stravinsky, Ravel, Debussy, Satie and Prokofiev instead."
    gaffe: "Telling the Rite of Spring riot as though there had been arrests. There was a loud and ugly disturbance on 29 May 1913, the ballet was danced to the end, and the fights grew in the retelling; the scandal with a paper trail is Nijinsky's Faune the year before."
