  - id: history.person.cosimo-de-medici
    discipline: history
    kind: person
    title: "Cosimo de' Medici"
    role: "Banker and de facto ruler of Florence"
    city: florence
    difficulty: 2
    era: Early Renaissance
    year: 1389
    year_end: 1464
    facts:
      - "Born in 1389, son of Giovanni di Bicci, who founded the Medici bank in 1397; exiled to Venice by the Albizzi faction in 1433 and recalled in 1434, after which he led Florence for thirty years without any office that said so."
      - "He paid for Michelozzo's rebuilding of San Marco from 1437, where Fra Angelico frescoed the cells, and installed Niccolò Niccoli's books there in 1444 as the first public library in Florence; his own palace on the Via Larga, also by Michelozzo, was begun in 1444."
      - "He brought the church council to Florence in 1439, and in the early 1460s gave Marsilio Ficino a villa at Careggi and Greek manuscripts to translate; Ficino's Latin Plato was printed in 1484."
      - "He died at Careggi on 1 August 1464 and is buried in San Lorenzo; the commune's decree gave him the title Pater Patriae, which is cut on the tomb. Pontormo's portrait, painted about 1518, is posthumous."
    remark: "He never held an office he did not have to, was exiled in 1433, came back in 1434 and ran the city for thirty years from a bank; the Signoria had Pater Patriae cut on his tomb in San Lorenzo, which had been Cicero's title."
    gaffe: "Confusing him with Cosimo I, the first Grand Duke. Cosimo il Vecchio was a banker who died in 1464 and never held a title; Cosimo I was a soldier's son who took a ducal crown a century later and built the Uffizi."
    media:
      image:
        commons: "File:Pontormo - Ritratto di Cosimo il Vecchio - Google Art Project.jpg"
        source: "Jacopo Pontormo, Portrait of Cosimo il Vecchio (c. 1518–1520), Uffizi, Florence, via Wikimedia Commons"
        license: "Public domain (artist died 1557); verify the file's tag when fetching"
    distractors:
      person: [Cosimo I de' Medici, Giovanni di Bicci de' Medici, Palla Strozzi]
    links: [history.episode.council-of-florence, history.person.lorenzo-the-magnificent, art.fra-angelico.annunciation-san-marco, art.donatello.david, art.brunelleschi]
    tags: [florence, medici, banker, patron, san-marco, 1400s]
    sources:
      - "Dale Kent, Cosimo de' Medici and the Florentine Renaissance (2000)"
      - "Vespasiano da Bisticci, Lives of Illustrious Men of the XVth Century, 'Cosimo de' Medici'"
      - "Grove Art Online, 'Medici'"
    reviewed_by: null

  - id: history.person.lorenzo-the-magnificent
    discipline: history
    kind: person
    title: "Lorenzo the Magnificent"
    role: "De facto ruler of Florence, poet and patron"
    city: florence
    difficulty: 1
    era: Early Renaissance
    year: 1449
    year_end: 1492
    facts:
      - "Born 1 January 1449, grandson of Cosimo il Vecchio; took over the family's leadership of Florence at twenty when his father Piero died in December 1469. Donatello's bronze David stood in the courtyard of the Medici palace at his wedding to Clarice Orsini that year."
      - "Survived the Pazzi attack in the cathedral in April 1478, in which his brother Giuliano was killed; in December 1479 he sailed to Naples and negotiated peace with King Ferrante in person."
      - "Kept Poliziano, Ficino and Pico della Mirandola around him, took the teenage Michelangelo into his household around 1490, and had his own name, LAV.R.MED, cut into the antique gems and vases he collected; his own poems include the Canzona di Bacco."
      - "Died at Careggi on 8 April 1492, aged forty-three; Savonarola came to the deathbed, and what passed between them is told differently by Poliziano and by the friar's followers. His son Giovanni, a cardinal at thirteen, became Leo X; Piero, his heir, was driven out of Florence in November 1494."
    remark: "His own carnival song says it: how fine is youth, which flees all the same, so let whoever wants to be happy be so, for there is no certainty of tomorrow. He died at forty-three in 1492, and his son was driven out of Florence two and a half years later."
    gaffe: "Crediting him with Botticelli's Venus and Primavera. So far as the documents go both belonged to his cousin Lorenzo di Pierfrancesco's branch; the Magnificent's own money went on manuscripts, gems and villas."
    media:
      image:
        commons: "File:Lorenzo de' Medici-ritratto.jpg"
        source: "Giorgio Vasari, Portrait of Lorenzo the Magnificent (c. 1533–1534, posthumous), Uffizi, Florence, via Wikimedia Commons"
        license: "Public domain (artist died 1574); verify the file's tag when fetching"
    distractors:
      person: [Giuliano de' Medici, Piero di Cosimo de' Medici, Lorenzo di Pierfrancesco de' Medici]
    links: [history.episode.pazzi-conspiracy, history.person.cosimo-de-medici, history.episode.medici-popes, history.episode.bonfire-of-the-vanities, art.botticelli.primavera, art.botticelli.birth-of-venus, art.donatello.david, art.michelangelo.david]
    tags: [florence, medici, patron, poet, 1400s]
    sources:
      - "Lorenzo de' Medici, Canzona di Bacco (Trionfo di Bacco e Arianna)"
      - "Miles J. Unger, Magnifico: The Brilliant Life and Violent Times of Lorenzo de' Medici (2008)"
      - "Grove Art Online, 'Medici'"
      - "Ronald Lightbown, Sandro Botticelli: Life and Work (1989)"
    reviewed_by: null

  - id: history.person.machiavelli
    discipline: history
    kind: person
    title: "Niccolò Machiavelli"
    role: "Second Chancellor of the Florentine republic, political writer"
    city: florence
    difficulty: 2
    era: High Renaissance
    year: 1469
    year_end: 1527
    facts:
      - "Born in Florence on 3 May 1469; from 1498 to 1512 he was Second Chancellor of the republic and secretary to the Ten of War, and rode on missions to Cesare Borgia, Louis XII, the Emperor Maximilian and Julius II."
      - "He argued for a citizen militia instead of mercenaries and raised one in 1506; it helped retake Pisa in 1509 and broke at Prato in 1512, after which the Medici returned and he lost his post."
      - "Besides The Prince he wrote the Discourses on Livy, the comedy La Mandragola, The Art of War, the only one of his political works printed in his lifetime, and the Florentine Histories, commissioned by Cardinal Giulio de' Medici; he died on 21 June 1527, weeks after the Medici had been expelled again."
      - "He is buried in Santa Croce, where the monument of 1787 reads 'Tanto nomini nullum par elogium', no praise is equal to such a name. The portrait by Santi di Tito in the Palazzo Vecchio was painted decades after his death; none from life is known."
    remark: "He spent fourteen years as a civil servant of the republic, riding to Cesare Borgia and the French court on Florence's business, and everything he is famous for he wrote after being sacked; his tomb in Santa Croce says no epitaph could equal his name."
    gaffe: "Using 'Machiavellian' for anyone cunning and assuming the man was a courtier. He was a republican official whom the Medici tortured; The Prince was a bid for employment, and the Discourses on Livy are the longer book."
