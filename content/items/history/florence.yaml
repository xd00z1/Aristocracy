  - id: history.apocrypha.eppur-si-muove
    discipline: history
    kind: apocrypha
    title: "\"Eppur si muove\""
    attributed_to: Galileo Galilei
    verdict: invented
    claim: "Rising from his knees after abjuring Copernicanism before the Inquisition in June 1633, Galileo muttered 'Eppur si muove', and yet it moves."
    truth: "No contemporary source has it: not the trial record, not Galileo's letters, not the accounts of his friends. The line first appears in print in 1757, in Giuseppe Baretti's The Italian Library, published in London a hundred and twenty-four years after the trial. A painting that surfaced in 1911, once claimed to date from the 1640s, shows the words scratched on a cell wall; that early date has never been established and is widely doubted."
    city: florence
    difficulty: 1
    era: Baroque
    year: 1633
    facts:
      - "Giuseppe Baretti, an Italian man of letters living in London and a friend of Samuel Johnson, printed the anecdote in The Italian Library in 1757; nothing earlier is known."
      - "The sentence of 22 June 1633 and Galileo's written abjuration survive in the Vatican archives; neither records any remark, and Galileo had just been examined under formal threat of torture."
      - "The story attaches to a real fact: Galileo went on believing the earth moved, and said so privately, while serving his sentence at Arcetri."
    remark: "The line turns up first in 1757, in a book Giuseppe Baretti published in London, and Baretti was Johnson's friend, not Galileo's; nobody in 1633 heard it, and a man just threatened with torture is unlikely to have said it aloud."
    gaffe: "Quoting it as Galileo's parting shot to the Inquisition. It is in no trial record and no letter; say it with a smile and date it to the eighteenth century."
    links: [history.episode.galileo-trial, music.movement.florentine-camerata, opera.movement.florentine-camerata]
    tags: [florence, galileo, quotation, inquisition, 1630s]
    sources:
      - "Giuseppe Baretti, The Italian Library (London, 1757)"
      - "Stillman Drake, Galileo at Work: His Scientific Biography (1978)"
      - "Maurice A. Finocchiaro, Retrying Galileo, 1633–1992 (2005)"
    reviewed_by: null
