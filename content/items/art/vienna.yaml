    distractors:
      creator: [Hieronymus Bosch, Lucas van Valckenborch, Joos de Momper]
      title: ["The Procession to Calvary", "The Fight Between Carnival and Lent", "Children's Games"]
      era: [Dutch Golden Age, Early Netherlandish, Flemish Baroque]
    links: [art.bruegel.hunters-in-the-snow, art.venue.kunsthistorisches-museum]
    tags: [painting, bruegel, flemish, kunsthistorisches-museum, 1500s]
    sources:
