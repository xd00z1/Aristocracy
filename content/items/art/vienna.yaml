# Vienna, art. The Habsburg picture gallery (Bruegel, Vermeer) and the
# Secession generation (Klimt, Schiele), with the terms a visitor needs.
# Commons titles are best candidates; scripts/fetch-media.mjs reports misses.
items:
  - id: art.klimt.the-kiss
    discipline: art
    kind: work
    title: "The Kiss"
    creator: Gustav Klimt
    city: vienna
    difficulty: 1
    era: Vienna Secession
    year: 1908
    year_approx: true
    facts:
      - "Oil and gold leaf on a square canvas, 180 centimetres each way, painted in 1907 and 1908 during what is called his golden period."
      - "Shown, still unfinished, at the Kunstschau of 1908 in Vienna, where the Austrian state bought it for the Modern Gallery; it hangs in the Upper Belvedere."
      - "Klimt's father was a gold engraver, and the gold is leaf, not paint."
    remark: "The state bought it off the wall of the 1908 Kunstschau before Klimt had quite finished it, and the gold is leaf rather than paint; his father was a gold engraver."
    gaffe: "Asking to see it at the Secession. It hangs in the Upper Belvedere; the Secession has the Beethoven Frieze, and the two buildings are a tram ride apart."
    media:
      image:
        commons: "File:The Kiss - Gustav Klimt - Google Cultural Institute.jpg"
        source: "Österreichische Galerie Belvedere, Vienna, via Wikimedia Commons (Google Cultural Institute scan)"
        license: "Public domain (artist died 1918); verify the file's tag when fetching"
        focus: { x: 0.56, y: 0.28 }
    distractors:
      creator: [Egon Schiele, Koloman Moser, Oskar Kokoschka]
      title: ["Judith I", "Death and Life", "The Tree of Life"]
      era: [Expressionism, Biedermeier, Impressionism]
    links: [art.klimt, art.klimt.adele-bloch-bauer-i, art.movement.vienna-secession]
    tags: [painting, klimt, secession, golden-period, belvedere, 1900s]
    sources:
      - "Belvedere, Vienna, collection entry 'The Kiss (Lovers)'"
      - "Tobias G. Natter (ed.), Gustav Klimt: The Complete Paintings (2012)"
    reviewed_by: null

  - id: art.klimt.adele-bloch-bauer-i
    discipline: art
    kind: work
    title: "Portrait of Adele Bloch-Bauer I"
    creator: Gustav Klimt
    city: vienna
    difficulty: 2
    era: Vienna Secession
    year: 1907
    facts:
      - "Oil, silver and gold on canvas, completed in 1907 after studies going back to 1903, the year Klimt saw the Byzantine mosaics at Ravenna."
      - "Seized after the Anschluss and shown for decades in the Belvedere as 'Woman in Gold', a title that kept the Jewish sitter's name off the label; an Austrian arbitration panel restituted it to her niece Maria Altmann in 2006."
      - "Ronald Lauder bought it that year for the Neue Galerie in New York for a reported 135 million dollars."
    remark: "It has not been in Vienna since 2006; the Belvedere hung it for decades as 'Woman in Gold', which conveniently kept the name Bloch-Bauer off the label, and it now lives on Fifth Avenue at the Neue Galerie."
    gaffe: "Looking for it at the Belvedere, or calling the sitter 'the woman in gold' as though nobody knew who she was; she was Adele Bloch-Bauer, wife of a sugar industrialist, and Klimt painted her twice."
    media:
      image:
        commons: "File:Gustav Klimt 046.jpg"
        source: "Neue Galerie New York, via Wikimedia Commons (Yorck Project scan)"
        license: "Public domain (artist died 1918); verify the file's tag when fetching"
        focus: { x: 0.48, y: 0.2 }
    distractors:
      creator: [Egon Schiele, Koloman Moser, Carl Moll]
      title: ["Portrait of Fritza Riedler", "Portrait of Emilie Flöge", "Judith I"]
      era: [Expressionism, Biedermeier, Impressionism]
    links: [art.klimt, art.klimt.the-kiss]
    tags: [painting, klimt, portrait, restitution, new-york, 1900s]
    sources:
      - "Neue Galerie New York, collection entry 'Adele Bloch-Bauer I'"
      - "Anne-Marie O'Connor, The Lady in Gold (2012)"
      - "Republic of Austria v. Altmann, 541 U.S. 677 (2004)"
    reviewed_by: null

  - id: art.bruegel.hunters-in-the-snow
    discipline: art
    kind: work
    title: "Hunters in the Snow"
    creator: Pieter Bruegel the Elder
    city: vienna
    difficulty: 1
    era: Northern Renaissance
    year: 1565
    facts:
      - "Signed and dated 1565; one of a series of the seasons painted for the Antwerp merchant Niclaes Jongelinck, of which five survive: three in Vienna, one in Prague and The Harvesters in New York."
      - "The Kunsthistorisches Museum owns twelve Bruegel panels, the largest holding anywhere."
      - "Bruegel dropped the h from Brueghel in his signature in 1559; his sons kept it."
    remark: "It is one of a set of the seasons painted in a single year, 1565, for an Antwerp merchant; Vienna kept three, Prague has the haymaking, and the harvest got away to the Metropolitan in New York."
    gaffe: "Attributing it to Pieter Brueghel the Younger, who spent his career copying his father, or spelling the father with an h; he dropped it in 1559."
    media:
      image:
        commons: "File:Pieter Bruegel the Elder - Hunters in the Snow (Winter) - Google Art Project.jpg"
        source: "Kunsthistorisches Museum, Vienna, via Wikimedia Commons (Google Art Project scan)"
        license: "Public domain (artist died 1569); verify the file's tag when fetching"
        focus: { x: 0.2, y: 0.52 }
    distractors:
      creator: [Hieronymus Bosch, Joachim Patinir, Lucas van Valckenborch]
      title: ["The Peasant Wedding", "The Gloomy Day", "The Return of the Herd"]
      era: [Dutch Golden Age, Early Netherlandish, Flemish Baroque]
    links: [art.bruegel.tower-of-babel, art.venue.kunsthistorisches-museum]
    tags: [painting, bruegel, flemish, landscape, kunsthistorisches-museum, 1500s]
    sources:
      - "Kunsthistorisches Museum Wien, Gemäldegalerie, inv. GG 1838"
      - "Manfred Sellink, Bruegel: The Complete Paintings, Drawings and Prints (2007)"
    reviewed_by: null

  - id: art.bruegel.tower-of-babel
    discipline: art
    kind: work
    title: "The Tower of Babel"
    creator: Pieter Bruegel the Elder
    city: vienna
    difficulty: 1
    era: Northern Renaissance
    year: 1563
    facts:
      - "Signed and dated 1563; the arcades are modelled on the Colosseum, which Bruegel had seen on his Italian journey a decade earlier."
      - "King Nimrod inspects the works at the bottom left while stonemasons kneel to him; the harbour at the right is full of Antwerp shipping."
      - "A second, smaller Tower of Babel by Bruegel is in the Museum Boijmans Van Beuningen in Rotterdam."
    remark: "There are two by him, the big one here and the little one in Rotterdam, and in both the tower is really the Colosseum, which Bruegel had walked round in Rome ten years before."
    gaffe: "Attributing it to Bosch because it is busy and strange, or dismissing the Rotterdam picture as a copy; both towers are by Bruegel himself."
    media:
      image:
        commons: "File:Pieter Bruegel the Elder - The Tower of Babel (Vienna) - Google Art Project - edited.jpg"
        source: "Kunsthistorisches Museum, Vienna, via Wikimedia Commons (Google Art Project scan)"
