  - id: art.vermeer.the-art-of-painting
    discipline: art
    kind: work
    title: "The Art of Painting"
    creator: Johannes Vermeer
    city: vienna
    difficulty: 2
    era: Dutch Golden Age
    year: 1666
    year_approx: true
    facts:
      - "Painted about 1666 to 1668 and never sold in Vermeer's lifetime; after his death in 1675 his widow Catharina made it over to her mother to keep it from his creditors."
      - "The model with laurel wreath, trumpet and book is Clio, the muse of history, as Ripa's Iconologia prescribes; the map behind her shows the Seventeen Provinces."
      - "Bought for Hitler from the Czernin family in 1940 for the museum he planned at Linz; it passed to the Austrian state after the war, and a Czernin restitution claim was rejected in 2011."
    remark: "The painter has his back to us and the girl is Clio, the muse of history, so it is an allegory rather than a studio scene; it is the one Vermeer he would not sell, and his widow fought his creditors for it."
    gaffe: "Calling it 'The Artist's Studio' and assuming the man at the easel is Vermeer. He is seen only from behind, in fancy dress a century out of date."
    media:
      image:
        commons: "File:Jan Vermeer - The Art of Painting - Google Art Project.jpg"
        source: "Kunsthistorisches Museum, Vienna, via Wikimedia Commons (Google Art Project scan)"
        license: "Public domain (artist died 1675); verify the file's tag when fetching"
        focus: { x: 0.58, y: 0.38 }
    distractors:
      creator: [Pieter de Hooch, Gerard ter Borch, Gabriel Metsu]
      title: ["The Milkmaid", "The Astronomer", "Woman Reading a Letter at an Open Window"]
      era: [Flemish Baroque, Northern Renaissance, Rococo]
    links: [art.venue.kunsthistorisches-museum]
    tags: [painting, vermeer, dutch, allegory, kunsthistorisches-museum, 1600s]
    sources:
      - "Kunsthistorisches Museum Wien, Gemäldegalerie, inv. GG 9128"
      - "Walter Liedtke, Vermeer: The Complete Paintings (2008)"
    reviewed_by: null

  - id: art.durer.young-hare
    discipline: art
    kind: work
    title: "Young Hare"
    creator: Albrecht Dürer
    city: vienna
    difficulty: 1
    era: Northern Renaissance
    year: 1502
    facts:
      - "Watercolour and bodycolour on paper, monogrammed and dated 1502; the Albertina holds it with the largest collection of Dürer drawings and watercolours anywhere."
      - "It is so sensitive to light that the Albertina shows the original only for limited periods and a facsimile the rest of the time."
      - "Praying Hands (1508), a brush drawing on blue paper made as a study for the Heller Altarpiece, is in the same collection."
    remark: "It is a watercolour, not a painting, and there is a window reflected in the eye; most of the year the Albertina shows a facsimile, because light would ruin the original."
    gaffe: "Calling it a rabbit, or expecting to see the original on an ordinary visit; it is a hare, and it comes out of the dark only for special showings."
    media:
      image:
        commons: "File:Albrecht Dürer - Hare, 1502 - Google Art Project.jpg"
        source: "Albertina, Vienna, via Wikimedia Commons (Google Art Project scan)"
        license: "Public domain (artist died 1528); verify the file's tag when fetching"
        focus: { x: 0.64, y: 0.3 }
    distractors:
      creator: [Lucas Cranach the Elder, Hans Holbein the Younger, Matthias Grünewald]
      title: ["Praying Hands", "The Great Piece of Turf", "Melencolia I"]
      era: [Early Netherlandish, Rococo, Biedermeier]
    links: []
    tags: [watercolour, durer, german, albertina, 1500s]
    sources:
      - "Albertina, Vienna, collection entry 'Hare' (inv. 3073)"
      - "Jane Campbell Hutchison, Albrecht Dürer: A Biography (1990)"
