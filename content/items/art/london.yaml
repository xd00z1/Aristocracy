  - id: art.holbein.the-ambassadors
    discipline: art
    kind: work
    title: "The Ambassadors"
    creator: Hans Holbein the Younger
    city: london
    difficulty: 1
    era: Northern Renaissance
    year: 1533
    facts:
      - "Painted in London and signed and dated 1533; the sitters are Jean de Dinteville, French ambassador to Henry VIII, aged twenty-nine, and his friend Georges de Selve, bishop of Lavaur, aged twenty-five."
      - "The distorted grey shape across the floor is an anamorphic skull, which comes into focus only when the picture is viewed from the right-hand side at a steep angle."
      - "The shelves between the men hold a celestial globe, a terrestrial globe, sundials, a Lutheran hymnbook and a lute with a broken string."
      - "Bought by the National Gallery in 1890 from the Earl of Radnor's collection at Longford Castle; it is NG1314."
    remark: "The smear across the floor is a skull, but only from the right-hand edge; stand there and the two ambassadors flatten out while the death's head snaps into focus."
    gaffe: "Calling them Henry VIII's ambassadors. They are French, Dinteville and de Selve, at Henry's court in the year of the Boleyn marriage, and the broken lute string is not an accident."
    media:
      image:
        commons: "File:Hans Holbein the Younger - The Ambassadors - Google Art Project.jpg"
        source: "National Gallery, London, via Wikimedia Commons (Google Art Project)"
        license: "Public domain (artist died 1543); verify the file's tag when fetching"
        focus: { x: 0.47, y: 0.86 }
    distractors:
      creator: [Quentin Matsys, Albrecht Dürer, Lucas Cranach the Elder]
      title: ["The Arnolfini Portrait", "Portrait of Erasmus", "Portrait of Henry VIII"]
      era: [Early Netherlandish, Baroque, Mannerist]
    links: [art.van-eyck.arnolfini-portrait]
    tags: [painting, portrait, northern-renaissance, tudor, 1500s, national-gallery]
    sources:
      - "National Gallery, London, catalogue entry NG1314"
      - "Susan Foister, Ashok Roy and Martin Wyld, Making and Meaning: Holbein's Ambassadors (National Gallery, 1997)"
    reviewed_by: null

  - id: art.velazquez.rokeby-venus
    discipline: art
    kind: work
    title: "The Toilet of Venus (The Rokeby Venus)"
    creator: Diego Velázquez
    city: london
    difficulty: 1
    era: Spanish Baroque
    year: 1651
    year_approx: true
    facts:
      - "Painted in about 1647 to 1651, and the only female nude by Velázquez to survive; nudes were rare in Spain under the Inquisition."
      - "Venus lies with her back to us while Cupid holds a mirror; the reflected face is blurred and, at that angle, could not really show her face at all."
      - "Named after Rokeby Park in Yorkshire, where it hung in the nineteenth century; bought for the nation in 1906 by the National Art Collections Fund, its first major purchase."
      - "On 10 March 1914 the suffragette Mary Richardson attacked it with a meat cleaver in protest at the treatment of Emmeline Pankhurst; the cuts were repaired."
    remark: "It is the only Velázquez nude that survives, and a suffragette went at it with a meat cleaver in 1914; the restoration is good enough that you have to know where the cuts were."
    gaffe: "Asking which Italian painted it. It is Spanish, from Philip IV's court, and the name is a Yorkshire country house, not a place in Italy."
    media:
      image:
        commons: "File:Diego Velázquez - Rokeby Venus.jpg"
        source: "National Gallery, London, via Wikimedia Commons"
        license: "Public domain (artist died 1660); verify the file's tag when fetching"
        focus: { x: 0.38, y: 0.33 }
    distractors:
      creator: [Francisco de Zurbarán, Bartolomé Esteban Murillo, Jusepe de Ribera]
      title: ["Venus of Urbino", "Sleeping Venus", "The Birth of Venus"]
      era: [Renaissance, Rococo, Neoclassical]
    links: [art.holbein.the-ambassadors]
    tags: [painting, nude, spanish, baroque, 1600s, national-gallery, suffragettes]
    sources:
      - "National Gallery, London, catalogue entry NG2057"
      - "Jonathan Brown, Velázquez: Painter and Courtier (1986)"
    reviewed_by: null

  - id: art.turner.the-fighting-temeraire
    discipline: art
    kind: work
    title: "The Fighting Temeraire"
    creator: J. M. W. Turner
    city: london
    difficulty: 1
    era: Romantic
    year: 1839
    facts:
      - "Exhibited at the Royal Academy in 1839 with the full title 'The Fighting Temeraire tugged to her last berth to be broken up, 1838'."
      - "The Temeraire, a 98-gun ship, fought at Trafalgar in 1805 next in line behind Victory; in September 1838 she was towed from Sheerness up the Thames to a breaker's yard at Rotherhithe."
      - "Turner refused to sell it, called it his darling, and left it to the nation in the Turner Bequest; it is NG524."
      - "Voted the greatest painting in Britain in a BBC Radio 4 poll in 2005, and printed on the Bank of England twenty-pound note issued in 2020."
    remark: "By the time she was towed the masts and rigging had already been stripped out; Turner put them back, because a bare hull would not have made an elegy."
    gaffe: "Calling it a picture of Trafalgar. Trafalgar was 1805; this is 1838, an old ship being pulled to the breakers by a steam tug, and the tug is the villain."
    media:
      image:
        commons: "File:The Fighting Temeraire, JMW Turner, National Gallery.jpg"
        source: "National Gallery, London, via Wikimedia Commons"
        license: "Public domain (artist died 1851); verify the file's tag when fetching"
        focus: { x: 0.3, y: 0.5 }
    distractors:
      creator: [John Constable, Clarkson Stanfield, John Martin]
      title: ["Rain, Steam and Speed", "The Slave Ship", "Snow Storm: Steam-Boat off a Harbour's Mouth"]
      era: [Pre-Raphaelite, Impressionist, Neoclassical]
    links: [art.turner, art.constable.the-hay-wain]
    tags: [painting, marine, romantic, british, 1830s, national-gallery, turner]
    sources:
      - "National Gallery, London, catalogue entry NG524"
      - "Judy Egerton, Turner: The Fighting Temeraire (National Gallery, 1995)"
    reviewed_by: null

  - id: art.constable.the-hay-wain
    discipline: art
    kind: work
    title: "The Hay Wain"
    creator: John Constable
    city: london
    difficulty: 1
    era: Romantic
    year: 1821
    facts:
      - "Exhibited at the Royal Academy in 1821 as 'Landscape: Noon' and left unsold; painted in Constable's London studio from sketches made on the Stour."
      - "The house on the left is Willy Lott's cottage at Flatford, Suffolk, beside the mill that Constable's father owned; the cart is crossing the millpond, not stuck in it."
      - "Bought by the Paris dealer John Arrowsmith and shown at the Salon of 1824, where Charles X awarded Constable a gold medal."
      - "Presented to the National Gallery by Henry Vaughan in 1886; the full-size oil sketch for it is in the Victoria and Albert Museum."
    remark: "Nobody bought it at the Academy in 1821; a French dealer took it to the Salon of 1824, where Charles X gave it a gold medal and the French painters took notes."
    gaffe: "Attributing it to Turner. Turner painted light dissolving ships; Constable painted the Suffolk he grew up in, and the view from Flatford is still there to check."
    media:
      image:
        commons: "File:John Constable - The Hay Wain (1821).jpg"
        source: "National Gallery, London, via Wikimedia Commons"
        license: "Public domain (artist died 1837); verify the file's tag when fetching"
        focus: { x: 0.5, y: 0.6 }
    distractors:
      creator: [J. M. W. Turner, Thomas Gainsborough, Richard Wilson]
      title: ["Flatford Mill", "Salisbury Cathedral from the Meadows", "The Cornfield"]
      era: [Pre-Raphaelite, Baroque, Impressionist]
    links: [art.turner, art.turner.the-fighting-temeraire]
    tags: [painting, landscape, romantic, british, suffolk, 1820s, national-gallery]
    sources:
      - "National Gallery, London, catalogue entry NG1207"
      - "Graham Reynolds, The Later Paintings and Drawings of John Constable (1984)"
    reviewed_by: null

  - id: art.gainsborough.mr-and-mrs-andrews
    discipline: art
    kind: work
    title: "Mr and Mrs Andrews"
    creator: Thomas Gainsborough
    city: london
    difficulty: 1
    era: Georgian
    year: 1750
    year_approx: true
    facts:
      - "Painted in about 1750: Robert Andrews and Frances Carter, married in 1748, on their estate, the Auberies, near Sudbury in Suffolk, Gainsborough's home town."
      - "Half the canvas is given to the couple's land, with the wheat in neat drilled rows; the patch on Mrs Andrews's lap was left unfinished and nobody knows what was meant to go there."
      - "Stayed with the family's descendants until the National Gallery bought it in 1960; it is NG6301."
      - "John Berger's Ways of Seeing (1972) made it the textbook example of a portrait of property as much as of people."
    remark: "Half the picture is a field, and that is the point: they are showing you the acres as much as themselves, and the blank on her lap was never painted in."
    gaffe: "Attributing it to Reynolds. Reynolds painted his sitters as Roman senators and goddesses; Gainsborough put his under an oak tree with their own wheat behind them."
    media:
      image:
        commons: "File:Thomas Gainsborough - Mr and Mrs Andrews.jpg"
        source: "National Gallery, London, via Wikimedia Commons"
        license: "Public domain (artist died 1788); verify the file's tag when fetching"
        focus: { x: 0.3, y: 0.62 }
    distractors:
      creator: [Joshua Reynolds, George Romney, Joseph Wright of Derby]
      title: ["The Blue Boy", "The Morning Walk", "The Painter's Daughters chasing a Butterfly"]
      era: [Restoration, Victorian, Edwardian]
    links: [art.term.conversation-piece, art.term.grand-manner, art.constable.the-hay-wain]
    tags: [painting, portrait, landscape, georgian, british, suffolk, 1750s, national-gallery]
    sources:
      - "National Gallery, London, catalogue entry NG6301"
      - "John Berger, Ways of Seeing (1972)"
    reviewed_by: null

  - id: art.stubbs.whistlejacket
    discipline: art
    kind: work
    title: "Whistlejacket"
    creator: George Stubbs
    city: london
    difficulty: 2
    era: Georgian
    year: 1762
    year_approx: true
    facts:
      - "Painted in about 1762 for Charles Watson-Wentworth, 2nd Marquess of Rockingham, later twice prime minister, who owned the horse; it hung at Wentworth Woodhouse in Yorkshire."
      - "A rearing Arabian stallion at life size, nearly three metres tall, against a plain bare ground: no rider, no landscape, no sky."
      - "Stubbs had spent about eighteen months dissecting horses in a farmhouse at Horkstow in Lincolnshire, and published The Anatomy of the Horse from those drawings in 1766."
      - "Bought by the National Gallery in 1997 with help from the Heritage Lottery Fund; it is NG6569."
    remark: "There is no rider, no landscape, nothing but a life-size Arabian on bare canvas, painted by a man who had spent eighteen months dissecting horses in a Lincolnshire barn."
    gaffe: "Dismissing Stubbs as a horse painter. He was an anatomist who published The Anatomy of the Horse from his own dissections, and the Academy's snobbery about animal pictures is the reason he is undervalued."
    media:
      image:
        commons: "File:Whistlejacket by George Stubbs.jpg"
        source: "National Gallery, London, via Wikimedia Commons"
        license: "Public domain (artist died 1806); verify the file's tag when fetching"
        focus: { x: 0.58, y: 0.2 }
    distractors:
      creator: [Sawrey Gilpin, Benjamin Marshall, Thomas Gainsborough]
      title: ["Mares and Foals in a Landscape", "Horse Attacked by a Lion", "Gimcrack on Newmarket Heath"]
      era: [Victorian, Baroque, Regency]
    links: [art.gainsborough.mr-and-mrs-andrews, art.term.grand-manner]
    tags: [painting, animal, horse, georgian, british, 1760s, national-gallery]
    sources:
      - "National Gallery, London, catalogue entry NG6569"
      - "Judy Egerton, George Stubbs, Painter: Catalogue Raisonné (2007)"
    reviewed_by: null

  - id: art.van-gogh.sunflowers
    discipline: art
    kind: work
    title: "Sunflowers"
    creator: Vincent van Gogh
    city: london
    difficulty: 1
    era: Post-Impressionist
    year: 1888
    facts:
      - "Painted in Arles in August 1888 to decorate the room in the Yellow House that Gauguin was coming to occupy; fifteen sunflowers in a vase on a yellow ground."
      - "One of seven vase pictures: four painted in August 1888 and three repetitions in January 1889; the Amsterdam canvas is Van Gogh's own copy of the London one."
      - "Signed 'Vincent' on the vase, as he always signed; bought by the National Gallery in 1924 through the Courtauld Fund, and it is NG3863."
    remark: "He painted them in August 1888 for the bedroom Gauguin was about to move into; the London canvas is one of the originals, and Amsterdam's is his own copy of it."
    gaffe: "Saying 'the Sunflowers' as if there were one. There are seven of the vase pictures in Arles alone, and the National Gallery's is the one he copied for the Amsterdam version."
    media:
      image:
        commons: "File:Vincent Willem van Gogh 127.jpg"
        source: "National Gallery, London, via Wikimedia Commons (Yorck Project)"
        license: "Public domain (artist died 1890); verify the file's tag when fetching"
        focus: { x: 0.5, y: 0.82 }
    distractors:
      creator: [Paul Gauguin, Claude Monet, Paul Cézanne]
      title: ["The Starry Night", "Irises", "Wheatfield with Crows"]
      era: [Impressionist, Fauvist, Expressionist]
    links: [art.whistler]
    tags: [painting, still-life, post-impressionist, dutch, arles, 1880s, national-gallery]
    sources:
      - "National Gallery, London, catalogue entry NG3863"
      - "Vincent van Gogh: The Letters, ed. Leo Jansen, Hans Luijten and Nienke Bakker (2009)"
    reviewed_by: null

