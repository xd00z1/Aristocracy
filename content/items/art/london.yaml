  - id: art.millais.ophelia
    discipline: art
    kind: work
    title: "Ophelia"
    creator: John Everett Millais
    city: london
    difficulty: 1
    era: Pre-Raphaelite
    year: 1852
    facts:
      - "Painted in 1851 and 1852 and exhibited at the Royal Academy in 1852; the subject is Gertrude's speech in Hamlet, Act IV, describing a drowning that happens offstage."
      - "The riverbank was painted from life on the Hogsmill at Ewell in Surrey over about five months, from July into November 1851; Elizabeth Siddal then posed for the figure in a bath of water in Millais's London studio, warmed by lamps underneath."
      - "The lamps went out, Siddal caught a bad cold, and her father threatened Millais with an action for the doctor's bills."
      - "Presented to the nation by Sir Henry Tate in 1894; it hangs at Tate Britain."
    remark: "The drowning happens offstage in Hamlet; Millais painted Gertrude's speech, and did the river first, at Ewell, for about five months before the girl went into a bath in London."
    gaffe: "Attributing it to Rossetti or Waterhouse. Rossetti drew Siddal endlessly but not this, and Waterhouse's drowning girls came forty years later."
    media:
      image:
        commons: "File:John Everett Millais - Ophelia - Google Art Project.jpg"
        source: "Tate Britain, London, via Wikimedia Commons (Google Art Project)"
        license: "Public domain (artist died 1896); verify the file's tag when fetching"
        focus: { x: 0.55, y: 0.5 }
    distractors:
      creator: [Dante Gabriel Rossetti, William Holman Hunt, John William Waterhouse]
      title: ["The Lady of Shalott", "Christ in the House of His Parents", "Mariana"]
      era: [Romantic, Aesthetic Movement, Impressionist]
    links: [art.movement.pre-raphaelite-brotherhood]
    tags: [painting, pre-raphaelite, victorian, shakespeare, british, 1850s, tate-britain]
    sources:
      - "Tate, catalogue entry N01506, 'Ophelia'"
      - "Malcolm Warner et al., The Pre-Raphaelites (Tate Gallery exhibition catalogue, 1984)"
    reviewed_by: null

  # ---------------------------------------------------------------------------
  # Creators
  # ---------------------------------------------------------------------------

  - id: art.hogarth
    discipline: art
    kind: creator
    title: "William Hogarth"
    city: london
    difficulty: 2
    era: Georgian
    year: 1697
    year_end: 1764
    facts:
      - "Born in Smithfield, London, in 1697, the son of a schoolmaster who was imprisoned for debt; apprenticed to a silver engraver before turning to painting."
      - "Invented what he called 'modern moral subjects', stories told in a series of pictures and sold as engravings: A Harlot's Progress (1732), A Rake's Progress (1732 to 1734, engraved 1735, Sir John Soane's Museum) and Marriage A-la-Mode (about 1743, National Gallery)."
      - "The Engravers' Copyright Act of 1735, still called Hogarth's Act, was passed after pirates copied A Harlot's Progress; it was the first copyright protection for artists in Britain."
      - "Painted himself with his pug, Trump, in 1745 (Tate Britain); the six Marriage A-la-Mode canvases came to the National Gallery with the Angerstein collection at its foundation in 1824."
    remark: "The paintings were almost a sideline; he told the stories in six or eight scenes, sold the engravings by subscription, and got Parliament to pass a copyright act in 1735 so nobody else could."
    gaffe: "Treating Marriage A-la-Mode as six separate pictures. It is one story in order, from the marriage settlement to the countess's suicide, and the point is the sequence."
    media:
      image:
        commons: "File:Marriage A-la-Mode 1, The Marriage Settlement - William Hogarth.jpg"
        source: "William Hogarth, Marriage A-la-Mode: 1, The Marriage Settlement (about 1743), National Gallery, London, via Wikimedia Commons"
        license: "Public domain (artist died 1764); verify the file's tag when fetching"
    distractors:
      person: [Joseph Highmore, Francis Hayman, Arthur Devis]
      era: [Restoration, Victorian, Regency]
    links: [art.term.conversation-piece, art.gainsborough.mr-and-mrs-andrews, art.term.grand-manner]
    tags: [painter, engraver, satire, georgian, british, 1700s, national-gallery]
    sources:
      - "Oxford Dictionary of National Biography, 'Hogarth, William'"
      - "Ronald Paulson, Hogarth (3 vols, 1991 to 1993)"
      - "National Gallery, London, catalogue entries NG113 to NG118"
    reviewed_by: null

  - id: art.whistler
    discipline: art
    kind: creator
    title: "James McNeill Whistler"
    city: london
    difficulty: 2
    era: Aesthetic Movement
    year: 1834
    year_end: 1903
    facts:
      - "Born in Lowell, Massachusetts, in 1834; left America for Paris in 1855 and never went back; settled in London in 1859 and lived mostly in Chelsea until his death in 1903."
      - "Gave his pictures musical titles, Symphony, Arrangement, Harmony, Nocturne; the portrait of his mother is Arrangement in Grey and Black No. 1 (1871, Musée d'Orsay)."
      - "Sued Ruskin for libel in 1877, after Ruskin wrote that he was 'flinging a pot of paint in the public's face' with Nocturne in Black and Gold: The Falling Rocket; at the trial in November 1878 he won a farthing in damages, and the costs bankrupted him in 1879."
      - "Tate Britain holds the Thames Nocturnes, including Nocturne: Blue and Gold, Old Battersea Bridge and Nocturne: Blue and Silver, Chelsea."
    remark: "Ruskin accused him of flinging a pot of paint in the public's face; Whistler sued, won a farthing, and the costs bankrupted him, which makes it the most expensive farthing in English art."
    gaffe: "Calling him English. He was American, from Lowell, Massachusetts, left for Paris at twenty-one and never went home; London and Paris were his cities."
    media:
      image:
        commons: "File:Whistlers Mother high res.jpg"
        source: "James McNeill Whistler, Arrangement in Grey and Black No. 1 (1871), Musée d'Orsay, Paris, via Wikimedia Commons"
        license: "Public domain (artist died 1903); verify the file's tag when fetching"
    distractors:
      person: [John Singer Sargent, Walter Sickert, Albert Moore]
      era: [Pre-Raphaelite, Impressionist, Post-Impressionist]
    links: [art.turner, art.movement.pre-raphaelite-brotherhood, art.van-gogh.sunflowers]
    tags: [painter, etcher, aesthetic-movement, american, chelsea, 1800s, tate-britain]
    sources:
      - "Oxford Dictionary of National Biography, 'Whistler, James Abbott McNeill'"
      - "Linda Merrill, A Pot of Paint: Aesthetics on Trial in Whistler v. Ruskin (1992)"
      - "Tate, 'James Abbott McNeill Whistler 1834–1903' artist biography"
    reviewed_by: null

  # ---------------------------------------------------------------------------
  # Movement and terms
  # ---------------------------------------------------------------------------

  - id: art.movement.pre-raphaelite-brotherhood
    discipline: art
    kind: movement
    title: "The Pre-Raphaelite Brotherhood"
    city: london
    difficulty: 1
    era: Victorian
    year: 1848
    year_end: 1853
    facts:
      - "Founded in London in September 1848 by seven young men, none older than twenty-three: Dante Gabriel Rossetti, John Everett Millais and William Holman Hunt, with Thomas Woolner, James Collinson, Frederic George Stephens and William Michael Rossetti."
      - "They signed early pictures with the secret initials PRB and rejected the conventions the Academy taught from Raphael, preferring the sharp detail and bright colour of art before him; Reynolds they nicknamed 'Sir Sloshua'."
      - "Dickens attacked Millais's Christ in the House of His Parents in Household Words in 1850, calling the boy Jesus 'wry-necked, blubbering, red-headed'; Ruskin defended the group in letters to The Times in 1851."
      - "The Brotherhood had dispersed by 1853, but Burne-Jones and William Morris carried a second Pre-Raphaelite wave into the 1860s and beyond; the Tate holds the core collection."
    remark: "The name means before Raphael: they thought painting went wrong with him and that Reynolds, whom they called Sir Sloshua, finished the job; Dickens loathed them and Ruskin saved them."
    gaffe: "Assuming they painted like Raphael. The whole point was to paint as if he had never happened, in hard-edged detail from nature, and on a white ground so the colour glowed."
    distractors:
      title: ["The Aesthetic Movement", "The Arts and Crafts Movement", "The Nazarenes"]
      era: [Georgian, Regency, Edwardian]
    links: [art.millais.ophelia, art.term.grand-manner, art.whistler]
    tags: [movement, pre-raphaelite, victorian, british, 1840s, tate-britain]
    sources:
      - "Tate, art term 'Pre-Raphaelite'"
      - "Elizabeth Prettejohn, The Art of the Pre-Raphaelites (2000)"
      - "Malcolm Warner et al., The Pre-Raphaelites (Tate Gallery exhibition catalogue, 1984)"
    reviewed_by: null

  - id: art.term.conversation-piece
    discipline: art
    kind: term
    title: "Conversation piece"
    city: london
    difficulty: 2
    era: Georgian
    definition: "An informal group portrait, usually small in scale, showing a family or friends at some shared occupation, taking tea, making music, walking their land, in a domestic or landscape setting; a British speciality of the eighteenth century."
    facts:
      - "The term was in use in England by the 1720s; Hogarth, Arthur Devis, Johann Zoffany and the young Gainsborough were its chief practitioners."
      - "Gainsborough's Mr and Mrs Andrews in the National Gallery is the example everyone knows; Zoffany painted the royal family and the Academicians in the same idiom."
      - "The scale is that of a cabinet picture: full-length figures a foot or so high, which is what separates it from the life-size portrait of the Grand Manner."
    remark: "A conversation piece is a small group portrait of people doing something, tea or cards or a walk over their acres, and the joke of the name is that nobody in one is ever talking."
    gaffe: "Using it to mean an object that starts a conversation. In a gallery it is a genre, Hogarth and Devis and Zoffany, small full-length figures at home."
    distractors:
      term:
        - "A portrait in which the sitter is shown in the costume and pose of a classical hero or goddess."
        - "A painting of a crowded public entertainment such as a fair, a masquerade or a race meeting."
        - "A pair of portraits of husband and wife painted to hang facing each other."
    links: [art.gainsborough.mr-and-mrs-andrews, art.hogarth, art.term.grand-manner]
    tags: [term, portrait, georgian, british, 1700s]
    sources:
