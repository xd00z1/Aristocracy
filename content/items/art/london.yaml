  - id: art.term.grand-manner
    discipline: art
    kind: term
    title: "The Grand Manner"
    city: london
    difficulty: 3
    era: Georgian
    definition: "The elevated style of history painting and portraiture, drawn from the Italian High Renaissance and the antique, that Joshua Reynolds set out in his Discourses to the Royal Academy: idealised figures, classical poses and general truths in place of particular detail."
    facts:
      - "Reynolds delivered fifteen Discourses to the Royal Academy between 1769 and 1790 as its first President; the Academy was founded in 1768 and he was knighted the following year."
      - "In practice it meant painting a sitter in the pose of an antique statue or as a figure from mythology, and treating portraiture as a branch of history painting."
      - "Reynolds's Discourse XIV, delivered after Gainsborough's death in 1788, praised him generously while noting that he had never attempted the grand style."
      - "The Pre-Raphaelites' nickname for Reynolds, 'Sir Sloshua', was aimed at exactly this manner."
    remark: "The Grand Manner is Reynolds's term for painting a general as a Roman and a lady as a goddess; he laid it down in fifteen Discourses to the Academy, and it is what the Pre-Raphaelites meant by Sir Sloshua."
    gaffe: "Calling Gainsborough's portraits Grand Manner. Gainsborough is the counter-example, and Reynolds's own Discourse XIV credits him with everything except the grand style."
    distractors:
      term:
        - "A loose, rapid way of painting in which the brushstrokes remain visible on the surface."
        - "The British fashion for small informal group portraits of families at their leisure."
        - "A landscape style of ruined temples and golden evening light modelled on Claude."
    links: [art.gainsborough.mr-and-mrs-andrews, art.term.conversation-piece, art.movement.pre-raphaelite-brotherhood, art.hogarth]
    tags: [term, portrait, history-painting, reynolds, royal-academy, georgian, 1700s]
    sources:
      - "Grove Art Online, 'Grand Manner'"
      - "Joshua Reynolds, Discourses on Art, ed. Robert R. Wark (1975)"
