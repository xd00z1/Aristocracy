      era: [Neoclassical, Realist, Impressionist]
    links: [art.delacroix.liberty-leading-the-people, art.david.oath-of-the-horatii, art.term.salon]
    tags: [painting, history-painting, romantic, french, shipwreck, 1810s, louvre]
