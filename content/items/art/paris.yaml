# Paris: the Louvre's big canvases and the Musée d'Orsay's Impressionists,
# taught where they hang. The Louvre gives the Mona Lisa, the Raft of the
# Medusa, Liberty and the Oath of the Horatii; the Orsay gives Manet and
# Renoir; the Marmottan gives Impression, Sunrise. Monet, Manet, Renoir and
# David are taught through their works; Degas, Cézanne and Rodin are creators.
# Impressionism is the one movement; the Salon and japonisme are the terms
# (plein air and the Salon des Refusés are folded into them). Rodin's sculpture
# needs a public-domain photograph, so his image is Nadar's 1893 portrait.
items:
