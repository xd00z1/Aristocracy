      era: [Impressionist, Neoclassical, Romantic]
    links: [art.term.salon, art.movement.impressionism, art.monet.impression-sunrise, art.term.japonisme]
    tags: [painting, nude, realist, french, salon-des-refuses, 1860s, musee-d-orsay]
