  - id: art.movement.impressionism
    discipline: art
    kind: movement
    title: "Impressionism"
    city: paris
    difficulty: 1
    era: Impressionist
    year: 1874
    year_end: 1886
    facts:
      - "The first exhibition opened on 15 April 1874 at 35 boulevard des Capucines, the photographer Nadar's former studio, organised by a Société anonyme of painters, sculptors and engravers with about thirty exhibitors; Monet, Renoir, Pissarro, Sisley, Degas, Morisot and Cézanne were among them."
      - "The name came from Louis Leroy's mocking review of Monet's Impression, Sunrise in Le Charivari; there were eight exhibitions between 1874 and 1886, and Pissarro was the only painter at all of them."
      - "Paint in metal tubes, patented by John Goffe Rand in 1841, made painting outdoors, en plein air, practical; broken brushwork, colours laid side by side rather than blended, and subjects from modern life were the shared habits, though Degas worked indoors."
      - "Manet was the elder the group looked to and never exhibited with them; the dealer Paul Durand-Ruel, who met Monet and Pissarro in London in 1871, kept them going through decades of poor sales."
      - "Gustave Caillebotte's bequest of 1894 brought the movement into the national collections over official reluctance; the state's Impressionists are now in the Musée d'Orsay, opened in 1986, with Monet's Water Lilies at the Orangerie since 1927."
    remark: "Pissarro is the only one who showed at all eight exhibitions, from Nadar's old studio in 1874 to the last in 1886; Monet, whose picture named the group, missed three of them."
    gaffe: "Calling Manet an Impressionist. He was their elder and their cause, and he declined to show with them every single time; the Salon was where he wanted to win."
    distractors:
      title: ["Post-Impressionism", "Realism", "The Barbizon School"]
      era: [Realist, Symbolist, Fauvist]
    links: [art.monet.impression-sunrise, art.renoir.bal-du-moulin-de-la-galette, art.degas, art.cezanne, art.manet.dejeuner-sur-l-herbe, art.term.salon, art.term.japonisme, art.whistler, art.van-gogh.sunflowers]
    tags: [movement, impressionist, french, plein-air, 1870s, 1880s, musee-d-orsay]
    sources:
      - "Grove Art Online, 'Impressionism'"
      - "John Rewald, The History of Impressionism (4th ed., 1973)"
      - "Charles S. Moffett (ed.), The New Painting: Impressionism 1874–1886 (exhibition catalogue, 1986)"
    reviewed_by: null

