      title: ["The Death of Marat", "The Coronation of Napoleon", "The Lictors Bring to Brutus the Bodies of his Sons"]
      era: [Rococo, Romantic, Baroque]
    links: [history.episode.french-revolution, history.person.marie-antoinette, art.delacroix.liberty-leading-the-people, art.term.salon]
    tags: [painting, history-painting, neoclassical, french, rome, 1780s, louvre]
