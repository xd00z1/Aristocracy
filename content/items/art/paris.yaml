        commons: "File:Auguste Renoir - Dance at Le Moulin de la Galette - Musée d'Orsay RF 2739 (derivative work - AutoContrast edit in LCH space).jpg"
        source: "Musée d'Orsay, Paris, via Wikimedia Commons"
        license: "Public domain (artist died 1919); verify the file's tag when fetching"
