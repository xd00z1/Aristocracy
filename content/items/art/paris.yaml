  - id: art.leonardo.mona-lisa
    discipline: art
    kind: work
    title: "Mona Lisa"
    creator: Leonardo da Vinci
    city: paris
    difficulty: 1
    era: High Renaissance
    year: 1503
    year_approx: true
    facts:
      - "Oil on poplar panel, Louvre Inv. 779, usually given as 77 by 53 centimetres (the Louvre measures the panel itself at 79.4 by 53.4); Leonardo took it with him to France in his last years, and it has been in the French royal and then national collection since Francis I."
      - "Vasari's Lives (1550) says Leonardo painted the wife of Francesco del Giocondo, hence La Gioconda and La Joconde; a marginal note by Agostino Vespucci dated October 1503, found at Heidelberg in 2005, confirms he was at work on the portrait of Lisa del Giocondo then."
      - "There are no drawn outlines: the face is modelled by thin glazes shading into shadow, the technique known as sfumato, and there are no eyebrows or lashes."
      - "Stolen on 21 August 1911 by Vincenzo Peruggia, an Italian house painter who had worked on glazing pictures at the Louvre; recovered in Florence in December 1913 when he tried to sell it to the Uffizi through a dealer."
      - "Hangs behind glass on its own wall in the Salle des États, the largest room in the Louvre, facing Veronese's Wedding at Cana."
    remark: "Until August 1911 it was an admired Leonardo and no more; then Vincenzo Peruggia, who had fitted glass at the Louvre, walked out with it under his smock, and two years on a missing wall did more for its fame than four centuries on a full one."
    gaffe: "Asking who she was as if nobody knew. Vasari named her in 1550, Lisa Gherardini, wife of the Florentine cloth merchant Francesco del Giocondo, and a note found at Heidelberg in 2005 has Leonardo at work on her in October 1503."
