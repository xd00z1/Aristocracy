      era: [Impressionist, Cubist, Fauvist]
    links: [art.movement.impressionism, art.term.salon, art.van-gogh.sunflowers, art.degas]
    tags: [painter, post-impressionist, french, aix-en-provence, cubism, still-life, 1800s, musee-d-orsay]
