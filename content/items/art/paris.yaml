    language: French
    facts:
      - "Born in Paris in 1840, refused three times by the École des Beaux-Arts, and died at Meudon in 1917; his first exhibited figure, The Age of Bronze (1877), was so lifelike that he was accused of casting it from the model."
      - "In 1880 the state commissioned a bronze door, The Gates of Hell, for a museum of decorative arts that was never built; he worked on it until his death without finishing it, and The Thinker, The Kiss and dozens of other figures began there."
      - "The Thinker was the poet, Dante, above the doors; enlarged in 1902 to 1904, the first monumental cast was set up in front of the Panthéon in 1906 by public subscription and moved to the garden of the Musée Rodin in 1922."
      - "The Kiss is Paolo and Francesca from Dante's Inferno; the marble commissioned by the state in 1888 was shown at the Salon of 1898 beside the Balzac, which the Société des Gens de Lettres had commissioned and then refused."
      - "Went to Italy in 1875 to 1876 to see Michelangelo; Camille Claudel worked in his studio from 1884 and became his lover; in 1916 he gave his work and the Hôtel Biron to the state, and the Musée Rodin opened there in 1919."
    remark: "The Thinker was never meant to sit alone: he is Dante above the Gates of Hell, a door commissioned in 1880 for a museum that was never built, and Rodin worked on it for thirty-seven years without finishing."
    gaffe: "Asking whether the Thinker in front of you is 'the original'. Rodin's bronzes are casts, more than twenty full-size Thinkers exist, and the Musée Rodin went on casting after his death under the terms of his gift."
    media:
      image:
        commons: "File:Auguste Rodin 1893 Nadar.jpg"
        source: "Photograph of Rodin by Nadar, 1893, via Wikimedia Commons"
        license: "Public domain (photographer died 1910); verify the file's tag when fetching"
        focus: { x: 0.5, y: 0.3 }
    distractors:
      person: [Camille Claudel, Antoine Bourdelle, Jean-Baptiste Carpeaux]
      era: [Neoclassical, Art Deco, Baroque]
    links: [art.term.salon, art.degas, art.michelangelo.david]
    tags: [sculptor, bronze, marble, french, belle-epoque, musee-rodin, dante, 1800s]
    sources:
      - "Grove Art Online, 'Rodin, Auguste'"
      - "Musée Rodin, collection entries 'The Thinker', 'The Gates of Hell' and 'The Kiss'"
