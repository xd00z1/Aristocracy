  - id: art.cezanne
    discipline: art
    kind: creator
    title: "Paul Cézanne"
    city: paris
    difficulty: 2
    era: Post-Impressionist
    year: 1839
    year_end: 1906
    pronunciation: "say-ZAN"
    language: French
    facts:
      - "Born in Aix-en-Provence in 1839, a banker's son, and died there in 1906; at school in Aix his closest friend was Émile Zola, and the friendship faded after Zola's novel L'Œuvre (1886), whose failed painter was widely read as a portrait of him."
      - "Showed at the first and third Impressionist exhibitions, 1874 and 1877, after working beside Pissarro at Pontoise and Auvers; the Salon jury refused him year after year and accepted him once, in 1882, as the 'pupil' of a friend who sat on the jury."
      - "His first one-man show was at Ambroise Vollard's gallery in the rue Laffitte in 1895, when he was fifty-six; the retrospective at the Salon d'Automne of 1907, the year after his death, was studied by Braque and Picasso."
      - "He wrote to Émile Bernard on 15 April 1904 that nature should be treated by the cylinder, the sphere and the cone; he painted Mont Sainte-Victoire, outside Aix, dozens of times."
      - "The Musée d'Orsay holds one of the five versions of The Card Players; another was bought for Qatar in 2011 at a price reported at over 250 million dollars. He died of pneumonia a week after being caught in a storm while painting outdoors."
    remark: "He told Émile Bernard in 1904 to treat nature by the cylinder, the sphere and the cone, and the retrospective the year after his death was the exhibition Braque and Picasso were looking at when Cubism began."
    gaffe: "Filing him under Impressionism. He showed with them twice, in 1874 and 1877, then went back to Aix and spent thirty years painting one mountain until it was structure rather than weather."
    media:
      image:
        commons: "File:Les Joueurs de cartes, par Paul Cézanne.jpg"
        source: "Paul Cézanne, The Card Players (Les Joueurs de cartes), c. 1894–95, Musée d'Orsay, Paris, via Wikimedia Commons"
