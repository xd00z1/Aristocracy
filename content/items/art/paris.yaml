  - id: art.renoir.bal-du-moulin-de-la-galette
    discipline: art
    kind: work
    title: "Bal du moulin de la Galette"
    creator: Pierre-Auguste Renoir
    city: paris
    difficulty: 1
    era: Impressionist
    year: 1876
    pronunciation: "BAL dew moo-LAN duh la ga-LET"
    language: French
    facts:
      - "Oil on canvas, 131 by 175 centimetres, Musée d'Orsay RF 2739; shown at the third Impressionist exhibition in 1877 and left to the state by Gustave Caillebotte in 1894."
      - "The Moulin de la Galette was a dance garden beside two old windmills at the top of Montmartre, open on Sunday afternoons; Renoir took a studio nearby at 12 rue Cortot in 1876 and had the canvas carried down to paint on the spot."
      - "The sitters are friends: the writer Georges Rivière at the table with the painters Franc-Lamy and Norbert Gœneutte, and the Montmartre models Jeanne and her sister Estelle, the girl in the blue and pink striped dress on the bench in the foreground."
      - "The dappled patches on the dancers' clothes and the ground are sunlight through acacia leaves."
      - "A smaller version sold at Sotheby's in New York on 17 May 1990 for 78.1 million dollars to the Japanese businessman Ryoei Saito, two days after he bought Van Gogh's Portrait of Dr Gachet."
    remark: "The patches on the dancers' clothes are sunlight through acacia leaves, painted on the spot on a Montmartre Sunday afternoon; the Moulin was a real windmill with a dance floor, and the Moulin Rouge did not exist for another thirteen years."
    gaffe: "Attributing it to Monet, or confusing the Galette with the Moulin Rouge. The Galette was a windmill with a dance garden at the top of Montmartre; the Moulin Rouge opened at the foot of the hill in 1889 and its sails never turned for flour."
    media:
