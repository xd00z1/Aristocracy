  - id: art.manet.dejeuner-sur-l-herbe
    discipline: art
    kind: work
    title: "Le Déjeuner sur l'herbe"
    creator: Édouard Manet
    city: paris
    difficulty: 1
    era: Realist
    year: 1863
    pronunciation: "luh day-zhuh-NAY sewr LAIRB"
    language: French
    facts:
      - "Oil on canvas, 208 by 264.5 centimetres, Musée d'Orsay RF 1668; rejected by the Salon jury of 1863 and shown at the Salon des Refusés, which opened on 15 May 1863, under the title Le Bain."
      - "The group is lifted from Marcantonio Raimondi's engraving after Raphael's Judgement of Paris, and the idea of naked women beside dressed men from Titian's Pastoral Concert in the Louvre; the nude is Victorine Meurent, who posed for Olympia the same year."
      - "The men are one of Manet's brothers and his future brother-in-law, the sculptor Ferdinand Leenhoff; the still life of clothes and fruit at the lower left is painted with more care than the landscape behind."
      - "Given to the state by Étienne Moreau-Nélaton in 1906; it hung at the Musée des Arts Décoratifs from 1907, went to the Louvre in 1934 and to the Jeu de Paume in 1947, and moved to the Orsay when that museum opened in 1986."
      - "Manet never exhibited with the Impressionists, though the younger painters treated him as their leader; he kept submitting to the Salon until his death in 1883."
    remark: "Its scandal was not the nude but her company: Titian's Pastoral Concert in the Louvre has naked women beside clothed men too, but Manet's men wear the frock coats of 1863, and the woman looks straight at you."
    gaffe: "Calling it an Impressionist painting shown at the Salon. The jury threw it out; it hung at the Salon des Refusés of 1863 as Le Bain, eleven years before the first Impressionist exhibition, which Manet declined to join, as he declined all eight."
    media:
      image:
        commons: "File:Edouard Manet - Luncheon on the Grass - Google Art Project.jpg"
        source: "Musée d'Orsay, Paris, via Wikimedia Commons (Google Art Project)"
        license: "Public domain (artist died 1883); verify the file's tag when fetching"
