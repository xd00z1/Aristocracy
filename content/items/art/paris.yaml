  - id: art.delacroix.liberty-leading-the-people
    discipline: art
    kind: work
    title: "Liberty Leading the People"
    creator: Eugène Delacroix
    city: paris
    difficulty: 1
    era: Romantic
    year: 1830
    facts:
      - "Oil on canvas, 260 by 325 centimetres, Louvre RF 129; painted in the autumn of 1830 and shown at the Salon of 1831 as 'Le 28 juillet: La Liberté guidant le peuple'."
      - "The subject is the July Revolution of 1830, the three days of 27 to 29 July that ended the reign of Charles X and put Louis-Philippe on the throne; the towers of Notre-Dame stand at the right with a tricolour flying from one of them."
      - "Delacroix wrote to his brother in October 1830 that he had taken on a modern subject, a barricade, and that if he had not fought for his country he would at least paint for her."
      - "The state bought it in 1831 for 3,000 francs, hung it briefly, then kept it out of sight as too inflammatory; it came back on view after 1848 and entered the Louvre in 1874."
      - "The man in the top hat with the musket has often been taken for Delacroix himself, an identification most scholars now reject; the boy with two pistols is usually said to have suggested Gavroche in Hugo's Les Misérables (1862), and the picture was on the 100-franc note from 1978 to 1995."
    remark: "It is not 1789: it is the three days of July 1830 that got rid of Charles X, and Delacroix, who had watched rather than fought, told his brother that if he had not won for his country he would at least paint for her."
    gaffe: "Placing it in 1789, or on the barricades of Les Misérables. It is July 1830; Hugo's barricade is June 1832, though the boy with the pistols is generally taken to have suggested Gavroche."
    media:
      image:
        commons: "File:Eugène Delacroix - Le 28 Juillet. La Liberté guidant le peuple.jpg"
        source: "Musée du Louvre, Paris, via Wikimedia Commons"
