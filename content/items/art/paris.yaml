  - id: art.david.oath-of-the-horatii
    discipline: art
    kind: work
    title: "The Oath of the Horatii"
    creator: Jacques-Louis David
    city: paris
    difficulty: 2
    era: Neoclassical
    year: 1784
    facts:
      - "Oil on canvas, 330 by 425 centimetres, Louvre Inv. 3692; commissioned by the Crown through the comte d'Angiviller, painted in Rome in 1784 and shown there in David's studio before it reached the Paris Salon of 1785."
      - "The story is from Livy: three brothers of the Horatii fight three Curiatii of Alba Longa to settle a war between the two cities, and Corneille made a tragedy of it, Horace, in 1640. The oath sworn on the swords is in neither Livy nor Corneille."
      - "The women at the right are Sabina, a Curiatius sister married to a Horatius, and Camilla, a Horatius sister betrothed to a Curiatius; in Livy the surviving brother kills Camilla for mourning her lover."
      - "Three arches, three groups, straight lines for the men and curves for the women: it became the model for Neoclassical history painting, and later, against its own date, an image of Revolutionary virtue."
      - "David went on to sit in the Convention, vote for the death of Louis XVI, sketch Marie Antoinette on the cart to the scaffold in October 1793, paint the Death of Marat and the Coronation of Napoleon, and die in exile in Brussels in 1825."
    remark: "It was a royal commission, painted in Rome for Louis XVI's Bâtiments du Roi five years before the Bastille, and the oath itself is in neither Livy nor Corneille: David invented the one moment the picture is about."
    gaffe: "Reading it as a Revolutionary manifesto. It is 1784 and paid for by the Crown; David's politics came later, and by January 1793 he was voting for the king's death."
    media:
      image:
        commons: "File:Jacques-Louis David, Le Serment des Horaces.jpg"
        source: "Musée du Louvre, Paris (INV 3692), via Wikimedia Commons"
        license: "Public domain (artist died 1825); verify the file's tag when fetching"
        focus: { x: 0.47, y: 0.4 }
    distractors:
