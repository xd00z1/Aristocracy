  - id: art.degas
    discipline: art
    kind: creator
    title: "Edgar Degas"
    city: paris
    difficulty: 2
    era: Impressionist
    year: 1834
    year_end: 1917
    facts:
      - "Born in Paris in 1834 into a banking family that spelled the name De Gas, and died in Paris in 1917; trained under Louis Lamothe, a pupil of Ingres, and told Paul Valéry that Ingres himself had advised him in 1855 to draw lines, many lines."
      - "Showed at seven of the eight Impressionist exhibitions, all but 1882, and disliked the name; he preferred Independents, worked in the studio from drawings and memory, and had no use for painting outdoors."
      - "Dancers make up something like half his output, mostly at class and rehearsal at the Paris Opéra rather than on stage; the Little Dancer Aged Fourteen, a wax figure dressed in a real tutu and shown in 1881, was the only sculpture he exhibited in his life, and the bronzes were cast after his death."
      - "The Musée d'Orsay holds The Ballet Class (La Classe de danse) and L'Absinthe; his eyesight failed from the 1870s, and the late pastels are large, coarse and mostly of women bathing."
      - "An anti-Dreyfusard who broke with Jewish friends, including the Halévy family, during the affair."
    remark: "He showed with the Impressionists at seven of their eight exhibitions and hated the word: no sunsets, no painting outdoors, everything worked up indoors from drawings and memory, which is why his dancers look caught rather than posed."
    gaffe: "Calling him a painter of pretty ballerinas. They are working girls of the Opéra at class and rehearsal, scratching and yawning, and the Little Dancer of 1881, wax in a real tutu, so repelled the critics that he never showed another sculpture."
    media:
      image:
        commons: "File:Edgar Degas - The Ballet Class - Google Art Project.jpg"
        source: "Edgar Degas, The Ballet Class (La Classe de danse), Musée d'Orsay, Paris, via Wikimedia Commons (Google Art Project)"
        license: "Public domain (artist died 1917); verify the file's tag when fetching"
        focus: { x: 0.5, y: 0.5 }
    distractors:
      person: [Édouard Manet, Gustave Caillebotte, Henri de Toulouse-Lautrec]
      era: [Realist, Post-Impressionist, Symbolist]
    links: [art.movement.impressionism, art.term.japonisme, art.renoir.bal-du-moulin-de-la-galette, art.monet.impression-sunrise, opera.venue.palais-garnier]
    tags: [painter, sculptor, impressionist, french, dancers, opera, pastel, 1800s, musee-d-orsay]
    sources:
