  - id: art.term.salon
    discipline: art
    kind: term
    title: "The Salon"
    city: paris
    difficulty: 2
    era: Academic
    year: 1667
    definition: "The official exhibition of living artists in Paris, held by the Académie royale from 1667 and named after the Salon Carré of the Louvre, where it hung from 1725. In the nineteenth century it was the event that made or broke a painter: a jury chose the works, hung them frame to frame up to the ceiling, and rejection could mean ruin. 'Salon painting' means the polished, academic kind it rewarded."
    pronunciation: "sa-LOHN"
    language: French
    facts:
      - "First held in 1667 by the Académie royale de peinture et de sculpture; in the Salon Carré of the Louvre from 1725, which gave it the name; opened to all artists in 1791, when the Revolution ended the Academy's monopoly."
      - "Diderot's reviews of the Salons from 1759 to 1781 are the beginning of art criticism; to be 'skyed', hung near the ceiling, was a verdict, and the eye-level line was the prize."
      - "In 1863 the jury rejected more than two thousand of some five thousand submissions; Napoleon III ordered the rejects shown in rooms next door in the Palais de l'Industrie, and the Salon des Refusés opened on 15 May with Manet's Déjeuner sur l'herbe and Whistler's White Girl in it."
      - "In 1881 the state handed the Salon to the Société des Artistes Français; the Salon des Indépendants (1884, no jury, no prizes) and the Salon d'Automne (1903) became the venues for new painting, and the Fauves were named at the Salon d'Automne of 1905."
    remark: "The rejections of 1863 were so wholesale that Napoleon III ordered the rejects shown next door, and the Salon des Refusés, with Manet's Déjeuner in it, is the exhibition anybody now remembers from that year."
    gaffe: "Confusing the Salon with a salon. Madame Geoffrin's drawing room was a salon; the Salon, capital S, is the state exhibition named after a room in the Louvre, and being skyed there, hung up by the ceiling, was a judgement."
    distractors:
      term:
        - "An exhibiting society founded in 1884 that admitted any artist who paid the fee, with no jury and no prizes."
        - "The drawing-room gathering of writers, philosophes and patrons over which a hostess presided in eighteenth-century Paris."
        - "The state school of art whose annual prize sent the winner to Rome for several years at the Crown's expense."
    links: [art.manet.dejeuner-sur-l-herbe, art.movement.impressionism, art.gericault.raft-of-the-medusa, art.david.oath-of-the-horatii, art.cezanne, art.whistler]
    tags: [term, institution, salon, academy, salon-des-refuses, louvre, 1600s, 1800s]
    sources:
      - "Grove Art Online, 'Salon'"
      - "Patricia Mainardi, The End of the Salon: Art and the State in the Early Third Republic (1993)"
      - "Thomas Crow, Painters and Public Life in Eighteenth-Century Paris (1985)"
    reviewed_by: null

  - id: art.term.japonisme
    discipline: art
    kind: term
    title: "Japonisme"
    city: paris
    difficulty: 3
    era: Impressionist
    year: 1872
    definition: "The French craze for Japanese art after Japan's ports opened in the 1850s, and what painters took from the woodblock prints that came with it: flat areas of colour, high viewpoints, figures cut off by the frame, asymmetry and empty space. The word was coined by the critic Philippe Burty in 1872."
    pronunciation: "zha-po-NEEZM"
    language: French
    facts:
      - "Philippe Burty coined the word in articles in La Renaissance littéraire et artistique in 1872; the Japanese pavilion at the Paris Exposition Universelle of 1867 had been the first large public showing, and the dealer Siegfried Bing published the magazine Le Japon artistique from 1888 to 1891 and mounted an exhibition of prints at the École des Beaux-Arts in 1890."
      - "Monet collected some 230 Japanese prints, still on the walls at Giverny, and painted his wife in a red kimono in La Japonaise (1876); Manet's Portrait of Émile Zola (1868, Musée d'Orsay) has a sumo print and a Japanese screen behind the sitter."
      - "Van Gogh copied Hiroshige's Plum Orchard and Bridge in the Rain in oils in 1887 and painted Père Tanguy against a wall of prints; Mary Cassatt made her colour prints of 1891 after seeing Bing's exhibition."
      - "Degas's cropped figures and high viewpoints, Toulouse-Lautrec's flat poster colour and Whistler's Peacock Room all owe something to it."
    remark: "Monet owned about two hundred and thirty Japanese prints and they are still on the walls at Giverny; the cut-off figures and high viewpoints in Degas come from Hiroshige as much as from photography."
    gaffe: "Saying 'Japanism' and meaning kimonos. The kimono pictures are the least of it; the point is what the prints did to composition, which is why Van Gogh copied Hiroshige in oils in 1887."
    distractors:
      term:
        - "The eighteenth-century taste for Chinese and pseudo-Chinese decoration: pagodas, lacquer and blue-and-white porcelain."
        - "Painting outdoors, in front of the subject, rather than working up a landscape in the studio."
        - "The North African and Near Eastern subjects painted by Delacroix, Gérôme and Ingres in the decades after the conquest of Algeria."
    links: [art.degas, art.movement.impressionism, art.van-gogh.sunflowers, art.whistler, art.monet.impression-sunrise, art.manet.dejeuner-sur-l-herbe]
    tags: [term, japan, prints, ukiyo-e, impressionist, post-impressionist, 1870s, 1880s]
    sources:
      - "Grove Art Online, 'Japonisme'"
      - "Siegfried Wichmann, Japonisme: The Japanese Influence on Western Art since 1858 (1981)"
      - "Geneviève Lacambre et al., Le Japonisme (exhibition catalogue, Grand Palais and National Museum of Western Art, Tokyo, 1988)"
    reviewed_by: null
