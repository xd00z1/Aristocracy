  - id: art.movement.renaissance
    discipline: art
    kind: movement
    title: "The Renaissance"
    city: florence
    difficulty: 1
    era: Renaissance
    year: 1401
    year_end: 1527
    year_approx: true
    facts:
      - "The idea is Vasari's: in the Lives of 1550 he described a rinascita, a rebirth of the arts in Tuscany after the Middle Ages; the French word and the notion of a whole period came with Michelet in 1855 and Burckhardt's Civilization of the Renaissance in Italy in 1860."
      - "The usual starting line in Florence is the 1401 competition for the Baptistery doors; the founding generation is Brunelleschi in architecture, Donatello in sculpture and Masaccio in painting."
      - "Linear perspective, demonstrated by Brunelleschi and written up by Alberti in De pictura in 1435, is the technical signature; the money was Medici, from Cosimo il Vecchio's return in 1434 to Lorenzo the Magnificent's death in 1492."
      - "Art historians divide it into Early (the fifteenth century), High (Leonardo, Michelangelo and Raphael, roughly 1495 to 1520) and then Mannerism; the Sack of Rome in 1527 is the conventional end of the High Renaissance."
    remark: "The word is Vasari's, more or less: he wrote in 1550 of a rinascita of the arts, and he meant Florence; it took a Frenchman and a Swiss, Michelet and Burckhardt, to turn it into a period three centuries later."
    gaffe: "Using 'Renaissance' for anything old and Italian. Giotto is before it, Botticelli is Early, Leonardo and Michelangelo are High, and by the 1530s you are in Mannerism; the whole Florentine run is little more than a century."
    distractors:
      title: ["Mannerism", "The Baroque", "International Gothic"]
      era: [Baroque, Gothic, Neoclassical]
    links: [art.brunelleschi, art.giotto, art.botticelli.birth-of-venus, art.michelangelo.david, art.masaccio.expulsion-from-eden, opera.movement.florentine-camerata]
    tags: [movement, renaissance, florence, medici, vasari, 1400s, 1500s]
    sources:
      - "Grove Art Online, 'Renaissance'"
      - "Jacob Burckhardt, The Civilization of the Renaissance in Italy (1860)"
      - "Giorgio Vasari, Lives of the Artists (1550/1568), preface"
    reviewed_by: null

