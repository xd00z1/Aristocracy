  - id: art.michelangelo.david
    discipline: art
    kind: work
    title: "David"
    creator: Michelangelo
    city: florence
    difficulty: 1
    era: High Renaissance
    year: 1501
    year_end: 1504
    facts:
      - "Carved between 1501 and 1504 from a block of Carrara marble that Agostino di Duccio had roughed out in the 1460s and abandoned; it had lain in the cathedral workshop for decades before Michelangelo, aged twenty-six, was given it."
      - "Meant for a buttress of the cathedral, it went instead to the front of the Palazzo della Signoria in 1504, after a committee that included Leonardo and Botticelli discussed where to put it."
      - "Over five metres tall, it shows David before the fight, sling over his left shoulder; Donatello and Verrocchio had shown him afterwards, with Goliath's head at his feet."
      - "Moved indoors to the Galleria dell'Accademia in 1873; the copy in the Piazza della Signoria dates from 1910."
    remark: "It is the David before the fight, sling over the shoulder and no head at his feet, which is how you tell it from Donatello's; the republic put it outside the town hall in 1504, which was the point."
    gaffe: "Admiring the marble in the Piazza della Signoria. That is a copy of 1910; the original went indoors to the Accademia in 1873, where it has a rotunda to itself."
    media:
      image:
        commons: "File:Michelangelo David Philpot.jpg"
        source: "Photograph by John Brampton Philpot, mid-nineteenth century, showing the statue outside the Palazzo Vecchio; National Gallery of Art Library, Washington, via Wikimedia Commons"
        license: "Public Domain Mark (photographer died 1878); verify the file's tag when fetching"
        focus: { x: 0.5, y: 0.2 }
    distractors:
      creator: [Donatello, Andrea del Verrocchio, Baccio Bandinelli]
      title: ["Pietà", "Moses", "Bacchus"]
      era: [Early Renaissance, Mannerist, Baroque]
    links: [art.donatello.david, art.term.contrapposto, art.michelangelo.doni-tondo, art.movement.renaissance]
    tags: [sculpture, marble, accademia, republic, 1500s]
    sources:
      - "Galleria dell'Accademia, Florence, catalogue entry 'David'"
      - "Charles Seymour, Michelangelo's David: A Search for Identity (1967)"
      - "Grove Art Online, 'Michelangelo'"
    reviewed_by: null

  - id: art.ghiberti.gates-of-paradise
    discipline: art
    kind: work
    title: "The Gates of Paradise"
    creator: Lorenzo Ghiberti
    city: florence
    difficulty: 1
    era: Early Renaissance
    year: 1425
    year_end: 1452
    facts:
      - "Ghiberti's second pair of doors for the Baptistery, commissioned in 1425 and installed on the east side, facing the cathedral, in 1452; his first pair, won in the competition of 1401 against Brunelleschi, took from 1403 to 1424."
      - "Ten square gilded-bronze panels of Old Testament scenes, from Adam and Eve to Solomon and Sheba, in place of the twenty-eight small quatrefoils of the earlier doors."
      - "Vasari reports Michelangelo saying they were beautiful enough to be the gates of Paradise, which is where the name comes from."
      - "The gilded originals, damaged in the flood of 1966, were restored over more than twenty years and have been shown since 2012 in the Museo dell'Opera del Duomo; the doors on the Baptistery are copies installed in 1990."
      - "Ghiberti put his own portrait in the frame, a bald head looking out from among the prophets."
    remark: "What you are looking at on the Baptistery is a copy from 1990; the gilded originals were battered by the 1966 flood and now live across the piazza in the Museo dell'Opera, and the name is Vasari's report of a remark by Michelangelo."
    gaffe: "Saying Ghiberti won the 1401 competition with these. That contest, against Brunelleschi, was for the north doors; the Gates of Paradise are his second set, begun in 1425 and finished twenty-seven years later."
    media:
      image:
        commons: "File:De gebeeldhouwde deuren van Lorenzo Ghiberti in het Baptisterium van de Dom in Florence 360 Firenze Porta del Battistero detta del Paradiso Ghiberti (titel op object), RP-F-00-6929.jpg"
        source: "Nineteenth-century photograph of the doors, Rijksmuseum, Amsterdam, via Wikimedia Commons"
        license: "Public domain / CC0 (Rijksmuseum release); verify the file's tag when fetching"
        focus: { x: 0.5, y: 0.45 }
    distractors:
      creator: [Filippo Brunelleschi, Donatello, Andrea Pisano]
      title: ["The North Doors of the Baptistery", "The Sacrifice of Isaac", "The Cantoria"]
      era: [Gothic, High Renaissance, Baroque]
    links: [art.brunelleschi, art.donatello.david, art.movement.renaissance]
    tags: [sculpture, bronze, relief, baptistery, duomo, 1420s, 1450s]
    sources:
      - "Museo dell'Opera del Duomo, Florence, 'Porta del Paradiso'"
      - "Richard Krautheimer, Lorenzo Ghiberti (1956)"
