  - id: art.term.fresco
    discipline: art
    kind: term
    title: "Fresco"
    city: florence
    difficulty: 1
    era: Renaissance
    definition: "Painting on fresh, still-wet lime plaster, so that the pigment, mixed only with water, binds into the wall as it dries (buon fresco). The painter works in giornate, a day's patch of plaster at a time; painting on dry plaster is fresco secco, and it flakes."
    pronunciation: "FRESS-koh"
    language: Italian
    facts:
      - "Cennino Cennini's Il libro dell'arte, written around 1400, describes the method; the seams between one day's plaster and the next can still be seen and counted on Masaccio's Brancacci frescoes."
      - "The Sistine ceiling, the Brancacci Chapel and Fra Angelico's cells at San Marco are true fresco; Leonardo's Last Supper in Milan is not, and began to deteriorate within twenty years."
      - "Pigments have to survive the lime, so the range is limited: blues were often added afterwards a secco, which is why so much fresco sky has flaked off."
    remark: "Fresco means fresh: the colour goes onto wet plaster and becomes part of the wall, which is why you can count the day-joins on a Masaccio, and why Leonardo's Last Supper, which was not one, started coming off within twenty years."
    gaffe: "Calling every painting on a wall a fresco. The Last Supper is the great exception, painted on a dry wall in a mixture of Leonardo's own devising, and its condition is the price."
    distractors:
      term:
        - "Painting in pigment bound with egg yolk on a gessoed wooden panel, the standard method before oil."
        - "A round painting or relief, popular in Florentine houses in the fifteenth century."
        - "A full-scale preparatory drawing, pricked or incised to transfer the design to the wall."
    links: [art.masaccio.expulsion-from-eden, art.fra-angelico.annunciation-san-marco, art.giotto]
    tags: [term, technique, fresco, plaster, brancacci-chapel]
    sources:
      - "Grove Art Online, 'Fresco'"
      - "Cennino Cennini, Il libro dell'arte (trans. Daniel V. Thompson, 1933)"
    reviewed_by: null

  - id: art.term.contrapposto
    discipline: art
    kind: term
    title: "Contrapposto"
    city: florence
    difficulty: 2
    era: Renaissance
    definition: "Italian for 'counterpoise': a standing figure with its weight on one leg, so that the hips tilt one way and the shoulders the other and the body settles into a gentle S. The Greek invention that makes a statue look able to move, revived in Florence by Donatello and made colossal in Michelangelo's David."
    pronunciation: "kon-trah-POS-toh"
    language: Italian
    facts:
      - "Polykleitos's Doryphoros of about 440 BC is the textbook ancient example; the Greeks worked the pose out in the fifth century BC, and medieval sculpture lost it."
      - "Donatello's marble Saint Mark for Orsanmichele, of about 1411 to 1413, is usually cited as the first full Renaissance revival; Michelangelo's David is the most famous."
      - "The word in Italian also means 'antithesis' in rhetoric; art historians borrowed it for the pose."
    remark: "Weight on one leg, hip up on that side, shoulder down on the same side: it is what makes a statue look as if it could take a step, and Donatello's Saint Mark at Orsanmichele is where Florence got it back from the Greeks."
    gaffe: "Using it for any twisting pose. A figure spiralling on its own axis is a figura serpentinata, which is Mannerist and later; contrapposto is standing still with the weight on one foot."
    distractors:
      term:
        - "The smoky blending of tones so that outlines dissolve, as in Leonardo's faces."
        - "Strong contrast of light and shadow used to model form, as in Caravaggio."
        - "Relief carved so shallow that the figures barely rise from the ground, a Donatello speciality."
    links: [art.michelangelo.david, art.donatello.david]
    tags: [term, sculpture, pose, greek, donatello, michelangelo]
    sources:
      - "Grove Art Online, 'Contrapposto'"
      - "Grove Art Online, 'Donatello'"
    reviewed_by: null
