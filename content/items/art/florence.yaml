  - id: art.giotto
    discipline: art
    kind: creator
    title: "Giotto"
    city: florence
    difficulty: 1
    era: Proto-Renaissance
    year: 1267
    year_approx: true
    year_end: 1337
    facts:
      - "Born near Florence about 1267 and died in Florence in January 1337; Dante, his contemporary, wrote in the Purgatorio that Cimabue had thought to hold the field in painting, 'and now Giotto has the cry'."
      - "His Ognissanti Madonna of about 1310 hangs in the first room of the Uffizi beside Cimabue's Santa Trinita Maestà and Duccio's Rucellai Madonna, so the change he made can be seen in one glance."
      - "The Scrovegni Chapel in Padua, frescoed about 1305, is his masterpiece; in Florence he frescoed the Bardi and Peruzzi chapels in Santa Croce."
      - "Appointed master of works for Florence cathedral in 1334, he designed the bell tower that still carries his name."
      - "The stories that Cimabue found him as a shepherd boy drawing a sheep on a rock, and that he drew a perfect circle freehand for the Pope's messenger, are told by Ghiberti and Vasari a century and more later."
    remark: "Dante put him in the Purgatorio while he was still alive, saying Cimabue had held the field in painting and now Giotto had the cry, and the Uffizi hangs his Ognissanti Madonna beside Cimabue's so you can check."
    gaffe: "Placing the Scrovegni Chapel in Florence. It is in Padua; Florence has the Ognissanti Madonna in the Uffizi, the Bardi and Peruzzi chapels in Santa Croce and the Campanile."
    media:
      image:
        commons: "File:Giotto Ognissanti Madonna.jpg"
        source: "Ognissanti Madonna, c. 1310, Uffizi, Florence, via Wikimedia Commons"
        license: "Public domain (artist died 1337); verify the file's tag when fetching"
        focus: { x: 0.5, y: 0.35 }
    distractors:
      person: [Cimabue, Duccio, Simone Martini]
      era: [International Gothic, Early Renaissance, Byzantine]
    links: [art.movement.renaissance, art.term.fresco]
    tags: [painter, proto-renaissance, uffizi, santa-croce, campanile, 1300s]
    sources:
      - "Grove Art Online, 'Giotto'"
      - "Dante, Purgatorio XI, 94–96"
      - "Uffizi Galleries, catalogue entry 'Ognissanti Madonna'"
    reviewed_by: null

  - id: art.brunelleschi
    discipline: art
    kind: creator
    title: "Filippo Brunelleschi"
    city: florence
    difficulty: 1
    era: Early Renaissance
    year: 1377
    year_end: 1446
    facts:
      - "Trained as a goldsmith; lost the 1401 competition for the Baptistery doors to Ghiberti, and both trial panels of the Sacrifice of Isaac are in the Bargello."
      - "Entered the 1418 competition for a model of the cathedral dome, which had stood open since Arnolfo di Cambio began the church in 1296, and built it from 1420 to 1436 as an inner and an outer shell with herringbone brickwork, without wooden centring across the void."
      - "The dome, about 45 metres across, is still the largest brick dome ever built; the lantern on top is his design but was finished after his death."
      - "His demonstration of linear perspective with painted panels of the Baptistery and the Piazza della Signoria, described by his biographer Manetti, is the foundation of Renaissance picture space; Alberti wrote the method up in De pictura in 1435."
      - "Also built the Ospedale degli Innocenti, San Lorenzo, Santo Spirito and the Pazzi Chapel; he is buried in the cathedral."
    remark: "The dome went up without a wooden frame across the void, an inner and an outer shell with the bricks laid in a herringbone, and the man who worked it out had lost the Baptistery doors competition to Ghiberti twenty years earlier; both trial panels are in the Bargello."
    gaffe: "Crediting him with the cathedral. Arnolfo di Cambio began it in 1296; Brunelleschi's job, from 1420 to 1436, was the hole in the roof that nobody for a century had known how to cover."
    media:
      image:
        commons: "File:Fratelli Alinari Duomo Firenze c1860s.jpg"
        source: "Photograph of the cathedral and dome by Fratelli Alinari, c. 1860s, via Wikimedia Commons"
        license: "Public domain (nineteenth-century photograph); verify the file's tag when fetching"
        focus: { x: 0.55, y: 0.3 }
    distractors:
      person: [Lorenzo Ghiberti, Leon Battista Alberti, Michelozzo]
      era: [Gothic, High Renaissance, Baroque]
    links: [art.ghiberti.gates-of-paradise, art.masaccio.expulsion-from-eden, art.movement.renaissance]
    tags: [architect, engineer, dome, duomo, perspective, 1400s]
    sources:
      - "Grove Art Online, 'Brunelleschi, Filippo'"
      - "Antonio Manetti, The Life of Brunelleschi (ed. Howard Saalman, 1970)"
      - "Howard Saalman, Filippo Brunelleschi: The Cupola of Santa Maria del Fiore (1980)"
    reviewed_by: null

