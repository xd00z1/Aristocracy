# Florence: the Renaissance taught where it happened. The Uffizi (Botticelli,
# Michelangelo's one panel), the Accademia and the Bargello (the two Davids),
# the Brancacci Chapel, the Baptistery doors, San Marco, and the dome. Creators
# are the beginning (Giotto) and the engineer (Brunelleschi); Botticelli and
# Michelangelo are taught through their works. Sculpture images need
# public-domain photographs, so where a nineteenth-century print exists on
# Commons it is used; Donatello's David has none confirmed and carries no image.
items:
  # ---------------------------------------------------------------------------
  # Works
  # ---------------------------------------------------------------------------

  - id: art.botticelli.birth-of-venus
    discipline: art
    kind: work
    title: "The Birth of Venus"
    creator: Sandro Botticelli
    city: florence
    difficulty: 1
    era: Early Renaissance
    year: 1485
    year_approx: true
    facts:
      - "Tempera on canvas, about 172 by 278 centimetres, in the Uffizi; canvas was an unusual support in fifteenth-century Florence, where panel was the rule."
      - "First recorded by Vasari in 1550 at the Medici villa at Castello, together with the Primavera; who commissioned it is not documented, though Lorenzo di Pierfrancesco de' Medici is the usual guess."
      - "Venus stands in the pose of an ancient Venus pudica, blown ashore by Zephyr while a figure usually identified as one of the Horae holds out a flowered cloak."
      - "The subject is usually traced to Poliziano's Stanze per la giostra, a poem of the 1470s for Giuliano de' Medici that describes the birth of Venus."
    remark: "Nobody knows who ordered it: it turns up first in 1550, when Vasari saw it at the Medici villa at Castello beside the Primavera, and everything said about Lorenzo di Pierfrancesco commissioning it is inference."
    gaffe: "Looking for it in the Accademia. That is where the David is; the Venus is in the Uffizi, in the same room as the Primavera, and it is on canvas, not fresco."
    media:
      image:
        commons: "File:Sandro Botticelli - La nascita di Venere - Google Art Project - edited.jpg"
        source: "Uffizi, Florence, via Wikimedia Commons (Google Art Project)"
        license: "Public domain (artist died 1510); verify the file's tag when fetching"
        focus: { x: 0.52, y: 0.3 }
    distractors:
      creator: [Domenico Ghirlandaio, Filippino Lippi, Piero di Cosimo]
      title: ["Primavera", "Venus and Mars", "Pallas and the Centaur"]
      era: [High Renaissance, Mannerist, Venetian Renaissance]
    links: [art.botticelli.primavera, art.movement.renaissance]
    tags: [painting, tempera, mythology, uffizi, medici, 1480s]
    sources:
      - "Uffizi Galleries, catalogue entry 'The Birth of Venus'"
      - "Ronald Lightbown, Sandro Botticelli: Life and Work (1989)"
      - "Giorgio Vasari, Lives of the Artists (1550/1568), Life of Botticelli"
    reviewed_by: null

  - id: art.botticelli.primavera
    discipline: art
    kind: work
    title: "Primavera"
    creator: Sandro Botticelli
    city: florence
    difficulty: 1
    era: Early Renaissance
    year: 1480
    year_approx: true
    facts:
      - "Tempera on panel, about 203 by 314 centimetres; listed in a 1499 inventory of the Florentine town house of Lorenzo and Giovanni di Pierfrancesco de' Medici, and seen by Vasari at the villa at Castello in 1550."
      - "Read from right to left: Zephyr seizes the nymph Chloris, who turns into Flora, the figure scattering roses, as told in Ovid's Fasti; Venus stands in the middle with a blindfolded Cupid above her, then the three Graces, then Mercury."
      - "The title is not Botticelli's: Vasari described the picture as Venus adorned by the Graces with flowers, 'denoting spring', and Primavera stuck."
      - "Botanists have identified well over a hundred species of plants in the meadow, most of them flowering in spring."
    remark: "Read it from right to left: the blue Zephyr grabs the nymph Chloris, flowers spill from her mouth, and she becomes Flora next to her; the story is from Ovid's Fasti, and the title is Vasari's, not Botticelli's."
    gaffe: "Confusing it with the Birth of Venus. Venus is in both, but here she is clothed and standing in an orange grove, there is no shell, and it is on panel rather than canvas."
    media:
      image:
        commons: "File:Botticelli-primavera.jpg"
        source: "Uffizi, Florence, via Wikimedia Commons"
        license: "Public domain (artist died 1510); verify the file's tag when fetching"
        focus: { x: 0.68, y: 0.45 }
    distractors:
      creator: [Filippino Lippi, Domenico Ghirlandaio, Andrea del Verrocchio]
      title: ["The Birth of Venus", "Venus and Mars", "The Adoration of the Magi"]
      era: [High Renaissance, Mannerist, Baroque]
    links: [art.botticelli.birth-of-venus, art.movement.renaissance]
    tags: [painting, tempera, mythology, uffizi, medici, ovid, 1480s]
    sources:
      - "Uffizi Galleries, catalogue entry 'Spring (Primavera)'"
      - "Ronald Lightbown, Sandro Botticelli: Life and Work (1989)"
