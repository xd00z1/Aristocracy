    reviewed_by: null

  - id: art.masaccio.expulsion-from-eden
    discipline: art
    kind: work
    title: "The Expulsion from the Garden of Eden"
    creator: Masaccio
    city: florence
    difficulty: 2
    era: Early Renaissance
    year: 1425
    year_approx: true
    facts:
      - "A fresco of about 1425 on the entrance pier of the Brancacci Chapel in Santa Maria del Carmine, facing Masolino's Temptation of Adam and Eve on the opposite pier."
      - "Masaccio, born Tommaso di ser Giovanni in 1401, died in Rome in 1428 aged twenty-six; Filippino Lippi finished the chapel's frescoes in the 1480s."
      - "The fig leaves that covered Adam and Eve for three centuries, added in the late seventeenth century under the Medici grand dukes, were removed in the restoration completed in 1990."
      - "Michelangelo's Expulsion on the Sistine ceiling echoes Adam's gesture; Vasari says the chapel was where the later Florentine painters went to learn."
    remark: "For three hundred years they wore fig leaves put on under the Medici grand dukes; the restoration finished in 1990 took them off, and what is left is Masaccio, dead at twenty-six, painting grief as body weight, Eve howling and Adam hiding his face."
    gaffe: "Treating Masaccio and Masolino as one painter, or as father and son. Two men, unrelated: Masolino painted the graceful Temptation across the arch, Masaccio the Expulsion, and the contrast is the point of the chapel."
    media:
      image:
        commons: "File:Masaccio-TheExpulsionOfAdamAndEveFromEden-Restoration.jpg"
        source: "Brancacci Chapel, Santa Maria del Carmine, Florence, via Wikimedia Commons"
        license: "Public domain (artist died 1428); verify the file's tag when fetching"
        focus: { x: 0.62, y: 0.28 }
    distractors:
      creator: [Masolino da Panicale, Fra Filippo Lippi, Paolo Uccello]
      title: ["The Tribute Money", "The Holy Trinity", "The Temptation of Adam and Eve"]
      era: [Gothic, High Renaissance, Mannerist]
    links: [art.term.fresco, art.brunelleschi, art.movement.renaissance]
    tags: [fresco, brancacci-chapel, carmine, adam-and-eve, 1420s]
    sources:
      - "Grove Art Online, 'Masaccio'"
      - "Umberto Baldini and Ornella Casazza, The Brancacci Chapel Frescoes (1992)"
      - "Giorgio Vasari, Lives of the Artists, Life of Masaccio"
    reviewed_by: null

  - id: art.donatello.david
    discipline: art
    kind: work
    title: "David (bronze)"
    creator: Donatello
    city: florence
    difficulty: 2
    era: Early Renaissance
    year: 1440
    year_approx: true
    facts:
      - "Bronze, about 158 centimetres tall, in the Bargello; its date is not documented and estimates run from the 1430s to the 1450s."
      - "Usually called the first free-standing nude statue since antiquity; David wears a laurelled hat and boots, nothing else, and stands on Goliath's severed head with a wing of Goliath's helmet running up the inside of his thigh."
      - "First recorded in 1469, in the courtyard of the Medici palace, at the wedding of Lorenzo the Magnificent; after the Medici were expelled in 1494 it was moved to the courtyard of the Palazzo della Signoria."
      - "Donatello had carved a marble David thirty years earlier, in 1408 to 1409, also now in the Bargello."
    remark: "Hat, boots and nothing else, standing on Goliath's head: it is the first free-standing nude cast since antiquity, and it stood in the Medici courtyard, so this is what the inside of a fifteenth-century bank looked like."
    gaffe: "Assuming 'the David' means Michelangelo's. In the Bargello it means this one, about sixty years older, bronze, life-size, and after the fight rather than before it."
    distractors:
      creator: [Andrea del Verrocchio, Lorenzo Ghiberti, Michelangelo]
      title: ["Saint George", "Judith and Holofernes", "Gattamelata"]
      era: [Gothic, High Renaissance, Mannerist]
    links: [art.michelangelo.david, art.term.contrapposto, art.ghiberti.gates-of-paradise]
    tags: [sculpture, bronze, nude, bargello, medici, 1440s]
    sources:
      - "Museo Nazionale del Bargello, Florence, catalogue entry 'David'"
      - "H. W. Janson, The Sculpture of Donatello (1957)"
      - "Grove Art Online, 'Donatello'"
    reviewed_by: null

  - id: art.fra-angelico.annunciation-san-marco
    discipline: art
    kind: work
    title: "The Annunciation (San Marco)"
    creator: Fra Angelico
    city: florence
    difficulty: 2
    era: Early Renaissance
    year: 1440
    year_approx: true
    facts:
      - "A fresco at the top of the stairs to the friars' dormitory in the convent of San Marco, which Cosimo de' Medici had rebuilt by Michelozzo from the late 1430s; Fra Angelico frescoed the cells and corridors over the following decade."
      - "The loggia in which Gabriel and Mary meet is modelled on Michelozzo's own architecture in the cloister below: slender columns, plain capitals, whitewashed walls."
      - "An inscription beneath tells the passer-by, on coming before the image of the intact Virgin, not to forget to say an Ave."
      - "Fra Angelico, born Guido di Pietro, was a Dominican friar; he was beatified in 1982 and named patron of artists by John Paul II in 1984. He painted the Annunciation several times, including the panel now in the Prado and a second fresco inside cell 3 at San Marco."
    remark: "It is painted where the friars met it every night on the way up to bed, at the head of the dormitory stairs, and the line underneath tells you to say an Ave Maria as you pass; it was made to be used, not visited."
    gaffe: "Assuming there is one Fra Angelico Annunciation. He painted the subject at least four times, including a panel in the Prado and a second fresco inside a cell a few yards away; this is the one at the top of the stairs, with Michelozzo's loggia in it."
    media:
      image:
        commons: "File:ANGELICO, Fra Annunciation, 1437-46 (2236990916).jpg"
        source: "Museo di San Marco, Florence, via Wikimedia Commons"
        license: "Public domain (artist died 1455); verify the file's tag when fetching"
        focus: { x: 0.74, y: 0.42 }
    distractors:
      creator: [Fra Filippo Lippi, Benozzo Gozzoli, Domenico Veneziano]
      title: ["The Coronation of the Virgin", "The Deposition", "The San Marco Altarpiece"]
      era: [Gothic, High Renaissance, Baroque]
    links: [art.term.fresco, art.movement.renaissance]
    tags: [fresco, san-marco, annunciation, dominican, medici, 1440s]
    sources:
      - "Museo di San Marco, Florence, catalogue entry 'Annunciazione' (north corridor)"
      - "John Pope-Hennessy, Fra Angelico (2nd ed., 1974)"
      - "William Hood, Fra Angelico at San Marco (1993)"
    reviewed_by: null

  - id: art.michelangelo.doni-tondo
    discipline: art
    kind: work
    title: "The Doni Tondo"
    creator: Michelangelo
    city: florence
    difficulty: 3
    era: High Renaissance
    year: 1507
    year_approx: true
    facts:
      - "A round panel, about 120 centimetres across, of the Holy Family with the infant Baptist, painted for the Florentine merchant Agnolo Doni, probably around his marriage to Maddalena Strozzi in 1504; it is still in its original carved frame."
      - "The only finished panel painting universally accepted as Michelangelo's; the two panels in the National Gallery, London, are unfinished and their attribution has been argued over."
      - "Raphael painted the portraits of Agnolo and Maddalena Doni at about the same time; long in the Palazzo Pitti, they were moved to the Uffizi in 2018 and now hang in the same room as the tondo."
      - "Vasari tells a story that Doni tried to pay less than the agreed price and Michelangelo responded by doubling it."
      - "The nude young men on the wall behind the Holy Family have never been satisfactorily explained; the usual reading makes them the pagan world before the coming of grace."
    remark: "It is the only panel painting everyone agrees Michelangelo finished, and it looks like sculpture; the Virgin twists like a figure on the Sistine ceiling, which he began the year after."
    gaffe: "Attributing it to Raphael because Raphael painted the Donis. Raphael did the husband and wife, which since 2018 hang beside it in the Uffizi; Michelangelo did their tondo, and the naked youths at the back are the giveaway."
    media:
      image:
        commons: "File:Michelangelo Buonarroti - Tondo Doni - Google Art Project.jpg"
        source: "Uffizi, Florence, via Wikimedia Commons (Google Art Project)"
        license: "Public domain (artist died 1564); verify the file's tag when fetching"
        focus: { x: 0.45, y: 0.4 }
    distractors:
      creator: [Raphael, Fra Bartolomeo, Andrea del Sarto]
      title: ["Madonna of the Goldfinch", "The Holy Family with Saint Elizabeth", "Madonna of the Harpies"]
      era: [Early Renaissance, Mannerist, Baroque]
    links: [art.michelangelo.david, art.movement.renaissance]
    tags: [painting, tondo, holy-family, uffizi, 1500s]
    sources:
      - "Uffizi Galleries, catalogue entry 'Doni Tondo'"
      - "Grove Art Online, 'Michelangelo'"
      - "Giorgio Vasari, Lives of the Artists, Life of Michelangelo"
    reviewed_by: null

