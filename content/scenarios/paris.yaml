# Remark scenarios: a social situation, three replies. Exactly one `correct`
# (specific, graceful, shows knowledge), one `wrong` (a factual error), one
# `gaffe` (socially exposing). Every option carries an explanation shown after
# answering.
scenarios:
  - id: scenario.paris.versailles-leash
    city: paris
    discipline: history
    difficulty: 1
    setting: "Dinner in the seventh arrondissement. The conversation has reached Versailles."
    prompt: "Your host says: \"Of course, Versailles was Louis XIV's way of keeping the nobles busy, wasn't it?\""
    options:
      - kind: correct
        text: "Busy and broke. Making them live at court on his timetable was the point; the etiquette was the leash, and Saint-Simon spent forty years resenting it in his memoirs."
        explanation: "Specific, agrees where the host is right, and adds one thing they did not know (Saint-Simon's memoirs). This is the register to aim for."
      - kind: wrong
        text: "It was Louis XV who built it, actually; Louis XIV preferred the Louvre."
        explanation: "Wrong. Louis XIII built the hunting lodge; Louis XIV turned it into the palace and moved the court there in 1682. Louis XV inherited it."
      - kind: gaffe
        text: "I have never understood why anyone bothers with Versailles. It is just a very big house."
        explanation: "A gaffe: it dismisses your host's subject and announces you have nothing to add. Philistinism is not the same as wit."
    links: [history.episode.louis-xiv-versailles, history.person.marie-antoinette]
    sources:
      - "Saint-Simon, Mémoires"
    reviewed_by: null

  - id: scenario.paris.impressionist-insult
    city: paris
    discipline: art
    difficulty: 1
    setting: "A bench in the Musée d'Orsay, in front of Renoir's Bal du moulin de la Galette."
    prompt: "Your companion says: \"The Impressionists. They took the name from Monet's sunrise themselves, I suppose.\""
    options:
      - kind: correct
        text: "A critic gave it to them, and he meant it unkindly: Louis Leroy in Le Charivari, on 25 April 1874, headed his review of their first show 'Exhibition of the Impressionists' after Monet's Impression, soleil levant. They had hung under a company name, the Société anonyme of painters, sculptors and engravers, and only put the insult over their own door at the third exhibition, in 1877, where this Renoir was the big picture."
        explanation: "The register to aim for: your companion's instinct about the picture is right, only the direction of travel is wrong, and the correction arrives with a date attached. The first exhibition opened on 15 April 1874 at 35 boulevard des Capucines, in the photographer Nadar's old studio; Leroy's satire in Le Charivari ten days later took its title from Monet's canvas and the label stuck. The painters had registered themselves as a limited company, the Société anonyme des artistes peintres, sculpteurs et graveurs. 'Exposition des Impressionnistes' went up over the entrance only at the third show, in April 1877 in the rue Le Peletier, where Renoir hung the Bal du moulin de la Galette."
      - kind: wrong
        text: "And the sunrise itself is here, two rooms along."
        explanation: "Wrong museum, and it is the standard Paris mistake. Impression, Sunrise is in the Musée Marmottan Monet, out in the sixteenth, given in 1940 by Victorine Donop de Monchy, daughter of Monet's doctor and collector Georges de Bellio. The Orsay has Monet in quantity but has never had that one; the Marmottan lost it to thieves in October 1985 and got it back from Corsica in December 1990."
      - kind: gaffe
        text: "Renoir is a biscuit tin, though. My grandmother had this one on a tray."
        explanation: "A gaffe: it sneers at the picture the bench was put there for, in answer to someone who asked you a real question. The tray came after the painting. This one was carried up to Montmartre and worked on the spot in 1876, in a dance garden beside two old windmills that were open on Sunday afternoons; the patches on the dancers are sunlight through acacia leaves, and the sitters are Renoir's friends, the journalist Georges Rivière among them. If you must place it, place it correctly: the Moulin de la Galette ground flour, and the Moulin Rouge did not open at the foot of the hill until 1889."
    links: [art.renoir.bal-du-moulin-de-la-galette, art.monet.impression-sunrise, art.movement.impressionism]
    sources:
      - "Musée d'Orsay, catalogue entry RF 2739 (Bal du moulin de la Galette)"
      - "Louis Leroy, 'L'Exposition des impressionnistes', Le Charivari, 25 April 1874"
      - "Musée Marmottan Monet, collection entry 'Impression, soleil levant'"
      - "John Rewald, The History of Impressionism (4th rev. ed., 1973)"
    reviewed_by: null

  - id: scenario.paris.mona-lisa-theft
    city: paris
    discipline: art
    difficulty: 1
    setting: "A Sunday at the Louvre. You have worked your way to within four rows of the Mona Lisa in the Salle des États."
    prompt: "Your friend says, over the raised telephones in front of you: \"It is only famous because somebody stole it, isn't it?\""
    options:
      - kind: correct
        text: "A good deal of it, yes. Vincenzo Peruggia, an Italian house painter who had fitted protective glass on pictures there, carried it out under his smock in August 1911, and for two years people queued to look at the empty wall; he was caught in Florence in December 1913, trying to sell it to a dealer. While we are penned in here, turn round: the Veronese behind us was taken out of a Venetian refectory by Napoleon's commissioners in 1797 and never went home."
        explanation: "Right, and it rescues a bad half-hour by giving your friend a second thing to look at. The theft was on 21 August 1911, and Peruggia had worked in the Louvre glazing pictures. The painting reappeared when he offered it to the dealer Alfredo Geri in Florence, who brought in Giovanni Poggi, director of the Uffizi, in December 1913. Facing the Mona Lisa across the Salle des États is Veronese's Wedding at Cana, painted for the refectory of San Giorgio Maggiore in Venice and removed by the French in 1797; it is still in Paris."
      - kind: wrong
        text: "Apollinaire took it. He confessed, and did a week for it."
        explanation: "Wrong man, roughly the right week. Guillaume Apollinaire was arrested on 7 September 1911 and held for a few days, and Picasso was questioned, but over Iberian statuettes that Apollinaire's secretary Géry Pieret had lifted from the Louvre and sold on; both were released, and neither had anything to do with the Mona Lisa. Peruggia was not identified for two years."
      - kind: gaffe
        text: "It is Leonardo himself, of course, in a wig. Somebody laid the two faces over each other and proved it."
        explanation: "A gaffe: it presents a fringe claim as common knowledge, at the top of your voice, in front of the label. The overlay was a computer exercise of the 1980s and has persuaded no curator. Vasari named the sitter in 1550 as the wife of the Florentine cloth merchant Francesco del Giocondo, which is why the French call her La Joconde, and a note written in the margin of a Cicero by the chancery clerk Agostino Vespucci in October 1503, found at Heidelberg in 2005, has Leonardo at work on the head of Lisa del Giocondo. Who she was is settled; what she is doing with her mouth is not."
    links: [art.leonardo.mona-lisa, history.episode.napoleon-egypt-coronation-louvre]
    sources:
      - "Musée du Louvre, catalogue entry Inv. 779 (Portrait de Lisa Gherardini, dite Monna Lisa)"
      - "Martin Kemp and Giuseppe Pallanti, Mona Lisa: The People and the Painting (2017)"
      - "Giorgio Vasari, Lives of the Artists (1550/1568), Life of Leonardo da Vinci"
    reviewed_by: null

  - id: scenario.paris.sacre-riot
    city: paris
    discipline: music
    difficulty: 2
    setting: "Supper after a concert at the Théâtre des Champs-Élysées. Someone down the table has brought up the riot."
    prompt: "Your host says: \"The Rite of Spring. They rioted at the music, didn't they? Paris could not bear the sound of it.\""
    options:
      - kind: correct
        text: "At the steps, mostly. Nijinsky had the dancers standing with their feet turned in and stamping, in a theatre eight weeks old, and the din got so bad that he stood on a chair in the wings shouting the counts while Stravinsky watched beside him. The notes were forgiven inside a year: Monteux conducted it in concert at the Casino de Paris in April 1914 and the crowd carried Stravinsky out on their shoulders."
        explanation: "The register to aim for: it grants the riot, moves the blame to where the evidence puts it, and hands your host a fact she can use. Le Sacre du printemps was given by Diaghilev's Ballets Russes on 29 May 1913 at the Théâtre des Champs-Élysées, which had opened that April, with choreography by Vaslav Nijinsky, designs by Nicholas Roerich and Pierre Monteux conducting. Stravinsky left his seat for the wings, where Nijinsky was calling the beats to dancers who could not hear the orchestra. Monteux's concert performance at the Casino de Paris on 5 April 1914 was a triumph, which is the argument that it was never the music."
      - kind: wrong
        text: "It was at the Opéra, and Diaghilev took it off after the first night."
        explanation: "Wrong on both counts. The house was the impresario Gabriel Astruc's new Théâtre des Champs-Élysées on the avenue Montaigne, not the Palais Garnier; and nothing was withdrawn. The Rite was danced a handful more times in Paris and again in London that summer before Nijinsky's choreography went out of the repertoire and was lost, to be reconstructed for the Joffrey Ballet only in 1987."
      - kind: gaffe
        text: "Saint-Saëns walked out at the first bassoon note, they say. He knew what a bassoon could and could not be asked to do."
        explanation: "A gaffe, and a well-travelled one: the story comes from Stravinsky himself, told long afterwards, and there is no evidence that Saint-Saëns was in the theatre that night. Producing it as an eyewitness detail marks you as a man who has read one paragraph. The documented evening is quieter and better company: Debussy and Stravinsky played the score through as a piano duet at Louis Laloy's house at Bellevue in June 1912, a year before anybody rioted."
    links: [music.stravinsky.le-sacre-du-printemps, history.person.diaghilev, music.saint-saens.le-cygne]
    sources:
      - "Grove Music Online, 'Stravinsky, Igor'"
      - "Thomas Forrest Kelly, First Nights: Five Musical Premieres (2000)"
      - "Richard Taruskin, Stravinsky and the Russian Traditions (1996)"
    reviewed_by: null

  - id: scenario.paris.garnier-chandelier
    city: paris
    discipline: opera
    difficulty: 2
    setting: "Interval at the Palais Garnier, half way up the grand staircase."
    prompt: "Your host says: \"The chandelier came down on the audience here once, you know. That is where Leroux got the Phantom.\""
    options:
      - kind: correct
        text: "One of its counterweights, rather: it came through the ceiling on the evening of 20 May 1896, during Hellé, and killed a woman sitting in the gallery. The lake is real as well. Garnier kept striking water under the site, gave up fighting it and built a tank down there, and the Paris fire brigade still dives in it."
        explanation: "Right, and it repays a good story with two better facts. On 20 May 1896 a counterweight from the great chandelier fell through the auditorium ceiling and killed a spectator; Gaston Leroux took the accident into Le Fantôme de l'Opéra in 1910, and the water under the stage with it. That water is a walled cistern Charles Garnier built when the foundations kept filling during construction; it is still there, and the fire brigade uses it for diving practice."
      - kind: wrong
        text: "It was during Faust, which is why Leroux built his novel round a performance of it."
        explanation: "Wrong opera, and the inference does not hold either. The counterweight fell during Hellé, by Alphonse Duvernoy. Faust is everywhere in Leroux's novel because Gounod's Faust was the warhorse of the house, the piece a Paris audience could be assumed to know by heart, not because of anything that happened in 1896."
      - kind: gaffe
        text: "Leroux invented all of it, of course. The accident, the lake, the whole business; it is a story for coach parties."
        explanation: "A gaffe: a sneer that is also wrong, which is the worst pairing available. The counterweight fell and killed somebody in 1896, and there is water beneath the stage in a cistern the architect built because the ground would not stay dry. Telling your host at the interval that her subject is invented for tourists, in the building where it happened, costs you the second half of the evening. Worth knowing before you condescend to the place: since the Opéra Bastille opened on 13 July 1989 the Garnier has been chiefly the ballet house."
    links: [opera.venue.palais-garnier, opera.venue.opera-bastille, opera.gounod.faust.jewel-song]
    sources:
      - "Opéra national de Paris, '20 May 1896' (Les 350 ans, from the cellars to the rooftops)"
      - "Christopher Curtis Mead, Charles Garnier's Paris Opéra: Architectural Empathy and the Renaissance of French Classicism (1991)"
      - "Gaston Leroux, Le Fantôme de l'Opéra (1910)"
    reviewed_by: null

  - id: scenario.paris.degas-dreyfus
    city: paris
    discipline: history
    difficulty: 3
    setting: "A private view at a dealer's in the rue de Seine: a small room of Degas pastels, dancers at the barre."
    prompt: "Your host says: \"Degas was for Dreyfus, naturally. That whole generation was.\""
    options:
      - kind: correct
        text: "Degas was the other way, I am afraid, and it cost him his oldest friends: he stopped dining with the Halévys at the end of 1897 and did not go through the door again until Ludovic lay dying in 1908, the same Halévy who wrote the libretto of Carmen. Monet and Pissarro were the ones on Zola's side, and Pissarro was Jewish, which is what made it a quarrel among friends rather than a debate."
        explanation: "Right, and it declines to launder a painter your host plainly loves without lecturing her. The affair went through the studios as it went through the country: Monet put his name to the protests that followed J'accuse...! on 13 January 1898, Pissarro was a Dreyfusard, and Degas, who had eaten at the Halévys' table since boyhood, broke with them at the end of 1897 and came back only when Ludovic Halévy was dying in 1908. Halévy had written Carmen with Meilhac. Renoir was against Dreyfus too; the split ran through the movement, not around it."
      - kind: wrong
        text: "He signed for Zola, and the Halévys never forgave him for it."
        explanation: "The consequence is right and the cause is upside down. Degas did lose the Halévys over the affair, but because he was against Dreyfus and would not stop saying so at their table. The protests that followed J'accuse...! carried Monet's name; Degas's is on nothing of the kind, and it was his hosts, not he, who were on Zola's side."
      - kind: gaffe
        text: "Does it signify? One does not buy a dancer for her politics."
        explanation: "A gaffe twice over: it waves away your host's subject at her friend's private view, and it treats the pictures as furnishing in front of the man selling them. Degas's politics are the standard question about Degas, and Linda Nochlin's essay on the artist and the affair is on every reading list, so the subject will come back. Nor were the dancers ornaments: the girls at the barre were the petits rats of the Opéra, children of poor families drilled for years and watched from the wings by the subscribers who paid for the access."
    links: [art.degas, history.episode.dreyfus-affair, opera.bizet.carmen.habanera]
    sources:
      - "Ruth Harris, The Man on Devil's Island: Alfred Dreyfus and the Affair that Divided France (2010)"
      - "Linda Nochlin, 'Degas and the Dreyfus Affair: A Portrait of the Artist as an Anti-Semite', in Norman L. Kleeblatt (ed.), The Dreyfus Affair: Art, Truth, and Justice (1987)"
      - "Jean-Denis Bredin, The Affair: The Case of Alfred Dreyfus (1986)"
    reviewed_by: null
